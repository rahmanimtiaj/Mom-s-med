window.addEventListener('resize', ()=>{
  const active = document.querySelector('nav.tabs button.active');
  if(active) moveTabIndicator(active);
});
function updateFabForTab(){
  const fab = document.getElementById('fabAdd');
  const titles = {today:'Add medication', manage:'Add medication', glucose:'Log glucose reading', pressure:'Log blood pressure', care:'Add care reminder'};
  fab.title = titles[activeTab] || 'Add';
  fab.style.display = (activeTab === 'stock' || activeTab === 'history') ? 'none' : 'flex';
}
function lowStockMeds(){
  return Object.values(medications).filter(m => m.stock && m.stock.enabled && (m.stock.qty||0) <= (m.stock.lowThreshold||0));
}
function updateLowStockIndicator(){
  const dot = document.getElementById('stockTabDot');
  if(dot) dot.classList.toggle('hidden', lowStockMeds().length === 0);
}
function careDaysUntil(dateKey){
  const today = new Date(todayStr()+'T00:00:00');
  const target = new Date(dateKey+'T00:00:00');
  return Math.round((target-today)/86400000);
}
function dueSoonCareEvents(){
  return Object.values(careEvents).filter(ev => !(ev.lastDone && !ev.repeatDays));
}
function updateCareIndicator(){
  const dot = document.getElementById('careTabDot');
  if(dot) dot.classList.toggle('hidden', dueSoonCareEvents().length === 0);
}

/* ---------------- Generic accordion renderer ---------------- */
function renderAccordion(tabKey, groups, itemRenderFn){
  if(groups.length === 0) return '';
  return groups.map(g=>{
    const isOpen = expandedDates[tabKey].has(g.dateKey);
    return `
      <div class="accordion-row">
        <div class="accordion-header" data-action="toggle-date" data-tab="${tabKey}" data-date="${g.dateKey}">
          <span class="accordion-date">${esc(g.dateLabel)}</span>
          <span class="accordion-summary">${esc(g.summary)}</span>
          <span class="accordion-chevron ${isOpen?'open':''}">${ICON_CHEVRON}</span>
        </div>
        ${isOpen ? `<div class="accordion-body">${g.items.map(itemRenderFn).join('')}</div>` : ''}
      </div>`;
  }).join('');
}

/* ================= TODAY (medication timeline + history) ================= */
function computeDoseInstances(){
  const list = [];
  Object.values(medications).forEach(med=>{ (med.schedule||[]).forEach(s=>{ list.push({med, sched:s}); }); });
  list.sort((a,b)=> a.sched.time.localeCompare(b.sched.time));
  return list;
}
function doseStatus(med, sched){
  const key = todayStr()+'_'+med.id+'_'+sched.id;
  const log = doseLogs[key];
  if(log) return {status:'given', key, log};
  const now = new Date();
  const [h,m] = sched.time.split(':').map(Number);
  const scheduled = new Date(); scheduled.setHours(h,m,0,0);
  const diffMin = (now - scheduled) / 60000;
  if(diffMin > 30) return {status:'overdue', key};
  if(diffMin >= -30) return {status:'due', key};
  return {status:'upcoming', key};
}

function periodTitleHtml(label){
  const map = {
    Morning:   {icon: ICON_SUN,     cls:'period-morning'},
    Afternoon: {icon: ICON_SUN_LOW, cls:'period-afternoon'},
    Evening:   {icon: ICON_SUNSET,  cls:'period-evening'},
    Night:     {icon: ICON_MOON,    cls:'period-night'}
  };
  const m = map[label] || {icon: ICON_CLOCK, cls:'period-custom'};
  return `<div class="section-title period-title ${m.cls}"><span class="period-badge">${m.icon}</span>${esc(label)}</div>`;
}

function render(){
  const main = document.getElementById('mainContent');
  updateLowStockIndicator();
  updateCareIndicator();
  checkAlarms();
  try{
    if(activeTab === 'today') renderToday(main);
    else if(activeTab === 'manage') renderManage(main);
    else if(activeTab === 'glucose') renderVitalTab(main, 'glucose');
    else if(activeTab === 'pressure') renderVitalTab(main, 'pressure');
    else if(activeTab === 'stock') renderStock(main);
    else if(activeTab === 'care') renderCare(main);
    else if(activeTab === 'history') renderHistory(main);
  }catch(e){
    console.error('render failed for tab "'+activeTab+'":', e);
    main.innerHTML = `<div class="view-fade empty-state"><p><strong>Something went wrong showing this tab.</strong></p><p style="font-family:var(--font-mono); font-size:11px; color:var(--red);">${esc(e.message||String(e))}</p><p class="cta" onclick="location.reload()">Tap to reload the app</p></div>`;
  }
}

function renderToday(main){
  const instances = computeDoseInstances();
  let html = '<div class="view-fade">';

  if(instances.length === 0){
    html += `<div class="empty-state">${ICON_EMPTY}<p><strong>No medications yet.</strong></p><p>Tap the <span class="cta" onclick="document.getElementById('fabAdd').click()">+ button</span> to add mom's first medication and set its times.</p></div></div>`;
    main.innerHTML = html;
    return;
  }

  const given = instances.filter(i=>doseStatus(i.med,i.sched).status==='given').length;
  const overdue = instances.filter(i=>doseStatus(i.med,i.sched).status==='overdue').length;
  const pct = Math.round((given/instances.length)*100);

  const buckets = {};
  instances.forEach(inst=>{
    const label = inst.sched.label || 'Custom';
    if(!buckets[label]) buckets[label] = [];
    buckets[label].push(inst);
  });
  const orderedLabels = Object.keys(buckets).sort((a,b)=>{
    const ia = LABEL_ORDER.indexOf(a); const ib = LABEL_ORDER.indexOf(b);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });

  html += `
    <div class="progress-hero">
      <div class="progress-top"><span class="progress-label">Today's doses</span><span class="progress-count">${given} / ${instances.length} given</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${overdue>0 ? `<div class="progress-note attn">${overdue} dose${overdue===1?'':'s'} overdue — tap below to log</div>` : `<div class="progress-note">On track for the day</div>`}
      ${(()=>{ const low=lowStockMeds(); return low.length>0 ? `<div class="progress-note attn">⚠ ${low.length} medicine${low.length===1?'':'s'} running low — check the Stock tab</div>` : ''; })()}
    </div>`;

  orderedLabels.forEach(label=>{
    html += `${periodTitleHtml(label)}<div class="timeline">`;
    buckets[label].forEach(inst=>{
      const {med, sched} = inst;
      const st = doseStatus(med, sched);
      let metaHtml = '';
      if(st.status === 'given') metaHtml = `<div class="dose-meta given">✓ Given by ${esc(st.log.takenBy)} · ${fmtDateTime(st.log.takenAt)}</div>`;
      else if(st.status === 'overdue') metaHtml = `<div class="dose-meta overdue">Overdue — not yet given</div>`;
      else if(st.status === 'due') metaHtml = `<div class="dose-meta due">Due now</div>`;
      else metaHtml = `<div class="dose-meta upcoming">Upcoming</div>`;
      html += `
        <div class="dose-node ${st.status}">
          <div class="dose-dot">${ICON_CHECK}</div>
          <div class="dose-card" data-action="dose" data-med="${med.id}" data-sched="${sched.id}" data-date="${todayStr()}">
            <div class="dose-top">
              <div class="dose-name-row">
                <span class="dose-name">${esc(med.name)}</span>
                ${med.insulin ? `<span class="insulin-chip">${ICON_DROP} Insulin</span>` : ''}
              </div>
              <span class="dose-time">${fmtTime(sched.time)}</span>
            </div>
            ${med.dosage ? `<div class="dose-dosage">${esc(med.dosage)}</div>` : ''}
            ${metaHtml}
          </div>
        </div>`;
    });
    html += `</div>`;
  });

  /* ---- History: past days' logged doses, grouped by date, tap to expand ---- */
  const pastLogs = Object.entries(doseLogs).filter(([k,v]) => v.date && v.date !== todayStr());
  if(pastLogs.length > 0){
    const byDate = {};
    pastLogs.forEach(([key, log])=>{
      const med = medications[log.medId];
      const sched = med ? (med.schedule||[]).find(s=>s.id===log.scheduleId) : null;
      if(!byDate[log.date]) byDate[log.date] = [];
      byDate[log.date].push({key, log, med, sched});
    });
    const dateKeys = Object.keys(byDate).sort((a,b)=> b.localeCompare(a)).slice(0,21);
    const groups = dateKeys.map(dateKey=>{
      const items = byDate[dateKey].sort((a,b)=> a.log.takenAt.localeCompare(b.log.takenAt));
      return { dateKey, dateLabel: fmtDateLabel(dateKey), summary: `${items.length} dose${items.length===1?'':'s'} logged`, items };
    });
    html += `<div class="section-title">History</div>`;
    html += renderAccordion('today', groups, (it)=>{
      const name = it.med ? esc(it.med.name) : 'Medication (no longer listed)';
      return `<div class="accordion-item" data-action="dose" data-med="${it.log.medId}" data-sched="${it.log.scheduleId}" data-date="${it.log.date}">
        <div class="accordion-item-main">
          <div class="accordion-item-title">${name}</div>
          <div class="accordion-item-sub">Given by ${esc(it.log.takenBy)} · ${fmtTimeOnly(it.log.takenAt)}</div>
        </div>
      </div>`;
    });
  }

  html += `</div>`;
  main.innerHTML = html;
}

function renderManage(main){
  const meds = Object.values(medications).sort((a,b)=>a.name.localeCompare(b.name));
  if(meds.length === 0){
    main.innerHTML = `<div class="view-fade empty-state">${ICON_EMPTY}<p><strong>No medications added.</strong></p><p>Tap <span class="cta" onclick="document.getElementById('fabAdd').click()">+ Add medication</span> to get started.</p></div>`;
    return;
  }
  let html = '<div class="view-fade"><div class="section-title">All medications</div><div class="section-hint">Tap any medication to edit its details, times, or delete it.</div>';
  meds.forEach(med=>{
    const timesCount = (med.schedule||[]).length;
    html += `
      <div class="med-row ${med.insulin?'insulin':''}" data-action="edit-med" data-med="${med.id}">
        <div class="med-row-swatch">${esc((med.name||'?')[0].toUpperCase())}</div>
        <div class="med-row-body">
          <div class="med-row-name">${esc(med.name)}</div>
          <div class="med-row-sub">${esc(med.dosage||'')}${med.dosage?' · ':''}${timesCount} time${timesCount===1?'':'s'} a day${med.insulin?' · Insulin':''}</div>
        </div>
        <div class="med-row-chevron">${ICON_CHEVRON}</div>
      </div>`;
  });
  html += `</div>`;
  main.innerHTML = html;
}

/* ================= STOCK (inventory tracking) ================= */
function stockDosesPerDay(med){
  const perDoseUnits = (med.stock && med.stock.unitsPerDose) || 1;
  return (med.schedule||[]).length * perDoseUnits;
}
function renderStock(main){
  const meds = Object.values(medications).sort((a,b)=>a.name.localeCompare(b.name));
  if(meds.length === 0){
    main.innerHTML = `<div class="view-fade empty-state">${ICON_EMPTY}<p><strong>No medications added yet.</strong></p><p>Add medicines on the <span class="cta" onclick="document.querySelector('[data-tab=manage]').click()">Meds tab</span> first, then set up stock tracking for each one here.</p></div>`;
    return;
  }
  const tracked = meds.filter(m => m.stock && m.stock.enabled);
  const untracked = meds.filter(m => !(m.stock && m.stock.enabled));
  const low = lowStockMeds();

  let html = '<div class="view-fade">';

  if(low.length > 0){
    html += `<div class="stock-alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
      <div><div class="stock-alert-title">${low.length} medicine${low.length===1?'':'s'} running low</div>
      <div class="stock-alert-list">${low.map(m=>esc(m.name)).join(', ')} — time to reorder soon.</div></div>
    </div>`;
  }

  if(tracked.length > 0){
    html += `<div class="section-title">Stock levels</div>`;
    const sorted = tracked.slice().sort((a,b)=>{
      const da = stockDosesPerDay(a)>0 ? a.stock.qty/stockDosesPerDay(a) : 9999;
      const db = stockDosesPerDay(b)>0 ? b.stock.qty/stockDosesPerDay(b) : 9999;
      return da - db;
    });
    sorted.forEach(med=>{
      const st = med.stock;
      const pct = st.initialQty>0 ? Math.max(0, Math.min(100, Math.round((st.qty/st.initialQty)*100))) : 0;
      const dpd = stockDosesPerDay(med);
      const daysLeft = dpd>0 ? Math.floor(st.qty/dpd) : null;
      const isLow = st.qty <= (st.lowThreshold||0);
      const fillCls = isLow ? 'danger' : pct<=40 ? 'warn' : '';
      html += `
        <div class="stock-card ${isLow?'low':''}" data-action="stock" data-med="${med.id}">
          <div class="stock-top">
            <div>
              <div class="stock-name">${esc(med.name)}</div>
              <div class="stock-qty">${st.qty} of ${st.initialQty} ${esc(st.unit)} left</div>
            </div>
            ${isLow ? `<span class="vital-chip chip-high">Low</span>` : ''}
          </div>
          <div class="stock-track"><div class="stock-fill ${fillCls}" style="width:${pct}%"></div></div>
          <div class="stock-days ${isLow?'low':''}">${daysLeft!==null ? (daysLeft<=0 ? 'Out today at this rate' : `~${daysLeft} day${daysLeft===1?'':'s'} left at current use`) : 'Add times to this medicine to estimate days left'}</div>
        </div>`;
    });
  }

  if(untracked.length > 0){
    html += `<div class="section-title">Not tracked yet</div><div class="section-hint">Tap a medicine to enter how much you have on hand.</div>`;
    untracked.forEach(med=>{
      html += `
        <div class="med-row" data-action="stock" data-med="${med.id}">
          <div class="med-row-swatch">${esc((med.name||'?')[0].toUpperCase())}</div>
          <div class="med-row-body">
            <div class="med-row-name">${esc(med.name)}</div>
            <div class="med-row-sub">${esc(med.dosage||'')}</div>
          </div>
          <div class="med-row-chevron">${ICON_CHEVRON}</div>
        </div>`;
    });
  }

  html += `</div>`;
  main.innerHTML = html;
}

/* ================= CARE (next dressing change, checkups, etc.) ================= */
function renderCare(main){
  const allEvents = Object.values(careEvents).sort((a,b)=> a.nextDate.localeCompare(b.nextDate));
  const events = allEvents.filter(ev => !(ev.lastDone && !ev.repeatDays));
  const completed = allEvents.filter(ev => ev.lastDone && !ev.repeatDays).sort((a,b)=> b.lastDone.localeCompare(a.lastDone));
  if(events.length === 0 && completed.length === 0){
    main.innerHTML = `<div class="view-fade empty-state">${ICON_EMPTY}<p><strong>No care reminders yet.</strong></p><p>Tap the <span class="cta" onclick="document.getElementById('fabAdd').click()">+ button</span> to add the next dressing change, checkup, or appointment date.</p></div>`;
    return;
  }
  const overdue = events.filter(ev => careDaysUntil(ev.nextDate) < 0);
  const upcoming = events.filter(ev => careDaysUntil(ev.nextDate) >= 0);

  let html = '<div class="view-fade">';

  if(overdue.length > 0){
    html += `<div class="stock-alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
      <div><div class="stock-alert-title">${overdue.length} care reminder${overdue.length===1?'':'s'} overdue</div>
      <div class="stock-alert-list">${overdue.map(ev=>esc(ev.label)).join(', ')}</div></div>
    </div>`;
  }

  if(events.length > 0){
    html += `<div class="section-title">Next up</div><div class="section-hint">Tap a reminder to edit it, reschedule it, or mark it done.</div>`;
  }
  overdue.concat(upcoming).forEach(ev=>{
    const days = careDaysUntil(ev.nextDate);
    const isLow = days < 0;
    const dueSoon = days >= 0 && days <= 2;
    let daysText;
    if(days < 0) daysText = `Overdue by ${Math.abs(days)} day${Math.abs(days)===1?'':'s'} — was due ${fmtDateLabel(ev.nextDate)}`;
    else if(days === 0) daysText = 'Due today';
    else if(days === 1) daysText = 'Due tomorrow';
    else daysText = `In ${days} days — ${fmtDateLabel(ev.nextDate)}`;
    html += `
      <div class="stock-card ${isLow?'low':''}" data-action="care" data-id="${ev.id}">
        <div class="stock-top">
          <div>
            <div class="stock-name">${!isLow && !dueSoon ? '<span class="care-pending-dot"></span>' : ''}${esc(ev.label)}</div>
            <div class="stock-qty">${ev.repeatDays ? `Repeats every ${ev.repeatDays} day${Number(ev.repeatDays)===1?'':'s'}` : 'One-time'}${ev.notes ? ' · '+esc(ev.notes) : ''}</div>
          </div>
          ${isLow ? `<span class="vital-chip chip-high">Overdue</span>` : dueSoon ? `<span class="vital-chip chip-elevated">Soon</span>` : ''}
        </div>
        <div class="stock-days ${isLow?'low':''}">${daysText}</div>
      </div>`;
  });

  if(completed.length > 0){
    html += `<div class="section-title">Recently completed</div>`;
    completed.slice(0,6).forEach(ev=>{
      html += `
      <div class="stock-card done-card" data-action="care" data-id="${ev.id}">
        <div class="stock-top">
          <div>
            <div class="stock-name">${esc(ev.label)}</div>
            <div class="stock-qty">Done ${fmtDateLabel(todayStr(new Date(ev.lastDone)))}${ev.notes ? ' · '+esc(ev.notes) : ''}</div>
          </div>
          <span class="vital-chip chip-normal">${ICON_CHECK}</span>
        </div>
      </div>`;
    });
  }

  html += `</div>`;
  main.innerHTML = html;
}

/* ================= HISTORY (everything, in one place) ================= */
function renderHistory(main){
  const entries = [];

  Object.values(doseLogs).forEach(log=>{
    const med = medications[log.medId];
    entries.push({
      dateKey: log.date, ts: log.takenAt,
      html: `<div class="accordion-item" data-action="dose" data-med="${log.medId}" data-sched="${log.scheduleId}" data-date="${log.date}">
        <div class="history-icon dose">${ICON_CHECK}</div>
        <div class="accordion-item-main">
          <div class="accordion-item-title">${med?esc(med.name):'Medication (no longer listed)'}${med&&med.dosage?' · '+esc(med.dosage):''}</div>
          <div class="accordion-item-sub">Given by ${esc(log.takenBy)} · ${fmtTimeOnly(log.takenAt)}</div>
        </div>
      </div>`
    });
  });

  Object.values(glucoseReadings).forEach(r=>{
    const cat = glucoseCategory(r.value);
    entries.push({
      dateKey: r.date, ts: r.takenAt,
      html: `<div class="accordion-item" data-action="reading" data-kind="glucose" data-id="${r.id}">
        <div class="history-icon glucose">${ICON_DROP}</div>
        <div class="accordion-item-main">
          <div class="accordion-item-title">Glucose · ${r.value.toFixed(1)} ${GLUCOSE_UNIT} <span class="vital-chip ${cat.cls} tiny">${cat.label}</span></div>
          <div class="accordion-item-sub">${r.context?esc(r.context)+' · ':''}${fmtTimeOnly(r.takenAt)}</div>
        </div>
      </div>`
    });
  });

  Object.values(bpReadings).forEach(r=>{
    const cat = bpCategory(r.systolic, r.diastolic);
    entries.push({
      dateKey: r.date, ts: r.takenAt,
      html: `<div class="accordion-item" data-action="reading" data-kind="pressure" data-id="${r.id}">
        <div class="history-icon pressure">${ICON_HEART}</div>
        <div class="accordion-item-main">
          <div class="accordion-item-title">${r.systolic}/${r.diastolic} mmHg <span class="vital-chip ${cat.cls} tiny">${cat.label}</span></div>
          <div class="accordion-item-sub">${r.pulse?esc(r.pulse)+' bpm · ':''}${fmtTimeOnly(r.takenAt)}</div>
        </div>
      </div>`
    });
  });

  Object.values(careEvents).filter(ev=>ev.lastDone).forEach(ev=>{
    entries.push({
      dateKey: todayStr(new Date(ev.lastDone)), ts: ev.lastDone,
      html: `<div class="accordion-item" data-action="care" data-id="${ev.id}">
        <div class="history-icon care">${ICON_CHECK}</div>
        <div class="accordion-item-main">
          <div class="accordion-item-title">${esc(ev.label)} <span class="vital-chip chip-normal tiny">Done</span></div>
          <div class="accordion-item-sub">${ev.repeatDays?`Repeats every ${ev.repeatDays} day${Number(ev.repeatDays)===1?'':'s'} · `:''}${fmtTimeOnly(ev.lastDone)}</div>
        </div>
      </div>`
    });
  });

  if(entries.length === 0){
    main.innerHTML = `<div class="view-fade empty-state">${ICON_CLOCK}<p><strong>No history yet.</strong></p><p>Once doses are given or readings are logged, everything shows up here in one place — no more hunting through each tab.</p></div>`;
    return;
  }

  const byDate = {};
  entries.forEach(e=>{ if(!byDate[e.dateKey]) byDate[e.dateKey] = []; byDate[e.dateKey].push(e); });
  const dateKeys = Object.keys(byDate).sort((a,b)=> b.localeCompare(a));
  const groups = dateKeys.map(dateKey=>{
    const items = byDate[dateKey].sort((a,b)=> b.ts.localeCompare(a.ts));
    return { dateKey, dateLabel: fmtDateLabel(dateKey), summary: `${items.length} entr${items.length===1?'y':'ies'}`, items };
  });

  let html = '<div class="view-fade"><div class="section-title">Everything, newest first</div><div class="section-hint">Doses given, glucose &amp; BP readings, and completed care reminders — all together. Tap a day to expand, then tap any entry to edit it.</div>';
  html += renderAccordion('history', groups, (it)=>it.html);
  html += `</div>`;
  main.innerHTML = html;
}
function glucoseCategory(v){
  if(v < 3.9) return {label:'Low', cls:'chip-low'};
  if(v < 7.8) return {label:'Normal', cls:'chip-normal'};
  if(v < 11.1) return {label:'Elevated', cls:'chip-elevated'};
  return {label:'High', cls:'chip-high'};
}
function bpCategory(sys, dia){
  if(sys>=180 || dia>=120) return {label:'Crisis', cls:'chip-high'};
  if(sys>=140 || dia>=90) return {label:'High · Stage 2', cls:'chip-high'};
  if(sys>=130 || dia>=80) return {label:'High · Stage 1', cls:'chip-elevated'};
  if(sys>=120) return {label:'Elevated', cls:'chip-elevated'};
  return {label:'Normal', cls:'chip-normal'};
}
function computeTrend(values){
  if(values.length < 2) return null;
  const recentCount = Math.max(1, Math.min(3, Math.floor(values.length/2)));
  const recent = values.slice(-recentCount);
  const prior = values.slice(0, values.length - recentCount);
  if(prior.length === 0) return null;
  const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
  const recentAvg = avg(recent), priorAvg = avg(prior);
  const delta = recentAvg - priorAvg;
  let dir = 'flat';
  if(Math.abs(delta) >= Math.max(0.2, priorAvg*0.03)) dir = delta>0 ? 'up' : 'down';
  return {delta, dir};
}
function avgOverDays(readings, days, field){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days);
  const filtered = readings.filter(r => new Date(r.takenAt) >= cutoff);
  if(filtered.length === 0) return null;
  const sum = filtered.reduce((a,r)=> a + (field ? r[field] : r.value), 0);
  return {avg: sum/filtered.length, n: filtered.length};
}
function buildLineChartSVG(seriesList, opts){
  opts = Object.assign({width:320,height:170,padL:34,padR:10,padT:14,padB:22,decimals:0}, opts||{});
  const allVals = seriesList.flatMap(s=>s.values.map(p=>p.v)).filter(v=>typeof v==='number' && !isNaN(v));
  if(allVals.length === 0) return '';
  let yMin = Math.min(...allVals), yMax = Math.max(...allVals);
  if(yMin === yMax){ yMin -= 1; yMax += 1; }
  const pad = (yMax-yMin)*0.18; yMin -= pad; yMax += pad;
  const n = Math.max(...seriesList.map(s=>s.values.length));
  const plotW = opts.width - opts.padL - opts.padR;
  const plotH = opts.height - opts.padT - opts.padB;
  const xFor = i => opts.padL + (n<=1 ? plotW/2 : (i/(n-1))*plotW);
  const yFor = v => opts.padT + plotH - ((v-yMin)/(yMax-yMin))*plotH;

  // Smooth path through points using cubic bezier segments (Catmull-Rom-ish)
  function smoothPath(pts){
    if(pts.length < 2) return `M ${pts[0][0]},${pts[0][1]}`;
    let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for(let i=0;i<pts.length-1;i++){
      const p0 = pts[i-1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i+1];
      const p3 = pts[i+2] || p2;
      const c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
      const c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
      d += ` C ${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  }

  let svg = `<svg viewBox="0 0 ${opts.width} ${opts.height}" style="width:100%; height:auto; display:block; overflow:visible;">`;
  svg += `<defs>`;
  seriesList.forEach((s,si)=>{
    svg += `<linearGradient id="chartFill${si}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${s.color}" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="${s.color}" stop-opacity="0"/>
    </linearGradient>`;
  });
  svg += `</defs>`;
  for(let g=0; g<=3; g++){
    const gv = yMin + (yMax-yMin)*(g/3);
    const gy = yFor(gv);
    svg += `<line x1="${opts.padL}" y1="${gy.toFixed(1)}" x2="${opts.width-opts.padR}" y2="${gy.toFixed(1)}" stroke="${CHART_COLORS.line}" stroke-width="1" stroke-dasharray="2 4"/>`;
    svg += `<text x="${opts.padL-6}" y="${(gy+3).toFixed(1)}" font-size="8.5" fill="${CHART_COLORS.inkFaint}" text-anchor="end" font-family="IBM Plex Mono, monospace">${gv.toFixed(opts.decimals)}</text>`;
  }
  seriesList.forEach((s,si)=>{
    if(s.values.length===0) return;
    const pts = s.values.map((p,i)=>[xFor(i), yFor(p.v)]);
    const linePath = smoothPath(pts);
    const areaPath = `${linePath} L ${pts[pts.length-1][0].toFixed(1)},${(opts.padT+plotH).toFixed(1)} L ${pts[0][0].toFixed(1)},${(opts.padT+plotH).toFixed(1)} Z`;
    svg += `<path d="${areaPath}" fill="url(#chartFill${si})" stroke="none"/>`;
    svg += `<path d="${linePath}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="chart-line-draw"/>`;
    pts.forEach(([x,y])=>{ svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" fill="${s.color}" stroke="#fff" stroke-width="1.8" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.25));"/>`; });
  });
  if(opts.xLabels && opts.xLabels.length && n>0){
    const idxs = n<=1 ? [0] : [0, Math.floor((n-1)/2), n-1];
    idxs.forEach(i=>{
      if(opts.xLabels[i]===undefined) return;
      svg += `<text x="${xFor(i).toFixed(1)}" y="${opts.height-6}" font-size="8.5" fill="${CHART_COLORS.inkFaint}" text-anchor="middle" font-family="IBM Plex Mono, monospace">${esc(opts.xLabels[i])}</text>`;
    });
  }
  svg += `</svg>`;
  return svg;
}
function trendBlock(trend, unitLabel, decimals){
  decimals = decimals===undefined?0:decimals;
  if(!trend) return `<div class="vital-trend flat">${ICON_FLAT}<span>Not enough readings yet for a trend</span></div>`;
  const icon = trend.dir==='up' ? ICON_UP : trend.dir==='down' ? ICON_DOWN : ICON_FLAT;
  const word = trend.dir==='up' ? 'Trending up' : trend.dir==='down' ? 'Trending down' : 'Holding steady';
  const deltaTxt = trend.dir==='flat' ? '' : ` — ${Math.abs(trend.delta).toFixed(decimals)} ${unitLabel} vs recent average`;
  return `<div class="vital-trend ${trend.dir}">${icon}<span>${word}${deltaTxt}</span></div>`;
}

function renderVitalTab(main, kind){
  const isGlucose = kind === 'glucose';
  const dataObj = isGlucose ? glucoseReadings : bpReadings;
  const readings = Object.values(dataObj).sort((a,b)=> a.takenAt.localeCompare(b.takenAt));

  if(readings.length === 0){
    const label = isGlucose ? 'glucose reading' : 'blood pressure reading';
    main.innerHTML = `<div class="view-fade empty-state">${ICON_EMPTY}<p><strong>No ${label}s logged yet.</strong></p><p>Tap the <span class="cta" onclick="document.getElementById('fabAdd').click()">+ button</span> to log the first one.</p></div>`;
    return;
  }

  const latest = readings[readings.length-1];
  const recent = readings.slice(-14);
  let heroHtml, chartHtml, legendHtml = '';

  if(isGlucose){
    const cat = glucoseCategory(latest.value);
    const trend = computeTrend(readings.map(r=>r.value));
    const week = avgOverDays(readings, 7);
    heroHtml = `
      <div class="vital-hero">
        <div class="vital-hero-top">
          <div>
            <div class="vital-big">${latest.value.toFixed(1)}<small>${GLUCOSE_UNIT}</small></div>
            <div class="vital-sub">${esc(latest.context||'')} · ${fmtDateTime(latest.takenAt)}</div>
          </div>
          <span class="vital-chip ${cat.cls}">${cat.label}</span>
        </div>
        ${trendBlock(trend, GLUCOSE_UNIT, 1)}
        ${week ? `<div class="vital-stat">7-day average: ${week.avg.toFixed(1)} ${GLUCOSE_UNIT} (${week.n} reading${week.n===1?'':'s'})</div>` : ''}
      </div>`;
    chartHtml = buildLineChartSVG(
      [{name:'Glucose', color:CHART_COLORS.teal, values: recent.map(r=>({v:r.value}))}],
      {xLabels: recent.map(r=>fmtDateLabel(r.date).slice(0,3)), decimals:1}
    );
  } else {
    const cat = bpCategory(latest.systolic, latest.diastolic);
    const trendSys = computeTrend(readings.map(r=>r.systolic));
    const weekSys = avgOverDays(readings, 7, 'systolic');
    const weekDia = avgOverDays(readings, 7, 'diastolic');
    heroHtml = `
      <div class="vital-hero">
        <div class="vital-hero-top">
          <div>
            <div class="vital-big">${latest.systolic}/${latest.diastolic}<small>mmHg</small></div>
            <div class="vital-sub">${latest.pulse ? esc(latest.pulse)+' bpm · ' : ''}${fmtDateTime(latest.takenAt)}</div>
          </div>
          <span class="vital-chip ${cat.cls}">${cat.label}</span>
        </div>
        ${trendBlock(trendSys, 'mmHg systolic', 0)}
        ${weekSys && weekDia ? `<div class="vital-stat">7-day average: ${Math.round(weekSys.avg)}/${Math.round(weekDia.avg)} mmHg (${weekSys.n} reading${weekSys.n===1?'':'s'})</div>` : ''}
      </div>`;
    chartHtml = buildLineChartSVG(
      [
        {name:'Systolic', color:CHART_COLORS.teal, values: recent.map(r=>({v:r.systolic}))},
        {name:'Diastolic', color:CHART_COLORS.insulin, values: recent.map(r=>({v:r.diastolic}))}
      ],
      {xLabels: recent.map(r=>fmtDateLabel(r.date).slice(0,3)), decimals:0}
    );
    legendHtml = `<div class="chart-legend"><span><i style="background:${CHART_COLORS.teal}"></i>Systolic</span><span><i style="background:${CHART_COLORS.insulin}"></i>Diastolic</span></div>`;
  }

  let html = `<div class="view-fade">${heroHtml}
    <div class="chart-card">${legendHtml}${chartHtml}</div>
    <div class="vitals-note">General reference ranges shown for context only — not medical advice. Always follow your doctor's specific targets for mom.</div>
    <div class="section-title">History</div>
    <div class="section-hint">Tap a date to expand it, then tap any reading to edit or delete it.</div>`;

  const byDate = {};
  readings.forEach(r=>{
    const dk = r.date || todayStr(new Date(r.takenAt));
    if(!byDate[dk]) byDate[dk] = [];
    byDate[dk].push(r);
  });
  const dateKeys = Object.keys(byDate).sort((a,b)=> b.localeCompare(a)).slice(0,30);
  const groups = dateKeys.map(dateKey=>{
    const items = byDate[dateKey].sort((a,b)=> b.takenAt.localeCompare(a.takenAt));
    let summary;
    if(isGlucose){
      const avg = items.reduce((a,r)=>a+r.value,0)/items.length;
      summary = `${items.length} · avg ${avg.toFixed(1)}`;
    } else {
      summary = `${items.length} reading${items.length===1?'':'s'}`;
    }
    return { dateKey, dateLabel: fmtDateLabel(dateKey), summary, items };
  });

  html += renderAccordion(kind, groups, (r)=>{
    if(isGlucose){
      const cat = glucoseCategory(r.value);
      return `<div class="accordion-item" data-action="reading" data-kind="glucose" data-id="${r.id}">
        <div class="accordion-item-main">
          <div class="accordion-item-title">${r.value.toFixed(1)} ${GLUCOSE_UNIT}</div>
          <div class="accordion-item-sub">${esc(r.context||'')} · ${fmtTimeOnly(r.takenAt)} · ${esc(r.takenBy||'')}</div>
        </div>
        <span class="vital-chip ${cat.cls}">${cat.label}</span>
      </div>`;
    } else {
      const cat = bpCategory(r.systolic, r.diastolic);
      return `<div class="accordion-item" data-action="reading" data-kind="pressure" data-id="${r.id}">
        <div class="accordion-item-main">
          <div class="accordion-item-title">${r.systolic}/${r.diastolic} mmHg</div>
          <div class="accordion-item-sub">${r.pulse?esc(r.pulse)+' bpm · ':''}${fmtTimeOnly(r.takenAt)} · ${esc(r.takenBy||'')}</div>
        </div>
        <span class="vital-chip ${cat.cls}">${cat.label}</span>
      </div>`;
    }
  });

  html += `</div>`;
  main.innerHTML = html;
}

/* ---------------- Click delegation ---------------- */
document.getElementById('mainContent').addEventListener('click', (e)=>{
  const doseCard = e.target.closest('[data-action="dose"]');
  if(doseCard){ openDoseConfirm(doseCard.dataset.med, doseCard.dataset.sched, doseCard.dataset.date); return; }
  const medRow = e.target.closest('[data-action="edit-med"]');
  if(medRow){ openMedForm(medRow.dataset.med); return; }
  const stockRow = e.target.closest('[data-action="stock"]');
  if(stockRow){ openStockForm(stockRow.dataset.med); return; }
  const readingRow = e.target.closest('[data-action="reading"]');
  if(readingRow){
    const kind = readingRow.dataset.kind, id = readingRow.dataset.id;
    if(kind==='glucose') openGlucoseForm(glucoseReadings[id]);
    else openPressureForm(bpReadings[id]);
    return;
  }
  const careRow = e.target.closest('[data-action="care"]');
  if(careRow){ openCareForm(careEvents[careRow.dataset.id]); return; }
  const toggle = e.target.closest('[data-action="toggle-date"]');
  if(toggle){
    const tab = toggle.dataset.tab, date = toggle.dataset.date;
    if(expandedDates[tab].has(date)) expandedDates[tab].delete(date);
    else expandedDates[tab].add(date);
    render();
    return;
  }
});

/* ---------------- Dose confirm / edit sheet ---------------- */
function openDoseConfirm(medId, schedId, dateStr){
  dateStr = dateStr || todayStr();
  const med = medications[medId];
  if(!med){ toast('That medication is no longer listed'); return; }
  const sched = (med.schedule||[]).find(s=>s.id===schedId);
  const key = dateStr+'_'+medId+'_'+schedId;
  const existingLog = doseLogs[key];
  confirmCtx = {medId, schedId, med, sched, key, dateStr, existingLog};

  const sheet = document.getElementById('sheetDoseConfirm');
  const timeLabel = sched ? `${fmtTime(sched.time)} · ${esc(sched.label)}` : '';
  const noteHtml = med.notes ? `<div class="note-callout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg><span><strong>Note:</strong> ${esc(med.notes)}</span></div>` : '';

  if(existingLog){
    sheet.innerHTML = `
      <div class="sheet-scroll">
        <div class="sheet-handle"></div>
        <h3 class="sheet-title">${esc(med.name)}</h3>
        <p class="sheet-desc">${timeLabel}${med.dosage?' · '+esc(med.dosage):''} · ${fmtDateLabel(dateStr)}</p>
        ${noteHtml}
        <div class="field"><label>Given by</label><input type="text" id="editByInput" value="${esc(existingLog.takenBy)}"></div>
        <div class="field"><label>Given at</label><input type="datetime-local" id="editWhenInput" value="${isoToLocalInputValue(existingLog.takenAt)}"></div>
      </div>
      <div class="sheet-footer">
        <button class="btn btn-primary" id="saveDoseEditBtn">Save changes</button>
        <button class="btn btn-danger" id="undoBtn">Undo — remove this record</button>
        <button class="btn btn-ghost" id="cancelConfirm">Close</button>
      </div>
    `;
    document.getElementById('saveDoseEditBtn').addEventListener('click', saveDoseEdit);
    document.getElementById('undoBtn').addEventListener('click', undoDose);
  } else {
    sheet.innerHTML = `
      <div class="sheet-scroll">
        <div class="sheet-handle"></div>
        <h3 class="sheet-title">Mark as given</h3>
        <div class="confirm-summary">
          <div class="cname">${esc(med.name)} ${med.insulin?'· 💧 Insulin':''}</div>
          <div class="cmeta">${timeLabel}${med.dosage?' · '+esc(med.dosage):''}</div>
        </div>
        ${noteHtml}
        <div class="field"><label>Given by</label><input type="text" id="confirmByInput" value="${esc(currentCaregiver)}" placeholder="Your name"></div>
      </div>
      <div class="sheet-footer">
        <button class="btn btn-primary" id="confirmGiveBtn">Confirm — given now</button>
        <button class="btn btn-ghost" id="cancelConfirm">Cancel</button>
      </div>
    `;
    document.getElementById('confirmGiveBtn').addEventListener('click', confirmDose);
  }
  document.getElementById('cancelConfirm').addEventListener('click', closeAllOverlays);
  openOverlay('overlayDoseConfirm');
}

async function confirmDose(){
  const byInput = document.getElementById('confirmByInput');
  const by = byInput.value.trim();
  if(!by){ byInput.focus(); return; }
  if(by !== currentCaregiver){ currentCaregiver = by; lsSet(LS_NAME_KEY, by); updateCaregiverPill(); }
  const {medId, schedId, key, dateStr, med} = confirmCtx;
  const btn = document.getElementById('confirmGiveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const deductAmount = (med.stock && med.stock.enabled) ? (med.stock.unitsPerDose || 1) : 0;
  const err = await runWrite(
    Store.setLogAndDeductStock(key, {medId, scheduleId:schedId, date:dateStr, takenAt:new Date().toISOString(), takenBy:by}, medId, deductAmount),
    'confirmDose'
  );
  if(err){ btn.disabled=false; btn.textContent='Confirm — given now'; return; }
  closeAllOverlays();
  toast('Marked as given');
}
async function saveDoseEdit(){
  const by = document.getElementById('editByInput').value.trim();
  const whenLocal = document.getElementById('editWhenInput').value;
  if(!by){ toast('Enter who gave this dose'); return; }
  if(!whenLocal){ toast('Pick a date and time'); return; }
  const {medId, schedId, key, dateStr} = confirmCtx;
  const btn = document.getElementById('saveDoseEditBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const err = await runWrite(Store.setLog(key, {medId, scheduleId:schedId, date:dateStr, takenAt:new Date(whenLocal).toISOString(), takenBy:by}), 'saveDoseEdit');
  if(err){ btn.disabled=false; btn.textContent='Save changes'; return; }
  closeAllOverlays();
  toast('Dose record updated');
}
async function undoDose(){
  const {key, medId, med} = confirmCtx;
  const btn = document.getElementById('undoBtn');
  if(btn){ btn.disabled=true; btn.textContent='Undoing…'; }
  const restoreAmount = (med.stock && med.stock.enabled) ? (med.stock.unitsPerDose || 1) : 0;
  const err = await runWrite(Store.deleteLogAndRestoreStock(key, medId, restoreAmount), 'undoDose');
  if(err){ if(btn){ btn.disabled=false; btn.textContent='Undo — remove this record'; } return; }
  closeAllOverlays();
  toast('Dose record removed');
}

/* ---------------- Medication add/edit sheet ---------------- */
function openMedForm(medId){

}
function renderMedForm(){

function checkDuplicateMedName(){
  const warnEl = document.getElementById('dupWarning');
  const val = document.getElementById('medNameInput').value.trim();
  const match = findExistingByName(val, editingMedId);
  if(match){
    const timesCount = (match.schedule||[]).length;
    warnEl.innerHTML = `You already have "${esc(match.name)}" listed (${timesCount} time${timesCount===1?'':'s'} a day). Adding it again as a new entry will split its times apart. <span id="editExistingLink" style="text-decoration:underline; font-weight:700; cursor:pointer;">Edit that one instead →</span>`;
    warnEl.classList.remove('hidden');
    document.getElementById('editExistingLink').addEventListener('click', ()=>{ closeAllOverlays(); setTimeout(()=>openMedForm(match.id), 150); });
  } else {
    warnEl.classList.add('hidden');
  }
}
function renderScheduleRows(){
  const list = document.getElementById('scheduleList');
  list.innerHTML = pendingSchedule.map((s,i)=>`
    <div class="schedule-row" data-idx="${i}">
      <select class="sched-label">${LABEL_ORDER.map(l=>`<option value="${l}" ${s.label===l?'selected':''}>${l}</option>`).join('')}</select>
      <input type="time" class="sched-time" value="${s.time}">
      <button class="rm" data-idx="${i}">${ICON_TRASH}</button>
    </div>
  `).join('');
  list.querySelectorAll('.schedule-row').forEach(row=>{
    const idx = Number(row.dataset.idx);
    row.querySelector('.sched-label').addEventListener('change', e=>{ pendingSchedule[idx].label = e.target.value; });
    row.querySelector('.sched-time').addEventListener('change', e=>{ pendingSchedule[idx].time = e.target.value; });
  });
  list.querySelectorAll('.rm').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const idx=Number(btn.dataset.idx); pendingSchedule.splice(idx,1); renderScheduleRows(); });
  });

async function saveMed(){

  const notes = document.getElementById('medNotesInput').value.trim();
  const insulin = document.getElementById('medInsulinInput').checked;
  if(!name){ toast('Give the medication a name'); return; }
  if(pendingSchedule.length === 0){ toast('Add at least one time'); return; }
  const btn = document.getElementById('saveMedBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const id = editingMedId || ('med_'+uid());
  const wasEditing = !!editingMedId;
  const err = await runWrite(Store.saveMed(id, {name, dosage, notes, insulin, schedule:pendingSchedule}), 'saveMed');

  toast(wasEditing ? 'Medication updated' : 'Medication added');

/* ---------------- Duplicate medication detection & merge ---------------- */
function dupKey(med){ return (med.name||'').trim().toLowerCase() + '|' + (med.dosage||'').trim().toLowerCase(); }
function findDuplicateGroups(){
  const groups = {};
  Object.values(medications).forEach(med=>{
    const key = dupKey(med);
    if(!groups[key]) groups[key] = [];
    groups[key].push(med);
  });
  return Object.values(groups).filter(g=>g.length>1);
}
function findExistingByName(name, excludeId){
  const val = (name||'').trim().toLowerCase();
  if(!val) return null;
  return Object.values(medications).find(m => m.id!==excludeId && (m.name||'').trim().toLowerCase()===val) || null;
}
async function mergeDuplicateMeds(){
  const groups = findDuplicateGroups();
  if(groups.length === 0){ toast('No duplicate medications found'); return; }
  const extraCount = groups.reduce((a,g)=>a+g.length-1, 0);
  const ok = confirm(
    `Found ${groups.length} medicine${groups.length===1?'':'s'} listed as ${extraCount+groups.length} separate entries. ` +
    `Merge each into a single medication with all its times combined? ` +
    `Past dose records tied to the removed duplicate entries will no longer show in Today's history. This cannot be undone.`
  );
  if(!ok) return;

  const newMeds = Object.assign({}, medications);
  groups.forEach(group=>{
    const base = group[0];
    const mergedSchedule = [];
    const seenTimes = new Set();
    group.forEach(med=>{
      (med.schedule||[]).forEach(s=>{
        const k = s.time + '|' + s.label;
        if(!seenTimes.has(k)){ seenTimes.add(k); mergedSchedule.push({id: s.id || uid(), time:s.time, label:s.label}); }
      });
    });
    mergedSchedule.sort((a,b)=>a.time.localeCompare(b.time));
    const insulin = group.some(m=>m.insulin);
    const notesSet = new Set(group.map(m=>(m.notes||'').trim()).filter(Boolean));
    group.forEach(m=>{ delete newMeds[m.id]; });
    newMeds[base.id] = Object.assign({}, base, { schedule: mergedSchedule, insulin, notes: Array.from(notesSet).join(' | ') });
  });

  const err = await runWrite(Store.replaceMedications(newMeds), 'mergeDuplicateMeds');
  if(err) return;
  toast(`Merged into ${groups.length} medication${groups.length===1?'':'s'}`);
  closeAllOverlays();
}

async function saveStockForm(medId){
  const med = medications[medId];
  if(!med) return;
  const qtyRaw = document.getElementById('stockQtyInput').value;
  const unit = document.getElementById('stockUnitInput').value.trim() || 'tablets';
  const perDoseRaw = document.getElementById('stockPerDoseInput').value;
  const thresholdRaw = document.getElementById('stockThresholdInput').value;
  const qty = Number(qtyRaw), perDose = Number(perDoseRaw)||1, threshold = Number(thresholdRaw)||0;
  if(!qtyRaw || isNaN(qty) || qty<0){ toast('Enter a valid quantity on hand'); return; }
  const wasEnabled = !!(med.stock && med.stock.enabled);
  const newStock = {
    enabled: true,
    unit,
    qty,
    initialQty: wasEnabled ? (med.stock.initialQty || qty) : qty,
    unitsPerDose: perDose,
    lowThreshold: threshold
  };
  const btn = document.getElementById('saveStockBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const err = await runWrite(Store.saveStock(medId, newStock), 'saveStock');
  if(err){ btn.disabled=false; btn.textContent = wasEnabled?'Save changes':'Start tracking stock'; return; }
  closeAllOverlays();
  toast(wasEnabled ? 'Stock updated' : 'Stock tracking started');
}

async function restockMed(medId){
  const med = medications[medId];
  if(!med || !med.stock) return;
  const amountRaw = document.getElementById('restockAmountInput').value;
  const amount = Number(amountRaw);
  if(!amountRaw || isNaN(amount) || amount<=0){ toast('Enter how much you added'); return; }
  const newQty = (med.stock.qty||0) + amount;
  const newStock = Object.assign({}, med.stock, { qty:newQty, initialQty:newQty });
  const btn = document.getElementById('restockBtn');
  btn.disabled = true; btn.textContent = 'Adding…';
  const err = await runWrite(Store.saveStock(medId, newStock), 'restockMed');
  if(err){ btn.disabled=false; btn.textContent='Add to stock'; return; }
  closeAllOverlays();
  toast(`Added ${amount} ${med.stock.unit} — now at ${newQty}`);
}

async function disableStockTracking(medId){
  if(!confirm("Stop tracking stock for this medicine? Its quantity history will be lost.")) return;
  const btn = document.getElementById('disableStockBtn');

  closeAllOverlays();

      toast('All info cleared');
    }catch(e){
      console.error('clearAll failed:', e);
      toast(friendlyError(e));
      showConnBanner(friendlyError(e));
      btn.disabled = false; btn.textContent = 'Delete everything';
    }
  };
  document.getElementById('clearPassConfirmBtn').addEventListener('click', tryConfirm);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryConfirm(); });
  document.getElementById('clearPassCancelBtn').addEventListener('click', closeAllOverlays);
  openOverlay('overlayClearPass');
  setTimeout(()=>input.focus(), 200);
}

/* ---------------- Doctor summary export ---------------- */
function buildDoctorSummaryText(){
  const lines = [];
  lines.push("Mom's Care — Summary");
  lines.push('Generated ' + new Date().toLocaleString());
  lines.push('');
  lines.push('MEDICATIONS');
  const meds = Object.values(medications).sort((a,b)=>a.name.localeCompare(b.name));
  if(meds.length===0) lines.push('  (none listed)');
  meds.forEach(m=>{
    const times = (m.schedule||[]).map(s=>fmtTime(s.time)+' ('+s.label+')').join(', ');
    lines.push('  - ' + m.name + (m.dosage? ' — '+m.dosage : '') + (m.insulin?' [INSULIN]':'') + '\\n    Times: ' + times + (m.notes? '\\n    Notes: '+m.notes : ''));
  });
  lines.push('');

  lines.push('CARE REMINDERS — dressing changes, checkups & more');
  const careList = Object.values(careEvents).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));
  if(careList.length===0) lines.push('  (none listed)');
  careList.forEach(ev=>{
    const days = careDaysUntil(ev.nextDate);
    const when = days<0 ? `OVERDUE (was due ${ev.nextDate})` : days===0 ? 'due today' : `due ${ev.nextDate}`;
    lines.push('  - ' + ev.label + ' — ' + when + (ev.repeatDays?` (repeats every ${ev.repeatDays}d)`:'') + (ev.notes?'\\n    Notes: '+ev.notes:''));
  });
  lines.push('');

  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-7);
  lines.push('GLUCOSE — last 7 days');
  const gWeek = Object.values(glucoseReadings).filter(r=> new Date(r.takenAt) >= cutoff).sort((a,b)=>a.takenAt.localeCompare(b.takenAt));
  if(gWeek.length===0) lines.push('  (no readings)');
  else{
    const avg = gWeek.reduce((a,r)=>a+r.value,0)/gWeek.length;
    const min = Math.min(...gWeek.map(r=>r.value));
    const max = Math.max(...gWeek.map(r=>r.value));
    lines.push(`  ${gWeek.length} readings — avg ${avg.toFixed(1)}, range ${min.toFixed(1)}–${max.toFixed(1)} ${GLUCOSE_UNIT}`);
    gWeek.forEach(r=> lines.push(`  - ${fmtDateTime(r.takenAt)}: ${r.value.toFixed(1)} ${GLUCOSE_UNIT} (${r.context})`));
  }
  lines.push('');

  lines.push('BLOOD PRESSURE — last 7 days');
  const bWeek = Object.values(bpReadings).filter(r=> new Date(r.takenAt) >= cutoff).sort((a,b)=>a.takenAt.localeCompare(b.takenAt));
  if(bWeek.length===0) lines.push('  (no readings)');
  else{
    const avgSys = bWeek.reduce((a,r)=>a+r.systolic,0)/bWeek.length;
    const avgDia = bWeek.reduce((a,r)=>a+r.diastolic,0)/bWeek.length;
    lines.push(`  ${bWeek.length} readings — avg ${Math.round(avgSys)}/${Math.round(avgDia)} mmHg`);
    bWeek.forEach(r=> lines.push(`  - ${fmtDateTime(r.takenAt)}: ${r.systolic}/${r.diastolic} mmHg${r.pulse?' · '+r.pulse+' bpm':''}`));
  }
  return lines.join('\n').replace(/\\n/g, '\n');
}
function openSummarySheet(){
  const text = buildDoctorSummaryText();
  const sheet = document.getElementById('sheetSummary');
  sheet.innerHTML = `
    <div class="sheet-scroll">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title">Summary for the doctor</h3>
      <p class="sheet-desc">Tap Copy, or select the text below manually if copy doesn't work on this device.</p>
      <div class="field"><textarea id="summaryText" readonly rows="14">${esc(text)}</textarea></div>
    </div>
    <div class="sheet-footer">
      <button class="btn btn-primary" id="copySummaryBtn">Copy to clipboard</button>
      <button class="btn btn-ghost" id="closeSummaryBtn">Close</button>
    </div>
  `;
  document.getElementById('copySummaryBtn').addEventListener('click', async ()=>{
    const ta = document.getElementById('summaryText');
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(text);
      } else {
        ta.removeAttribute('readonly');
        ta.select();
        document.execCommand('copy');
        ta.setAttribute('readonly','');
      }
      toast('Copied — paste it anywhere');
    }catch(e){
      ta.removeAttribute('readonly');
      ta.focus(); ta.select();
      toast('Could not auto-copy — text is selected, use your device copy option');
    }
  });
  document.getElementById('closeSummaryBtn').addEventListener('click', closeAllOverlays);
  openOverlay('overlaySummary');
}

/* ---------------- Overlay helpers ---------------- */
function openOverlay(id){ closeAllOverlays(); document.getElementById(id).classList.add('open'); }
function closeAllOverlays(){
  document.querySelectorAll('.overlay:not(.alarm-lock)').forEach(o=>o.classList.remove('open'));
  // If nothing else ends up open right after this, re-check for any medicine
  // alarms that are still due so the alarm screen comes back for them.
  setTimeout(()=>{
    if(!document.querySelector('.overlay:not(.alarm-lock).open')) checkAlarms();
  }, 60);
}
document.querySelectorAll('.overlay:not(.alarm-lock)').forEach(o=>{ o.addEventListener('click', e=>{ if(e.target === o) closeAllOverlays(); }); });

/* ---------------- Swipe-to-dismiss for sheets ---------------- */
function enableSheetDrag(sheet){
  const overlay = sheet.parentElement;
  let dragging = false, startY = 0, dy = 0, pointerId = null;
  let lastY = 0, lastT = 0, velocity = 0;
  const DISMISS_AT = 110;
  const VELOCITY_DISMISS = 0.55; // px/ms — a quick downward flick dismisses even if travel distance is short

  function scroller(){ return sheet.querySelector('.sheet-scroll'); }
  function isInteractive(el){ return !!el.closest('input, textarea, select, button, a, .switch, [contenteditable]'); }

  function onDown(e){
    const onHandle = !!e.target.closest('.sheet-handle');
    const sc = scroller();
    if(!onHandle){
      if(isInteractive(e.target)) return;
      if(sc && sc.scrollTop > 0) return;
    }
    dragging = true; startY = e.clientY; dy = 0; pointerId = e.pointerId;
    lastY = e.clientY; lastT = e.timeStamp; velocity = 0;
    sheet.classList.add('dragging');
    try{ sheet.setPointerCapture(pointerId); }catch(err){}
  }
  function onMove(e){
    if(!dragging || e.pointerId !== pointerId) return;
    dy = e.clientY - startY;
    if(dy < 0) dy = dy * 0.15; // slight resistance if dragged upward
    sheet.style.transform = `translateY(${dy}px)`;
    const ratio = Math.max(0, 1 - dy/280);
    overlay.style.background = `rgba(10,20,19,${(0.46*ratio).toFixed(3)})`;
    const dt = e.timeStamp - lastT;
    if(dt > 0) velocity = (e.clientY - lastY) / dt; // px/ms, smoothed by most-recent sample
    lastY = e.clientY; lastT = e.timeStamp;
  }
  function onUp(e){
    if(!dragging || e.pointerId !== pointerId) return;
    dragging = false;
    sheet.classList.remove('dragging');
    overlay.style.background = '';
    const isFastFlick = dy > 16 && velocity > VELOCITY_DISMISS;
    if(dy > DISMISS_AT || isFastFlick){
      // Faster flicks get a quicker, snappier exit; slow drags past the threshold get the standard close.
      const dur = isFastFlick ? Math.max(110, Math.round(220 - velocity*140)) : 220;
      sheet.style.transition = `transform ${dur}ms cubic-bezier(.32,0,.67,0)`;
      sheet.style.transform = `translateY(100%)`;
      setTimeout(()=>{ closeAllOverlays(); sheet.style.transform = ''; sheet.style.transition = ''; }, dur);
    } else {
      sheet.style.transform = '';
    }
    dy = 0; velocity = 0;
  }
  sheet.addEventListener('pointerdown', onDown);
  sheet.addEventListener('pointermove', onMove);
  sheet.addEventListener('pointerup', onUp);
  sheet.addEventListener('pointercancel', onUp);
}
document.querySelectorAll('.overlay:not(.alarm-lock) .sheet').forEach(enableSheetDrag);
