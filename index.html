<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Mom's Care — Meds &amp; Vitals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --surface-alt:#EAF1EF;
  --ink:#1E2B29; --ink-soft:#5C716E; --ink-faint:#8FA29F; --line:#DCE6E3;
  --teal:#0F6B63; --teal-deep:#0A4A45; --teal-tint:#E1EEEC;
  --amber:#C87F1F; --amber-tint:#FBEDD9;
  --red:#C1453B; --red-tint:#F9E1DE;
  --green:#3C8A5B; --green-tint:#E1F0E6;
  --insulin:#6B4FA0; --insulin-tint:#EBE5F5;
  --blue:#2E74B5; --blue-tint:#E4EFF9;
  --radius:16px; --radius-sm:12px;
  --shadow-sm:0 1px 2px rgba(20,40,38,0.05);
  --shadow-md:0 6px 20px rgba(15,45,42,0.08);
  --shadow-lg:0 10px 32px rgba(10,35,32,0.16);
  --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0; height:100%;}
body{background:var(--bg); font-family:var(--font-body); color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh; min-height:100dvh;}
#appShell{max-width:480px; margin:0 auto; height:100vh; height:100dvh; background:var(--bg); position:relative; display:flex; flex-direction:column; box-shadow:var(--shadow-lg); overflow:hidden;}
@media(min-width:520px){ body{padding:26px 0;} #appShell{height:calc(100dvh - 52px); border-radius:26px;} }
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

header.appbar{
  position:sticky; top:0; z-index:20;
  background:radial-gradient(120% 140% at 15% 0%, #12746B 0%, var(--teal-deep) 55%, #073834 100%);
  color:#fff; padding:calc(14px + env(safe-area-inset-top)) 18px 12px; display:flex; flex-direction:column; gap:9px;
}
.appbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.brand{display:flex; align-items:baseline; gap:8px;}
.brand-mark{font-family:var(--font-display); font-weight:600; font-size:19px; letter-spacing:0.2px;}
.status-pill{display:flex; align-items:center; gap:6px; font-size:10px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.04em; color:#CFE9E4; background:rgba(255,255,255,0.08); padding:4px 9px; border-radius:20px; border:1px solid rgba(255,255,255,0.14); cursor:default; transition:background .2s;}
.status-dot{width:6px;height:6px;border-radius:50%; background:#F0C46B; box-shadow:0 0 0 3px rgba(240,196,107,0.22); transition:background .2s; flex-shrink:0;}
.status-dot.live{background:#5FD6A8; box-shadow:0 0 0 3px rgba(95,214,168,0.22);}
.status-dot.off{background:#E88A7D; box-shadow:0 0 0 3px rgba(232,138,125,0.22);}
.caregiver-pill{display:flex; align-items:center; gap:7px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.16); padding:5px 11px 5px 5px; border-radius:20px; font-size:12.5px; font-weight:600; cursor:pointer; transition:background .15s;}
.caregiver-pill:active{background:rgba(255,255,255,0.2);}
.caregiver-pill .avatar{width:20px;height:20px;border-radius:50%;background:#5FD6A8;color:#0A4A45; font-size:9.5px; font-weight:700; display:flex;align-items:center;justify-content:center; font-family:var(--font-mono);}
.icon-btn{background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.16); width:32px;height:32px;border-radius:10px; color:#fff; display:flex;align-items:center;justify-content:center; cursor:pointer; transition:background .15s, transform .1s;}
.icon-btn:active{background:rgba(255,255,255,0.22); transform:scale(0.94);}
.icon-btn svg{width:15px;height:15px;}
.icon-btn.spinning svg{animation:spin 0.8s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}
.date-line{font-size:12.5px; color:#BFE0DA; font-weight:500;}

nav.tabs{display:flex; gap:1px; padding:8px 6px 0; background:var(--bg); border-bottom:1px solid var(--line);}
nav.tabs button{position:relative; flex:1; border:none; background:transparent; padding:9px 1px 10px; font-family:var(--font-body); font-weight:700; font-size:10.5px; color:var(--ink-faint); cursor:pointer; border-bottom:2px solid transparent; transition:color .15s, border-color .15s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
nav.tabs button.active{color:var(--teal-deep); border-bottom-color:var(--teal);}
.tab-dot{position:absolute; top:5px; right:calc(50% - 20px); width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 0 2px var(--bg);}

.conn-banner{display:flex; align-items:center; gap:10px; background:var(--red-tint); color:var(--red); padding:10px 16px; font-size:12px; line-height:1.4; border-bottom:1px solid #E7B4AD;}
.conn-banner svg{width:15px;height:15px; flex-shrink:0;}
.conn-banner span{flex:1;}
.conn-banner button{background:var(--red); color:#fff; border:none; padding:6px 10px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; flex-shrink:0;}

main{flex:1; min-height:0; padding:14px 16px calc(100px + env(safe-area-inset-bottom)); overflow-y:auto; -webkit-overflow-scrolling:touch;}
.view-fade{animation:fadeIn .22s ease-out;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

.section-title{font-family:var(--font-body); font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.07em; font-size:11px; margin:20px 3px 9px;}
.section-title:first-child{margin-top:2px;}
.section-hint{font-size:11px; color:var(--ink-faint); margin:-5px 3px 10px;}

.progress-hero{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 16px; box-shadow:var(--shadow-sm);}
.progress-top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:9px;}
.progress-label{font-family:var(--font-display); font-weight:600; font-size:15px; color:var(--ink);}
.progress-count{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);}
.progress-track{height:7px; background:var(--surface-alt); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--teal), #189384); border-radius:6px; transition:width .4s ease;}
.progress-note{font-size:11.5px; color:var(--ink-faint); margin-top:8px;}
.progress-note.attn{color:var(--red); font-weight:600;}

.vital-hero{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 17px; box-shadow:var(--shadow-sm);}
.vital-hero-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
.vital-big{font-family:var(--font-display); font-weight:600; font-size:34px; color:var(--ink); line-height:1;}
.vital-big small{font-family:var(--font-body); font-weight:600; font-size:13px; color:var(--ink-soft); margin-left:4px;}
.vital-sub{font-size:12px; color:var(--ink-soft); margin-top:4px; font-family:var(--font-mono);}
.vital-chip{font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap;}
.chip-normal{background:var(--green-tint); color:var(--green);}
.chip-elevated{background:var(--amber-tint); color:var(--amber);}
.chip-high{background:var(--red-tint); color:var(--red);}
.chip-low{background:var(--blue-tint); color:var(--blue);}
.vital-trend{margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
.vital-trend svg{width:13px;height:13px;}
.vital-trend.up svg{color:var(--amber);} .vital-trend.down svg{color:var(--blue);} .vital-trend.flat svg{color:var(--ink-faint);}
.vital-stat{font-size:11.5px; color:var(--ink-faint); margin-top:5px;}
.chart-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 12px 10px; box-shadow:var(--shadow-sm); margin-top:12px;}
.chart-legend{display:flex; gap:14px; padding:0 4px 8px; font-size:11px; color:var(--ink-soft);}
.chart-legend span{display:flex; align-items:center; gap:5px;}
.chart-legend i{width:9px;height:9px;border-radius:50%; display:inline-block;}
.vitals-note{font-size:10.5px; color:var(--ink-faint); line-height:1.5; margin-top:10px; padding:0 2px;}

.reading-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 13px; margin-bottom:8px; cursor:pointer; transition:transform .1s; box-shadow:var(--shadow-sm);}

/* stock tab */
.stock-alert{background:var(--red-tint); border:1px solid #E7B4AD; border-radius:var(--radius); padding:14px 15px; margin-bottom:16px; display:flex; gap:10px; align-items:flex-start;}
.stock-alert svg{width:18px;height:18px; color:var(--red); flex-shrink:0; margin-top:1px;}
.stock-alert-title{font-weight:700; font-size:13.5px; color:var(--red);}
.stock-alert-list{font-size:12px; color:#9A3B32; margin-top:3px; line-height:1.5;}
.stock-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:13px; margin-bottom:10px; cursor:pointer; transition:transform .1s; box-shadow:var(--shadow-sm);}
.stock-card:active{transform:scale(0.985);}
.stock-card.low{border-color:#E7B4AD; background:var(--red-tint);}
.stock-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:9px;}
.stock-name{font-weight:700; font-size:14.5px;}
.stock-qty{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.stock-track{height:8px; background:var(--surface-alt); border-radius:6px; overflow:hidden; margin-bottom:7px;}
.stock-fill{height:100%; border-radius:6px; transition:width .3s ease; background:var(--green);}
.stock-fill.warn{background:var(--amber);}
.stock-fill.danger{background:var(--red);}
.stock-days{font-size:11.5px; color:var(--ink-faint);}
.stock-days.low{color:var(--red); font-weight:700;}
.reading-row:active{transform:scale(0.985);}
.reading-row-main{flex:1; min-width:0;}
.reading-row-value{font-weight:700; font-size:15px; font-family:var(--font-mono);}
.reading-row-sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

/* accordion (date-grouped history, tap-to-expand) */
.accordion-row{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:9px; overflow:hidden; box-shadow:var(--shadow-sm);}
.accordion-header{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 13px; cursor:pointer;}
.accordion-header:active{background:var(--surface-alt);}
.accordion-date{font-weight:700; font-size:13.5px; flex-shrink:0;}
.accordion-summary{font-size:11.5px; color:var(--ink-soft); font-family:var(--font-mono); text-align:right; flex:1;}
.accordion-chevron{color:var(--ink-faint); flex-shrink:0; transition:transform .18s;}
.accordion-chevron svg{width:14px;height:14px; display:block;}
.accordion-chevron.open{transform:rotate(90deg);}
.accordion-body{padding:2px 13px 12px; border-top:1px solid var(--line);}
.accordion-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); cursor:pointer;}
.accordion-item:last-child{border-bottom:none;}
.accordion-item-main{flex:1; min-width:0;}
.accordion-item-title{font-weight:600; font-size:13px;}
.accordion-item-sub{font-size:11px; color:var(--ink-soft); margin-top:1px; font-family:var(--font-mono);}

.timeline{position:relative; padding-left:26px;}
.timeline::before{content:''; position:absolute; left:9px; top:4px; bottom:4px; width:2px; background:var(--line);}
.dose-node{position:relative; margin-bottom:12px;}
.dose-dot{position:absolute; left:-26px; top:14px; width:20px;height:20px; border-radius:50%; background:var(--surface); border:2px solid var(--ink-faint); z-index:2; display:flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s;}
.dose-dot svg{width:11px;height:11px; opacity:0;}
.dose-node.given .dose-dot{background:var(--green); border-color:var(--green);}
.dose-node.given .dose-dot svg{opacity:1; stroke:#fff;}
.dose-node.overdue .dose-dot{border-color:var(--red); background:var(--red-tint);}
.dose-node.due .dose-dot{border-color:var(--amber); background:var(--amber-tint); animation:pulse 1.7s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,127,31,0.35);}50%{box-shadow:0 0 0 5px rgba(200,127,31,0);}}
.dose-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 13px; cursor:pointer; transition:border-color .15s, transform .1s, box-shadow .15s; box-shadow:var(--shadow-sm);}
.dose-card:active{transform:scale(0.985); box-shadow:none;}
.dose-node.overdue .dose-card{border-color:#E7B4AD; background:var(--red-tint);}
.dose-node.due .dose-card{border-color:#EBC98C; background:var(--amber-tint);}
.dose-node.given .dose-card{background:var(--green-tint); border-color:#BFE0CB;}
.dose-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.dose-name-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.dose-name{font-weight:700; font-size:14.5px; color:var(--ink);}
.insulin-chip{font-size:9.5px; font-family:var(--font-mono); font-weight:600; letter-spacing:0.03em; background:var(--insulin-tint); color:var(--insulin); padding:2px 6px; border-radius:6px; display:flex; align-items:center; gap:3px; text-transform:uppercase;}
.insulin-chip svg{width:9px;height:9px;}
.dose-time{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); white-space:nowrap; font-weight:600;}
.dose-dosage{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.dose-meta{margin-top:7px; font-size:11.5px; font-family:var(--font-mono); display:flex; align-items:center; gap:5px;}
.dose-meta.given{color:var(--green);} .dose-meta.overdue{color:var(--red); font-weight:600;} .dose-meta.due{color:var(--amber); font-weight:600;} .dose-meta.upcoming{color:var(--ink-faint);}

.empty-state{text-align:center; padding:52px 24px; color:var(--ink-faint);}
.empty-state svg{width:38px;height:38px; opacity:0.5; margin-bottom:10px;}
.empty-state p{font-size:13px; margin:4px 0;}
.empty-state .cta{color:var(--teal); font-weight:700; cursor:pointer;}
.empty-mini{text-align:center; padding:16px; color:var(--ink-faint); font-size:12px;}

.med-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 13px; margin-bottom:10px; cursor:pointer; transition:transform .1s, box-shadow .15s; box-shadow:var(--shadow-sm);}
.med-row:active{transform:scale(0.985);}
.med-row-swatch{width:38px;height:38px;border-radius:11px; background:var(--teal-tint); color:var(--teal-deep); display:flex;align-items:center;justify-content:center; font-family:var(--font-display); font-weight:600; font-size:16px; flex-shrink:0;}
.med-row.insulin .med-row-swatch{background:var(--insulin-tint); color:var(--insulin);}
.med-row-body{flex:1; min-width:0;}
.med-row-name{font-weight:700; font-size:14px;}
.med-row-sub{font-size:12px; color:var(--ink-soft); margin-top:1px;}
.med-row-chevron{color:var(--ink-faint); flex-shrink:0;}
.med-row-chevron svg{width:16px;height:16px;}

.fab{position:absolute; right:18px; bottom:calc(22px + env(safe-area-inset-bottom)); width:56px;height:56px; border-radius:50%; background:var(--teal); color:#fff; border:none; box-shadow:0 8px 22px rgba(15,107,99,0.38); display:flex;align-items:center;justify-content:center; cursor:pointer; z-index:15; transition:transform .1s, background .15s;}
.fab:active{transform:scale(0.92);}
.fab svg{width:22px;height:22px;}

.overlay{position:absolute; inset:0; background:rgba(10,20,19,0.46); z-index:30; display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(1px);}
.overlay.open{display:flex;}
.sheet{background:var(--surface); width:100%; max-width:480px; border-radius:22px 22px 0 0; max-height:92vh; max-height:92dvh; overflow:hidden; display:flex; flex-direction:column; animation:slideUp .22s cubic-bezier(.2,.8,.3,1);}
@keyframes slideUp{from{transform:translateY(28px); opacity:0.3;} to{transform:translateY(0); opacity:1;}}
.sheet-scroll{flex:1; min-height:0; overflow-y:auto; padding:8px 20px 10px; -webkit-overflow-scrolling:touch;}
.sheet-footer{flex-shrink:0; padding:10px 20px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--surface);}
.sheet-footer .btn{margin-top:8px;}
.sheet-footer .btn:first-child{margin-top:0;}
.sheet-handle{width:36px;height:4px;background:var(--line); border-radius:4px; margin:8px auto 12px;}
.sheet-title{font-family:var(--font-display); font-size:18px; font-weight:600; margin:0 0 3px;}
.sheet-desc{font-size:12px; color:var(--ink-soft); margin:0 0 12px; line-height:1.45;}
.field{margin-bottom:11px;}
.field label{display:block; font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:5px;}
.field input[type=text], .field input[type=number], .field input[type=time], .field input[type=datetime-local], .field textarea, .field select{width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; font-family:var(--font-body); font-size:14.5px; background:var(--surface); color:var(--ink);}
.field textarea{resize:vertical; min-height:44px;}
.field textarea[readonly]{background:var(--surface-alt); font-family:var(--font-mono); font-size:12px;}
.field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:7px 0;}
.toggle-row .tlabel{font-size:14px; font-weight:700;}
.toggle-row .thint{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
.switch{position:relative; width:44px; height:26px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.switch .track{position:absolute; inset:0; background:var(--line); border-radius:20px; cursor:pointer; transition:.15s;}
.switch .track::before{content:''; position:absolute; left:3px; top:3px; width:20px;height:20px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,0.2);}
.switch input:checked + .track{background:var(--insulin);}
.switch input:checked + .track::before{transform:translateX(18px);}

.schedule-list{display:flex; flex-direction:column; gap:6px; margin-bottom:8px;}
.schedule-row{display:flex; gap:8px; align-items:center; background:var(--surface-alt); padding:8px; border-radius:10px;}
.schedule-row select{flex:1.1; padding:9px 8px; border-radius:8px; border:1.5px solid var(--line); font-size:13px;}
.schedule-row input[type=time]{flex:1; padding:9px 8px; border-radius:8px; border:1.5px solid var(--line); font-size:13px; font-family:var(--font-mono);}
.schedule-row .rm{background:none; border:none; color:var(--red); cursor:pointer; padding:4px;}
.schedule-row .rm svg{width:16px;height:16px;}
.add-time-btn{display:flex; align-items:center; gap:6px; background:none; border:1.5px dashed var(--line); color:var(--teal); font-weight:700; font-size:13px; padding:9px; border-radius:10px; width:100%; cursor:pointer; justify-content:center;}
.add-time-btn svg{width:14px;height:14px;}

.btn{width:100%; padding:13px; border-radius:12px; border:none; font-weight:700; font-size:14.5px; cursor:pointer; font-family:var(--font-body); transition:transform .1s, background .15s;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--teal); color:#fff; margin-top:6px;}
.btn-primary:active{background:var(--teal-deep);}
.btn-danger{background:var(--red-tint); color:var(--red); margin-top:8px;}
.btn-ghost{background:var(--surface-alt); color:var(--ink); margin-top:8px;}
.btn:disabled{opacity:0.5; cursor:not-allowed;}

.history-list{margin-top:4px; border-top:1px solid var(--line); padding-top:10px;}
.history-item{display:flex; justify-content:space-between; font-size:12px; padding:6px 0; color:var(--ink-soft); font-family:var(--font-mono);}

.confirm-summary{background:var(--surface-alt); border-radius:12px; padding:14px; margin-bottom:14px;}
.confirm-summary .cname{font-family:var(--font-display); font-weight:600; font-size:17px;}
.confirm-summary .cmeta{font-size:12.5px; color:var(--ink-soft); margin-top:3px; font-family:var(--font-mono);}

<body>
<div id="appShell">

<script>
(function(){
"use strict";

/* =========================================================================
   DATA LAYER — JSONBin.io (plain fetch, no SDK — see earlier notes on why)
   ========================================================================= */
const JSONBIN_ID = '6a94419bda38895dfe233008';
const JSONBIN_KEY = '$2a$10$i78eTjIRWV3yOjzkr19RuerFkQdK1nwksK7KDXKe4DyG50jGUTbvG';
const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b/' + JSONBIN_ID;
const GLUCOSE_UNIT = 'mmol/L';

function lsGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function lsSet(key, value){ try{ localStorage.setItem(key, value); }catch(e){ /* ignore */ } }
const LS_NAME_KEY = 'momscare_caregiver';

async function safeText(res){ try{ return await res.text(); }catch(e){ return ''; } }

/* Every request gets a real, enforced timeout via AbortController. This is
   the actual fix for "editing/deleting doesn't work": in some restricted
   browser contexts a fetch can hang indefinitely with no error and no
   success. Without this, there was no way to tell hung-forever apart from
   genuinely slow-but-working — so the old code guessed after a few seconds
   and sometimes guessed wrong, closing a sheet as if it had saved when it
   hadn't. This guarantees every request truthfully settles within 10s. */
async function fetchWithTimeout(url, opts, timeoutMs){
  timeoutMs = timeoutMs || 10000;
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  try{
    return await fetch(url, Object.assign({}, opts, {signal: controller.signal}));
  }catch(e){
    if(e.name === 'AbortError'){
      throw new Error('Request timed out after ' + (timeoutMs/1000) + 's — the connection never completed. This can happen in restricted browser contexts.');
    }
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

async function fetchBin(){
  const res = await fetchWithTimeout(JSONBIN_BASE + '/latest', { headers: { 'X-Master-Key': JSONBIN_KEY } });
  if(!res.ok) throw new Error('GET ' + res.status + ': ' + (await safeText(res)));
  const json = await res.json();
  const record = json.record || {};
  return {
    medications: record.medications || {},
    doseLogs: record.doseLogs || {},
    glucoseReadings: record.glucoseReadings || {},
    bpReadings: record.bpReadings || {},
    careEvents: record.careEvents || {}
  };
}
async function pushBin(fullObj){
  const res = await fetchWithTimeout(JSONBIN_BASE, {
    method:'PUT',
    headers:{ 'Content-Type':'application/json', 'X-Master-Key': JSONBIN_KEY, 'X-Bin-Versioning':'false' },
    body: JSON.stringify(fullObj)
  });
  if(!res.ok) throw new Error('PUT ' + res.status + ': ' + (await safeText(res)));
  return true;
}
function applyState(obj){
  medications = obj.medications || {};
  doseLogs = obj.doseLogs || {};
  glucoseReadings = obj.glucoseReadings || {};
  bpReadings = obj.bpReadings || {};
  careEvents = obj.careEvents || {};
}
function safeRender(){
  try{ render(); }
  catch(e){
    console.error('render() threw — this is a display bug, not a data problem. The write itself already succeeded:', e);
    toast('Display error after saving — the data saved fine, but try switching tabs or refreshing to see it.');
  }
}

async function mutateBin(mutatorFn){
  const latest = await fetchBin();
  mutatorFn(latest);
  await pushBin(latest);
  applyState(latest);
  safeRender();
  return latest;
}

let pollTimer = null;
const Store = {
  async init(){
    try{ const obj = await fetchBin(); applyState(obj); handleConnOk(); safeRender(); }
    catch(e){ console.error('init fetch failed:', e); handleConnError(e); }
    startPolling();
  },
  saveMed(id, data){ return mutateBin(s=>{ s.medications[id] = Object.assign({id}, data); }); },
  deleteMed(id){ return mutateBin(s=>{ delete s.medications[id]; }); },
  setLog(key, data){ return mutateBin(s=>{ s.doseLogs[key] = data; }); },
  deleteLog(key){ return mutateBin(s=>{ delete s.doseLogs[key]; }); },
  setLogAndDeductStock(key, data, medId, amount){
    return mutateBin(s=>{
      s.doseLogs[key] = data;
      const med = s.medications[medId];
      if(med && med.stock && med.stock.enabled){
        med.stock.qty = Math.max(0, (med.stock.qty||0) - (amount||0));
      }
    });
  },
  deleteLogAndRestoreStock(key, medId, amount){
    return mutateBin(s=>{
      delete s.doseLogs[key];
      const med = s.medications[medId];
      if(med && med.stock && med.stock.enabled){
        const cap = med.stock.initialQty || Infinity;
        med.stock.qty = Math.min(cap, (med.stock.qty||0) + (amount||0));
      }
    });
  },
  saveStock(medId, stockObj){
    return mutateBin(s=>{
      const med = s.medications[medId];
      if(med) med.stock = stockObj;
    });
  },
  saveGlucose(id, data){ return mutateBin(s=>{ s.glucoseReadings[id] = Object.assign({id}, data); }); },
  deleteGlucose(id){ return mutateBin(s=>{ delete s.glucoseReadings[id]; }); },
  saveBP(id, data){ return mutateBin(s=>{ s.bpReadings[id] = Object.assign({id}, data); }); },
  deleteBP(id){ return mutateBin(s=>{ delete s.bpReadings[id]; }); },
  replaceMedications(newMedsObj){ return mutateBin(s=>{ s.medications = newMedsObj; }); },
  saveCareEvent(id, data){ return mutateBin(s=>{ if(!s.careEvents) s.careEvents = {}; s.careEvents[id] = Object.assign({id}, data); }); },
  deleteCareEvent(id){ return mutateBin(s=>{ if(s.careEvents) delete s.careEvents[id]; }); },
  markCareEventDone(id){
    return mutateBin(s=>{
      if(!s.careEvents) return;
      const ev = s.careEvents[id];
      if(!ev) return;
      ev.lastDone = new Date().toISOString();
      if(ev.repeatDays && Number(ev.repeatDays) > 0){
        const next = new Date(ev.nextDate+'T00:00:00');
        next.setDate(next.getDate() + Number(ev.repeatDays));
        ev.nextDate = todayStr(next);
      }
    });
  },
  async clearAll(){
    const fresh = { medications:{}, doseLogs:{}, glucoseReadings:{}, bpReadings:{}, careEvents:{} };
    await pushBin(fresh);
    applyState(fresh);
    safeRender();
  }
};

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(syncNow, 20000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncNow(); });
}
async function syncNow(showFeedback){
  const btn = document.getElementById('syncBtn');
  if(showFeedback && btn) btn.classList.add('spinning');
  try{
    const obj = await fetchBin();
    applyState(obj); handleConnOk(); safeRender();
    if(showFeedback) toast('Synced');
  }catch(e){
    console.error('sync failed:', e);
    handleConnError(e);
    if(showFeedback) toast(friendlyError(e));
  }
  if(showFeedback && btn) setTimeout(()=>btn.classList.remove('spinning'), 300);
}
document.getElementById('syncBtn').addEventListener('click', ()=>syncNow(true));

function setStatus(ok){
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if(!dot) return;
  dot.classList.toggle('live', ok);
  dot.classList.toggle('off', !ok);
  txt.textContent = ok ? 'Synced' : 'Offline';
}
let lastSyncedAt = null;
function handleConnOk(){ setStatus(true); hideConnBanner(); lastSyncedAt = new Date(); }
function handleConnError(err){ setStatus(false); showConnBanner(friendlyError(err)); }
function showConnBanner(msg){ const el=document.getElementById('connBanner'); document.getElementById('connBannerText').textContent=msg; el.classList.remove('hidden'); }
function hideConnBanner(){ document.getElementById('connBanner').classList.add('hidden'); }
document.getElementById('connRetryBtn').addEventListener('click', ()=>{ hideConnBanner(); setStatus(false); Store.init(); });

function friendlyError(e){
  const msg = ((e && e.message) || String(e));
  if(msg.includes('401') || msg.includes('403')) return 'JSONBin rejected the request — the API key may be wrong.';
  if(msg.includes('404')) return 'JSONBin bin not found — the Bin ID may be wrong.';
  if(/failed to fetch|networkerror|load failed/i.test(msg)) return 'Could not reach JSONBin — check your internet connection.';
  return 'Could not save: ' + msg;
}
async function runWrite(promise, label){
  try{
    await promise;
    return null;
  }catch(e){
    console.error(label+' failed:', e);
    toast(friendlyError(e));
    showConnBanner(friendlyError(e));
    return e;
  }
}

/* ---------------- Icons ---------------- */
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const ICON_DROP = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-3.5 5-7 9.2-7 13a7 7 0 0014 0c0-3.8-3.5-8-7-13z"/></svg>';
const ICON_CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg>';
const ICON_EMPTY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22c5-4 8-8.5 8-13a8 8 0 10-16 0c0 4.5 3 9 8 13z"/></svg>';
const ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H9M17 7v8"/></svg>';
const ICON_DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 17H9M17 17V9"/></svg>';
const ICON_FLAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>';

const CHART_COLORS = { teal:'#0F6B63', insulin:'#6B4FA0', inkFaint:'#8FA29F', line:'#DCE6E3' };

/* ---------------- State ---------------- */
let medications = {}, doseLogs = {}, glucoseReadings = {}, bpReadings = {}, careEvents = {};
let currentCaregiver = '';
let activeTab = 'today';
let editingMedId = null, pendingSchedule = [];
let confirmCtx = null;
let editingGlucoseId = null, editingBPId = null;
let editingCareEventId = null;
const expandedDates = { today:new Set(), glucose:new Set(), pressure:new Set() };
const CARE_TYPE_PRESETS = ['Dressing change','Doctor checkup','Follow-up appointment','Blood test','Physical therapy','Other'];

const LABEL_ORDER = ['Morning','Afternoon','Evening','Night','Custom'];
const GLUCOSE_CONTEXTS = ['Fasting','Before meal','After meal','Bedtime','Random'];

function todayStr(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtTime(t){ const [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; let hh=h%12; if(hh===0)hh=12; return hh+':'+String(m).padStart(2,'0')+' '+ap; }
function fmtDateTime(iso){ const d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function fmtTimeOnly(iso){ const d=new Date(iso); return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function fmtDateLabel(dateKey){
  const today = todayStr();
  const y = new Date(); y.setDate(y.getDate()-1); const yest = todayStr(y);
  if(dateKey===today) return 'Today';
  if(dateKey===yest) return 'Yesterday';
  const d = new Date(dateKey+'T00:00:00');
  return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
}
function nowLocalInputValue(){ return isoToLocalInputValue(new Date().toISOString()); }
function isoToLocalInputValue(iso){ const d=new Date(iso); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function initials(name){ if(!name) return '?'; const p=name.trim().split(/\s+/); return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase(); }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._h);
  const duration = msg.length>40 ? 4200 : 2200;
  toast._h = setTimeout(()=>t.classList.remove('show'), duration);
}

/* ---------------- Boot ---------------- */
function boot(){
  const name = lsGet(LS_NAME_KEY);
  if(name) currentCaregiver = name;
  updateDateLine(); updateCaregiverPill(); setStatus(false);
  Store.init();
  if(!currentCaregiver) setTimeout(()=>openNameSheet(), 400);
}
function updateDateLine(){ document.getElementById('dateLine').textContent = new Date().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'}); }
function updateCaregiverPill(){
  document.getElementById('caregiverAvatar').textContent = currentCaregiver ? initials(currentCaregiver) : '?';
  document.getElementById('caregiverNameLabel').textContent = currentCaregiver || 'Set name';
}

/* ---------------- Tabs ---------------- */
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    updateFabForTab();
    render();
  });
});
function updateFabForTab(){
  const fab = document.getElementById('fabAdd');
  const titles = {today:'Add medication', manage:'Add medication', glucose:'Log glucose reading', pressure:'Log blood pressure', care:'Add care reminder'};
  fab.title = titles[activeTab] || 'Add';
  fab.style.display = activeTab === 'stock' ? 'none' : 'flex';
}
function lowStockMeds(){
  return Object.values(medications).filter(m => m.stock && m.stock.enabled && (m.stock.qty||0) <= (m.stock.lowThreshold||0));
}
function updateLowStockIndicator(){
  const dot = document.getElementById('stockTabDot');
  if(dot) dot.classList.toggle('hidden', lowStockMeds().length === 0);
}
function careDaysUntil(dateKey){
  const today = new Date(todayStr()+'T00:00:00');
  const target = new Date(dateKey+'T00:00:00');
  return Math.round((target-today)/86400000);
}
function dueSoonCareEvents(){
  return Object.values(careEvents).filter(ev => careDaysUntil(ev.nextDate) <= 2);
}
function updateCareIndicator(){
  const dot = document.getElementById('careTabDot');
  if(dot) dot.classList.toggle('hidden', dueSoonCareEvents().length === 0);
}

/* ---------------- Generic accordion renderer ---------------- */
function renderAccordion(tabKey, groups, itemRenderFn){
  if(groups.length === 0) return '';
  return groups.map(g=>{
    const isOpen = expandedDates[tabKey].has(g.dateKey);
    return `
      <div class="accordion-row">
        <div class="accordion-header" data-action="toggle-date" data-tab="${tabKey}" data-date="${g.dateKey}">
          <span class="accordion-date">${esc(g.dateLabel)}</span>
          <span class="accordion-summary">${esc(g.summary)}</span>
          <span class="accordion-chevron ${isOpen?'open':''}">${ICON_CHEVRON}</span>
        </div>
        ${isOpen ? `<div class="accordion-body">${g.items.map(itemRenderFn).join('')}</div>` : ''}
      </div>`;
  }).join('');
}

/* ================= TODAY (medication timeline + history) ================= */
function computeDoseInstances(){
  const list = [];
  Object.values(medications).forEach(med=>{ (med.schedule||[]).forEach(s=>{ list.push({med, sched:s}); }); });
  list.sort((a,b)=> a.sched.time.localeCompare(b.sched.time));
  return list;
}
function doseStatus(med, sched){
  const key = todayStr()+'_'+med.id+'_'+sched.id;
  const log = doseLogs[key];
  if(log) return {status:'given', key, log};
  const now = new Date();
  const [h,m] = sched.time.split(':').map(Number);
  const scheduled = new Date(); scheduled.setHours(h,m,0,0);
  const diffMin = (now - scheduled) / 60000;
  if(diffMin > 30) return {status:'overdue', key};
  if(diffMin >= -30) return {status:'due', key};
  return {status:'upcoming', key};
}

function render(){
  const main = document.getElementById('mainContent');
  updateLowStockIndicator();
  updateCareIndicator();
  try{
    if(activeTab === 'today') renderToday(main);
    else if(activeTab === 'manage') renderManage(main);
    else if(activeTab === 'glucose') renderVitalTab(main, 'glucose');
    else if(activeTab === 'pressure') renderVitalTab(main, 'pressure');
    else if(activeTab === 'stock') renderStock(main);
    else if(activeTab === 'care') renderCare(main);
  }catch(e){
    console.error('render failed for tab "'+activeTab+'":', e);
    main.innerHTML = `<div class="view-fade empty-state"><p><strong>Something went wrong showing this tab.</strong></p><p style="font-family:var(--font-mono); font-size:11px; color:var(--red);">${esc(e.message||String(e))}</p><p class="cta" onclick="location.reload()">Tap to reload the app</p></div>`;
  }
}

function renderToday(main){
  const instances = computeDoseInstances();
  let html = '<div class="view-fade">';

  if(instances.length === 0){
    html += `<div class="empty-state">${ICON_EMPTY}<p><strong>No medications yet.</strong></p><p>Tap the <span class="cta" onclick="document.getElementById('fabAdd').click()">+ button</span> to add mom's first medication and set its times.</p></div></div>`;
    main.innerHTML = html;
    return;
  }

  const given = instances.filter(i=>doseStatus(i.med,i.sched).status==='given').length;
  const overdue = instances.filter(i=>doseStatus(i.med,i.sched).status==='overdue').length;
  const pct = Math.round((given/instances.length)*100);

  const buckets = {};
  instances.forEach(inst=>{
    const label = inst.sched.label || 'Custom';
    if(!buckets[label]) buckets[label] = [];
    buckets[label].push(inst);
  });
  const orderedLabels = Object.keys(buckets).sort((a,b)=>{
    const ia = LABEL_ORDER.indexOf(a); const ib = LABEL_ORDER.indexOf(b);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });

  html += `
    <div class="progress-hero">
      <div class="progress-top"><span class="progress-label">Today's doses</span><span class="progress-count">${given} / ${instances.length} given</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${overdue>0 ? `<div class="progress-note attn">${overdue} dose${overdue===1?'':'s'} overdue — tap below to log</div>` : `<div class="progress-note">On track for the day</div>`}
      ${(()=>{ const low=lowStockMeds(); return low.length>0 ? `<div class="progress-note attn">⚠ ${low.length} medicine${low.length===1?'':'s'} running low — check the Stock tab</div>` : ''; })()}
    </div>`;

  orderedLabels.forEach(label=>{
    html += `<div class="section-title">${esc(label)}</div><div class="timeline">`;
    buckets[label].forEach(inst=>{
      const {med, sched} = inst;
      const st = doseStatus(med, sched);
      let metaHtml = '';
      if(st.status === 'given') metaHtml = `<div class="dose-meta given">✓ Given by ${esc(st.log.takenBy)} · ${fmtDateTime(st.log.takenAt)}</div>`;
      else if(st.status === 'overdue') metaHtml = `<div class="dose-meta overdue">Overdue — not yet given</div>`;
      else if(st.status === 'due') metaHtml = `<div class="dose-meta due">Due now</div>`;
      else metaHtml = `<div class="dose-meta upcoming">Upcoming</div>`;
      html += `
        <div class="dose-node ${st.status}">
          <div class="dose-dot">${ICON_CHECK}</div>
          <div class="dose-card" data-action="dose" data-med="${med.id}" data-sched="${sched.id}" data-date="${todayStr()}">
            <div class="dose-top">
              <div class="dose-name-row">
                <span class="dose-name">${esc(med.name)}</span>
                ${med.insulin ? `<span class="insulin-chip">${ICON_DROP} Insulin</span>` : ''}
              </div>
              <span class="dose-time">${fmtTime(sched.time)}</span>
            </div>
            ${med.dosage ? `<div class="dose-dosage">${esc(med.dosage)}</div>` : ''}
            ${metaHtml}
          </div>
        </div>`;
    });
    html += `</div>`;
  });

  /* ---- History: past days' logged doses, grouped by date, tap to expand ---- */
  const pastLogs = Object.entries(doseLogs).filter(([k,v]) => v.date && v.date !== todayStr());
  if(pastLogs.length > 0){
    const byDate = {};
    pastLogs.forEach(([key, log])=>{
      const med = medications[log.medId];
      const sched = med ? (med.schedule||[]).find(s=>s.id===log.scheduleId) : null;
      if(!byDate[log.date]) byDate[log.date] = [];
      byDate[log.date].push({key, log, med, sched});
    });
    const dateKeys = Object.keys(byDate).sort((a,b)=> b.localeCompare(a)).slice(0,21);
    const groups = dateKeys.map(dateKey=>{
      const items = byDate[dateKey].sort((a,b)=> a.log.takenAt.localeCompare(b.log.takenAt));
      return { dateKey, dateLabel: fmtDateLabel(dateKey), summary: `${items.length} dose${items.length===1?'':'s'} logged`, items };
    });
    html += `<div class="section-title">History</div>`;
    html += renderAccordion('today', groups, (it)=>{
      const name = it.med ? esc(it.med.name) : 'Medication (no longer listed)';
      return `<div class="accordion-item" data-action="dose" data-med="${it.log.medId}" data-sched="${it.log.scheduleId}" data-date="${it.log.date}">
        <div class="accordion-item-main">
          <div class="accordion-item-title">${name}</div>
          <div class="accordion-item-sub">Given by ${esc(it.log.takenBy)} · ${fmtTimeOnly(it.log.takenAt)}</div>
        </div>
      </div>`;
    });
  }

  html += `</div>`;
  main.innerHTML = html;
}

/* ================= STOCK (inventory tracking) ================= */
function stockDosesPerDay(med){
  const perDoseUnits = (med.stock && med.stock.unitsPerDose) || 1;
  return (med.schedule||[]).length * perDoseUnits;
}
function renderStock(main){
  const meds = Object.values(medications).sort((a,b)=>a.name.localeCompare(b.name));
  if(meds.length === 0){
    main.innerHTML = `<div class="view-fade empty-state">${ICON_EMPTY}<p><strong>No medications added yet.</strong></p><p>Add medicines on the <span class="cta" onclick="document.querySelector('[data-tab=manage]').click()">Meds tab</span> first, then set up stock tracking for each one here.</p></div>`;
    return;
  }
  const tracked = meds.filter(m => m.stock && m.stock.enabled);
  const untracked = meds.filter(m => !(m.stock && m.stock.enabled));
  const low = lowStockMeds();

  let html = '<div class="view-fade">';

  if(low.length > 0){
    html += `<div class="stock-alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
      <div><div class="stock-alert-title">${low.length} medicine${low.length===1?'':'s'} running low</div>
      <div class="stock-alert-list">${low.map(m=>esc(m.name)).join(', ')} — time to reorder soon.</div></div>
    </div>`;
  }

  if(tracked.length > 0){
    html += `<div class="section-title">Stock levels</div>`;
    const sorted = tracked.slice().sort((a,b)=>{
      const da = stockDosesPerDay(a)>0 ? a.stock.qty/stockDosesPerDay(a) : 9999;
      const db = stockDosesPerDay(b)>0 ? b.stock.qty/stockDosesPerDay(b) : 9999;
      return da - db;
    });
    sorted.forEach(med=>{
      const st = med.stock;
      const pct = st.initialQty>0 ? Math.max(0, Math.min(100, Math.round((st.qty/st.initialQty)*100))) : 0;
      const dpd = stockDosesPerDay(med);
      const daysLeft = dpd>0 ? Math.floor(st.qty/dpd) : null;
      const isLow = st.qty <= (st.lowThreshold||0);
      const fillCls = isLow ? 'danger' : pct<=40 ? 'warn' : '';
      html += `
        <div class="stock-card ${isLow?'low':''}" data-action="stock" data-med="${med.id}">
          <div class="stock-top">
            <div>
              <div class="stock-name">${esc(med.name)}</div>
              <div class="stock-qty">${st.qty} of ${st.initialQty} ${esc(st.unit)} left</div>
            </div>
            ${isLow ? `<span class="vital-chip chip-high">Low</span>` : ''}
          </div>
          <div class="stock-track"><div class="stock-fill ${fillCls}" style="width:${pct}%"></div></div>
          <div class="stock-days ${isLow?'low':''}">${daysLeft!==null ? (daysLeft<=0 ? 'Out today at this rate' : `~${daysLeft} day${daysLeft===1?'':'s'} left at current use`) : 'Add times to this medicine to estimate days left'}</div>
        </div>`;
    });
  }

  if(untracked.length > 0){
    html += `<div class="section-title">Not tracked yet</div><div class="section-hint">Tap a medicine to enter how much you have on hand.</div>`;
    untracked.forEach(med=>{
      html += `
        <div class="med-row" data-action="stock" data-med="${med.id}">
          <div class="med-row-swatch">${esc((med.name||'?')[0].toUpperCase())}</div>
          <div class="med-row-body">
            <div class="med-row-name">${esc(med.name)}</div>
            <div class="med-row-sub">${esc(med.dosage||'')}</div>
          </div>
          <div class="med-row-chevron">${ICON_CHEVRON}</div>
        </div>`;
    });
  }

  html += `</div>`;
  main.innerHTML = html;
}

/* ================= CARE (next dressing change, checkups, etc.) ================= */
function renderCare(main){
  const events = Object.values(careEvents).sort((a,b)=> a.nextDate.localeCompare(b.nextDate));
  if(events.length === 0){
    main.innerHTML = `<div class="view-fade empty-state">${ICON_EMPTY}<p><strong>No care reminders yet.</strong></p><p>Tap the <span class="cta" onclick="document.getElementById('fabAdd').click()">+ button</span> to add the next dressing change, checkup, or appointment date.</p></div>`;
    return;
  }
  const overdue = events.filter(ev => careDaysUntil(ev.nextDate) < 0);
  const upcoming = events.filter(ev => careDaysUntil(ev.nextDate) >= 0);

  let html = '<div class="view-fade">';

  if(overdue.length > 0){
    html += `<div class="stock-alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
      <div><div class="stock-alert-title">${overdue.length} care reminder${overdue.length===1?'':'s'} overdue</div>

    </div>`;
  }

  html += `<div class="section-title">Next up</div><div class="section-hint">Tap a reminder to edit it, reschedule it, or mark it done.</div>`;
  overdue.concat(upcoming).forEach(ev=>{
    const days = careDaysUntil(ev.nextDate);
    const isLow = days < 0;
    const dueSoon = days >= 0 && days <= 2;
    let daysText;
    if(days < 0) daysText = `Overdue by ${Math.abs(days)} day${Math.abs(days)===1?'':'s'} — was due ${fmtDateLabel(ev.nextDate)}`;
    else if(days === 0) daysText = 'Due today';
    else if(days === 1) daysText = 'Due tomorrow';
    else daysText = `In ${days} days — ${fmtDateLabel(ev.nextDate)}`;
    html += `
      <div class="stock-card ${isLow?'low':''}" data-action="care" data-id="${ev.id}">
        <div class="stock-top">
          <div>
            <div class="stock-name">${esc(ev.label)}</div>
            <div class="stock-qty">${ev.repeatDays ? `Repeats every ${ev.repeatDays} day${Number(ev.repeatDays)===1?'':'s'}` : 'One-time'}${ev.notes ? ' · '+esc(ev.notes) : ''}</div>
          </div>
          ${isLow ? `<span class="vital-chip chip-high">Overdue</span>` : dueSoon ? `<span class="vital-chip chip-elevated">Soon</span>` : ''}
        </div>
        <div class="stock-days ${isLow?'low':''}">${daysText}</div>
      </div>`;
  });

  html += `</div>`;
  main.innerHTML = html;
}

/* ================= GLUCOSE & PRESSURE (vitals) ================= */
function glucoseCategory(v){
  if(v < 3.9) return {label:'Low', cls:'chip-low'};
  if(v < 7.8) return {label:'Normal', cls:'chip-normal'};
  if(v < 11.1) return {label:'Elevated', cls:'chip-elevated'};
  return {label:'High', cls:'chip-high'};
}
function bpCategory(sys, dia){
  if(sys>=180 || dia>=120) return {label:'Crisis', cls:'chip-high'};
  if(sys>=140 || dia>=90) return {label:'High · Stage 2', cls:'chip-high'};
  if(sys>=130 || dia>=80) return {label:'High · Stage 1', cls:'chip-elevated'};
  if(sys>=120) return {label:'Elevated', cls:'chip-elevated'};
  return {label:'Normal', cls:'chip-normal'};
}
function computeTrend(values){
  if(values.length < 2) return null;
  const recentCount = Math.max(1, Math.min(3, Math.floor(values.length/2)));
  const recent = values.slice(-recentCount);
  const prior = values.slice(0, values.length - recentCount);
  if(prior.length === 0) return null;
  const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
  const recentAvg = avg(recent), priorAvg = avg(prior);
  const delta = recentAvg - priorAvg;
  let dir = 'flat';
  if(Math.abs(delta) >= Math.max(0.2, priorAvg*0.03)) dir = delta>0 ? 'up' : 'down';
  return {delta, dir};
}
function avgOverDays(readings, days, field){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days);
  const filtered = readings.filter(r => new Date(r.takenAt) >= cutoff);
  if(filtered.length === 0) return null;
  const sum = filtered.reduce((a,r)=> a + (field ? r[field] : r.value), 0);
  return {avg: sum/filtered.length, n: filtered.length};
}
function buildLineChartSVG(seriesList, opts){
  opts = Object.assign({width:320,height:140,padL:32,padR:8,padT:10,padB:20,decimals:0}, opts||{});
  const allVals = seriesList.flatMap(s=>s.values.map(p=>p.v)).filter(v=>typeof v==='number' && !isNaN(v));
  if(allVals.length === 0) return '';
  let yMin = Math.min(...allVals), yMax = Math.max(...allVals);
  if(yMin === yMax){ yMin -= 1; yMax += 1; }
  const pad = (yMax-yMin)*0.15; yMin -= pad; yMax += pad;
  const n = Math.max(...seriesList.map(s=>s.values.length));
  const plotW = opts.width - opts.padL - opts.padR;
  const plotH = opts.height - opts.padT - opts.padB;
  const xFor = i => opts.padL + (n<=1 ? plotW/2 : (i/(n-1))*plotW);
  const yFor = v => opts.padT + plotH - ((v-yMin)/(yMax-yMin))*plotH;

  let svg = `<svg viewBox="0 0 ${opts.width} ${opts.height}" style="width:100%; height:auto; display:block;">`;
  for(let g=0; g<=2; g++){
    const gv = yMin + (yMax-yMin)*(g/2);
    const gy = yFor(gv);
    svg += `<line x1="${opts.padL}" y1="${gy.toFixed(1)}" x2="${opts.width-opts.padR}" y2="${gy.toFixed(1)}" stroke="${CHART_COLORS.line}" stroke-width="1"/>`;
    svg += `<text x="${opts.padL-5}" y="${(gy+3).toFixed(1)}" font-size="8" fill="${CHART_COLORS.inkFaint}" text-anchor="end" font-family="IBM Plex Mono, monospace">${gv.toFixed(opts.decimals)}</text>`;
  }
  seriesList.forEach(s=>{
    if(s.values.length===0) return;
    const pts = s.values.map((p,i)=>`${xFor(i).toFixed(1)},${yFor(p.v).toFixed(1)}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((p,i)=>{ svg += `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(p.v).toFixed(1)}" r="3" fill="${s.color}" stroke="#fff" stroke-width="1.4"/>`; });
  });
  if(opts.xLabels && opts.xLabels.length && n>0){
    const idxs = n<=1 ? [0] : [0, Math.floor((n-1)/2), n-1];
    idxs.forEach(i=>{
      if(opts.xLabels[i]===undefined) return;
      svg += `<text x="${xFor(i).toFixed(1)}" y="${opts.height-5}" font-size="8" fill="${CHART_COLORS.inkFaint}" text-anchor="middle" font-family="IBM Plex Mono, monospace">${esc(opts.xLabels[i])}</text>`;
    });
  }
  svg += `</svg>`;
  return svg;
}
function trendBlock(trend, unitLabel, decimals){
  decimals = decimals===undefined?0:decimals;
  if(!trend) return `<div class="vital-trend flat">${ICON_FLAT}<span>Not enough readings yet for a trend</span></div>`;
  const icon = trend.dir==='up' ? ICON_UP : trend.dir==='down' ? ICON_DOWN : ICON_FLAT;
  const word = trend.dir==='up' ? 'Trending up' : trend.dir==='down' ? 'Trending down' : 'Holding steady';
  const deltaTxt = trend.dir==='flat' ? '' : ` — ${Math.abs(trend.delta).toFixed(decimals)} ${unitLabel} vs recent average`;
  return `<div class="vital-trend ${trend.dir}">${icon}<span>${word}${deltaTxt}</span></div>`;
}

function renderVitalTab(main, kind){
  const isGlucose = kind === 'glucose';
  const dataObj = isGlucose ? glucoseReadings : bpReadings;
  const readings = Object.values(dataObj).sort((a,b)=> a.takenAt.localeCompare(b.takenAt));

  if(readings.length === 0){
    const label = isGlucose ? 'glucose reading' : 'blood pressure reading';
    main.innerHTML = `<div class="view-fade empty-state">${ICON_EMPTY}<p><strong>No ${label}s logged yet.</strong></p><p>Tap the <span class="cta" onclick="document.getElementById('fabAdd').click()">+ button</span> to log the first one.</p></div>`;
    return;
  }

  const latest = readings[readings.length-1];
  const recent = readings.slice(-14);
  let heroHtml, chartHtml, legendHtml = '';

  if(isGlucose){
    const cat = glucoseCategory(latest.value);
    const trend = computeTrend(readings.map(r=>r.value));
    const week = avgOverDays(readings, 7);
    heroHtml = `
      <div class="vital-hero">
        <div class="vital-hero-top">
          <div>
            <div class="vital-big">${latest.value.toFixed(1)}<small>${GLUCOSE_UNIT}</small></div>
            <div class="vital-sub">${esc(latest.context||'')} · ${fmtDateTime(latest.takenAt)}</div>
          </div>
          <span class="vital-chip ${cat.cls}">${cat.label}</span>
        </div>
        ${trendBlock(trend, GLUCOSE_UNIT, 1)}
        ${week ? `<div class="vital-stat">7-day average: ${week.avg.toFixed(1)} ${GLUCOSE_UNIT} (${week.n} reading${week.n===1?'':'s'})</div>` : ''}
      </div>`;
    chartHtml = buildLineChartSVG(
      [{name:'Glucose', color:CHART_COLORS.teal, values: recent.map(r=>({v:r.value}))}],
      {xLabels: recent.map(r=>fmtDateLabel(r.date).slice(0,3)), decimals:1}
    );
  } else {
    const cat = bpCategory(latest.systolic, latest.diastolic);
    const trendSys = computeTrend(readings.map(r=>r.systolic));
    const weekSys = avgOverDays(readings, 7, 'systolic');
    const weekDia = avgOverDays(readings, 7, 'diastolic');
    heroHtml = `
      <div class="vital-hero">
        <div class="vital-hero-top">
          <div>
            <div class="vital-big">${latest.systolic}/${latest.diastolic}<small>mmHg</small></div>
            <div class="vital-sub">${latest.pulse ? esc(latest.pulse)+' bpm · ' : ''}${fmtDateTime(latest.takenAt)}</div>
          </div>
          <span class="vital-chip ${cat.cls}">${cat.label}</span>
        </div>
        ${trendBlock(trendSys, 'mmHg systolic', 0)}
        ${weekSys && weekDia ? `<div class="vital-stat">7-day average: ${Math.round(weekSys.avg)}/${Math.round(weekDia.avg)} mmHg (${weekSys.n} reading${weekSys.n===1?'':'s'})</div>` : ''}
      </div>`;
    chartHtml = buildLineChartSVG(
      [
        {name:'Systolic', color:CHART_COLORS.teal, values: recent.map(r=>({v:r.systolic}))},
        {name:'Diastolic', color:CHART_COLORS.insulin, values: recent.map(r=>({v:r.diastolic}))}
      ],
      {xLabels: recent.map(r=>fmtDateLabel(r.date).slice(0,3)), decimals:0}
    );
    legendHtml = `<div class="chart-legend"><span><i style="background:${CHART_COLORS.teal}"></i>Systolic</span><span><i style="background:${CHART_COLORS.insulin}"></i>Diastolic</span></div>`;
  }

  let html = `<div class="view-fade">${heroHtml}
    <div class="chart-card">${legendHtml}${chartHtml}</div>
    <div class="vitals-note">General reference ranges shown for context only — not medical advice. Always follow your doctor's specific targets for mom.</div>
    <div class="section-title">History</div>
    <div class="section-hint">Tap a date to expand it, then tap any reading to edit or delete it.</div>`;

  const byDate = {};
  readings.forEach(r=>{
    const dk = r.date || todayStr(new Date(r.takenAt));
    if(!byDate[dk]) byDate[dk] = [];
    byDate[dk].push(r);
  });
  const dateKeys = Object.keys(byDate).sort((a,b)=> b.localeCompare(a)).slice(0,30);
  const groups = dateKeys.map(dateKey=>{
    const items = byDate[dateKey].sort((a,b)=> b.takenAt.localeCompare(a.takenAt));
    let summary;
    if(isGlucose){
      const avg = items.reduce((a,r)=>a+r.value,0)/items.length;
      summary = `${items.length} · avg ${avg.toFixed(1)}`;
    } else {
      summary = `${items.length} reading${items.length===1?'':'s'}`;
    }
    return { dateKey, dateLabel: fmtDateLabel(dateKey), summary, items };
  });

  html += renderAccordion(kind, groups, (r)=>{
    if(isGlucose){
      const cat = glucoseCategory(r.value);
      return `<div class="accordion-item" data-action="reading" data-kind="glucose" data-id="${r.id}">
        <div class="accordion-item-main">
          <div class="accordion-item-title">${r.value.toFixed(1)} ${GLUCOSE_UNIT}</div>
          <div class="accordion-item-sub">${esc(r.context||'')} · ${fmtTimeOnly(r.takenAt)} · ${esc(r.takenBy||'')}</div>
        </div>
        <span class="vital-chip ${cat.cls}">${cat.label}</span>
      </div>`;
    } else {
      const cat = bpCategory(r.systolic, r.diastolic);
      return `<div class="accordion-item" data-action="reading" data-kind="pressure" data-id="${r.id}">
        <div class="accordion-item-main">
          <div class="accordion-item-title">${r.systolic}/${r.diastolic} mmHg</div>
          <div class="accordion-item-sub">${r.pulse?esc(r.pulse)+' bpm · ':''}${fmtTimeOnly(r.takenAt)} · ${esc(r.takenBy||'')}</div>
        </div>
        <span class="vital-chip ${cat.cls}">${cat.label}</span>
      </div>`;
    }
  });

  html += `</div>`;
  main.innerHTML = html;
}

/* ---------------- Click delegation ---------------- */
document.getElementById('mainContent').addEventListener('click', (e)=>{
  const doseCard = e.target.closest('[data-action="dose"]');
  if(doseCard){ openDoseConfirm(doseCard.dataset.med, doseCard.dataset.sched, doseCard.dataset.date); return; }
  const medRow = e.target.closest('[data-action="edit-med"]');
  if(medRow){ openMedForm(medRow.dataset.med); return; }
  const stockRow = e.target.closest('[data-action="stock"]');

  const readingRow = e.target.closest('[data-action="reading"]');

    const kind = readingRow.dataset.kind, id = readingRow.dataset.id;

  }

  if(careRow){ openCareForm(careEvents[careRow.dataset.id]); return; }
  const toggle = e.target.closest('[data-action="toggle-date"]');
  if(toggle){
    const tab = toggle.dataset.tab, date = toggle.dataset.date;

  }

/* ---------------- Duplicate medication detection & merge ---------------- */
function dupKey(med){ return (med.name||'').trim().toLowerCase() + '|' + (med.dosage||'').trim().toLowerCase(); }
function findDuplicateGroups(){
  const groups = {};
  Object.values(medications).forEach(med=>{
    const key = dupKey(med);
    if(!groups[key]) groups[key] = [];
    groups[key].push(med);
  });
  return Object.values(groups).filter(g=>g.length>1);
}
function findExistingByName(name, excludeId){
  const val = (name||'').trim().toLowerCase();
  if(!val) return null;
  return Object.values(medications).find(m => m.id!==excludeId && (m.name||'').trim().toLowerCase()===val) || null;
}
async function mergeDuplicateMeds(){
  const groups = findDuplicateGroups();
  if(groups.length === 0){ toast('No duplicate medications found'); return; }
  const extraCount = groups.reduce((a,g)=>a+g.length-1, 0);
  const ok = confirm(
    `Found ${groups.length} medicine${groups.length===1?'':'s'} listed as ${extraCount+groups.length} separate entries. ` +
    `Merge each into a single medication with all its times combined? ` +
    `Past dose records tied to the removed duplicate entries will no longer show in Today's history. This cannot be undone.`
  );
  if(!ok) return;

  const newMeds = Object.assign({}, medications);
  groups.forEach(group=>{
    const base = group[0];
    const mergedSchedule = [];
    const seenTimes = new Set();
    group.forEach(med=>{
      (med.schedule||[]).forEach(s=>{
        const k = s.time + '|' + s.label;
        if(!seenTimes.has(k)){ seenTimes.add(k); mergedSchedule.push({id: s.id || uid(), time:s.time, label:s.label}); }
      });
    });
    mergedSchedule.sort((a,b)=>a.time.localeCompare(b.time));
    const insulin = group.some(m=>m.insulin);
    const notesSet = new Set(group.map(m=>(m.notes||'').trim()).filter(Boolean));
    group.forEach(m=>{ delete newMeds[m.id]; });
    newMeds[base.id] = Object.assign({}, base, { schedule: mergedSchedule, insulin, notes: Array.from(notesSet).join(' | ') });
  });

  const err = await runWrite(Store.replaceMedications(newMeds), 'mergeDuplicateMeds');
  if(err) return;
  toast(`Merged into ${groups.length} medication${groups.length===1?'':'s'}`);
  closeAllOverlays();
}

      <div class="field"><label>Pulse (optional)</label><input type="number" id="bpPulseInput" value="${existing&&existing.pulse?existing.pulse:''}" placeholder="e.g. 74" inputmode="numeric"></div>
      <div class="field"><label>When</label><input type="datetime-local" id="bpWhenInput" value="${existing?isoToLocalInputValue(existing.takenAt):nowLocalInputValue()}"></div>
      <div class="field"><label>Logged by</label><input type="text" id="bpByInput" value="${existing?esc(existing.takenBy):esc(currentCaregiver)}" placeholder="Your name"></div>
      ${existing ? `<button class="btn btn-danger" id="deleteBPBtn" style="margin-top:8px;">Delete this reading</button>` : ''}
    </div>
    <div class="sheet-footer">
      <button class="btn btn-primary" id="saveBPBtn">${existing?'Save changes':'Save reading'}</button>
      <button class="btn btn-ghost" id="cancelBPForm">Cancel</button>
    </div>
  `;
  document.getElementById('saveBPBtn').addEventListener('click', saveBP);
  document.getElementById('cancelBPForm').addEventListener('click', closeAllOverlays);
  if(existing){ document.getElementById('deleteBPBtn').addEventListener('click', deleteBPReading); }
  openOverlay('overlayPressureForm');
}
async function saveBP(){
  const sysRaw = document.getElementById('bpSysInput').value;
  const diaRaw = document.getElementById('bpDiaInput').value;
  const pulseRaw = document.getElementById('bpPulseInput').value;
  const whenLocal = document.getElementById('bpWhenInput').value;
  const by = document.getElementById('bpByInput').value.trim();
  const systolic = Number(sysRaw), diastolic = Number(diaRaw);
  if(!sysRaw || !diaRaw || isNaN(systolic) || isNaN(diastolic) || systolic<=0 || diastolic<=0){ toast('Enter valid systolic and diastolic numbers'); return; }
  if(!by){ toast('Enter who is logging this'); return; }
  if(!whenLocal){ toast('Pick a date and time'); return; }
  if(by !== currentCaregiver){ currentCaregiver = by; lsSet(LS_NAME_KEY, by); updateCaregiverPill(); }
  const takenAtDate = new Date(whenLocal);
  const pulse = pulseRaw ? Number(pulseRaw) : null;
  const btn = document.getElementById('saveBPBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const id = editingBPId || ('bp_'+uid());
  const wasEditing = !!editingBPId;
  const err = await runWrite(Store.saveBP(id, {systolic, diastolic, pulse, takenAt: takenAtDate.toISOString(), date: todayStr(takenAtDate), takenBy: by}), 'saveBP');
  if(err){ btn.disabled=false; btn.textContent = wasEditing?'Save changes':'Save reading'; return; }
  closeAllOverlays();
  toast(wasEditing ? 'Blood pressure reading updated' : 'Blood pressure reading saved');
}
async function deleteBPReading(){
  if(!confirm('Delete this blood pressure reading? This cannot be undone.')) return;
  const btn = document.getElementById('deleteBPBtn');
  btn.disabled = true; btn.textContent = 'Deleting…';
  const err = await runWrite(Store.deleteBP(editingBPId), 'deleteBP');
  if(err){ btn.disabled=false; btn.textContent='Delete this reading'; return; }
  closeAllOverlays();
  toast('Blood pressure reading deleted');
}

/* ---------------- Care reminder add/edit sheet (next dressing date, checkups, etc.) ---------------- */

  editingCareEventId = existing ? existing.id : null;
  const sheet = document.getElementById('sheetCareForm');
  sheet.innerHTML = `
    <div class="sheet-scroll">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title">${existing?'Edit care reminder':'Add a care reminder'}</h3>
      <p class="sheet-desc">Track the next dressing change, checkup, or any other appointment date.</p>
      <div class="field"><label>What</label>
        <input type="text" id="careLabelInput" list="carePresets" value="${existing?esc(existing.label):''}" placeholder="e.g. Dressing change">
        <datalist id="carePresets">${CARE_TYPE_PRESETS.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
      </div>
      <div class="field"><label>Next date</label><input type="date" id="careDateInput" value="${existing?existing.nextDate:todayStr()}"></div>
      <div class="field"><label>Repeats every (days, optional)</label><input type="number" id="careRepeatInput" value="${existing&&existing.repeatDays?existing.repeatDays:''}" placeholder="Leave blank for one-time" inputmode="numeric"></div>
      <div class="field"><label>Notes (optional)</label><textarea id="careNotesInput" placeholder="e.g. Left forearm, use gauze from the blue box">${existing?esc(existing.notes||''):''}</textarea></div>
      ${existing ? `<button class="btn btn-primary" id="careMarkDoneBtn" style="background:var(--green);">Mark done${existing.repeatDays?' & reschedule':''}</button>` : ''}
      ${existing ? `<button class="btn btn-danger" id="deleteCareBtn">Delete this reminder</button>` : ''}
    </div>
    <div class="sheet-footer">
      <button class="btn btn-primary" id="saveCareBtn">${existing?'Save changes':'Save reminder'}</button>

    </div>
  `;

    document.getElementById('deleteCareBtn').addEventListener('click', deleteCareEventForm);
    document.getElementById('careMarkDoneBtn').addEventListener('click', markCareEventDoneForm);
  }

}
async function saveCareEventForm(){
  const label = document.getElementById('careLabelInput').value.trim();
  const nextDate = document.getElementById('careDateInput').value;
  const repeatRaw = document.getElementById('careRepeatInput').value;
  const notes = document.getElementById('careNotesInput').value.trim();
  if(!label){ toast('Enter what this reminder is for'); return; }
  if(!nextDate){ toast('Pick the next date'); return; }
  const repeatDays = repeatRaw ? Number(repeatRaw) : null;
  if(repeatRaw && (isNaN(repeatDays) || repeatDays<=0)){ toast('Repeat interval must be a positive number of days'); return; }
  const btn = document.getElementById('saveCareBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const id = editingCareEventId || ('c_'+uid());
  const wasEditing = !!editingCareEventId;
  const existing = wasEditing ? careEvents[id] : null;
  const err = await runWrite(Store.saveCareEvent(id, { label, nextDate, repeatDays, notes, lastDone: existing?existing.lastDone:null }), 'saveCareEvent');
  if(err){ btn.disabled=false; btn.textContent = wasEditing?'Save changes':'Save reminder'; return; }
  closeAllOverlays();
  toast(wasEditing ? 'Care reminder updated' : 'Care reminder added');
}
async function deleteCareEventForm(){
  if(!confirm('Delete this care reminder? This cannot be undone.')) return;
  const btn = document.getElementById('deleteCareBtn');
  btn.disabled = true; btn.textContent = 'Deleting…';
  const err = await runWrite(Store.deleteCareEvent(editingCareEventId), 'deleteCareEvent');
  if(err){ btn.disabled=false; btn.textContent='Delete this reminder'; return; }
  closeAllOverlays();
  toast('Care reminder deleted');
}
async function markCareEventDoneForm(){
  const btn = document.getElementById('careMarkDoneBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const err = await runWrite(Store.markCareEventDone(editingCareEventId), 'markCareEventDone');
  if(err){ btn.disabled=false; btn.textContent='Mark done'; return; }

  toast('Marked done');
}

/* ---------------- Settings sheet ---------------- */
function openSettings(){
  const sheet = document.getElementById('sheetSettings');
  const medCount = Object.keys(medications).length;
  const readingCount = Object.keys(glucoseReadings).length + Object.keys(bpReadings).length;
  const syncedLabel = lastSyncedAt ? lastSyncedAt.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'}) : 'never yet';
  const dupGroups = findDuplicateGroups();
  sheet.innerHTML = `
    <div class="sheet-scroll">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title">Settings</h3>
      <div class="settings-note">Synced via JSONBin — ${medCount} medication${medCount===1?'':'s'} and ${readingCount} vitals reading${readingCount===1?'':'s'}. Last successful sync: <strong>${syncedLabel}</strong>. Everyone who opens this app connects to the same bin, updating by polling every 20 seconds (or the sync button) rather than instantly. Your name is remembered per-device, not shared.</div>
      <button class="btn btn-ghost" id="forceSyncBtn" style="margin-bottom:14px;">Force sync now</button>
    </div>
    <div class="sheet-footer">
      <button class="btn btn-ghost" id="changeNameBtn">Change my name</button>
      ${dupGroups.length>0 ? `<button class="btn btn-ghost" id="mergeDupBtn" style="color:var(--amber);">Merge ${dupGroups.length} duplicate medication${dupGroups.length===1?'':'s'}</button>` : ''}
      <button class="btn btn-ghost" id="summaryBtn">Copy summary for doctor</button>
      <button class="btn btn-danger" id="clearAllBtn">Clear all info</button>
      <button class="btn btn-ghost" id="closeSettingsBtn">Close</button>
    </div>
  `;
  document.getElementById('changeNameBtn').addEventListener('click', ()=>{ closeAllOverlays(); setTimeout(()=>openNameSheet(),150); });
  if(dupGroups.length>0){
    document.getElementById('mergeDupBtn').addEventListener('click', mergeDuplicateMeds);
  }
  document.getElementById('forceSyncBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('forceSyncBtn');
    btn.disabled = true; btn.textContent = 'Syncing…';
    await syncNow(false);
    btn.disabled = false; btn.textContent = 'Force sync now';
    toast('Sync complete');
    closeAllOverlays();
    setTimeout(()=>openSettings(), 150);
  });
  document.getElementById('summaryBtn').addEventListener('click', ()=>{ closeAllOverlays(); setTimeout(()=>openSummarySheet(),150); });
  document.getElementById('clearAllBtn').addEventListener('click', async ()=>{
    if(!confirm('Permanently delete every medication, dose record, and vitals reading for everyone using this bin? This cannot be undone.')) return;
    const btn = document.getElementById('clearAllBtn');
    btn.disabled = true; btn.textContent = 'Clearing…';
    try{
      await Store.clearAll();
      closeAllOverlays();
      toast('All info cleared');
    }catch(e){
      console.error('clearAll failed:', e);
      toast(friendlyError(e));
      showConnBanner(friendlyError(e));
      btn.disabled = false; btn.textContent = 'Clear all info';
    }
  });
  document.getElementById('closeSettingsBtn').addEventListener('click', closeAllOverlays);
  openOverlay('overlaySettings');
}
document.getElementById('settingsBtn').addEventListener('click', openSettings);

/* ---------------- Doctor summary export ---------------- */
function buildDoctorSummaryText(){
  const lines = [];
  lines.push("Mom's Care — Summary");
  lines.push('Generated ' + new Date().toLocaleString());
  lines.push('');
  lines.push('MEDICATIONS');
  const meds = Object.values(medications).sort((a,b)=>a.name.localeCompare(b.name));
  if(meds.length===0) lines.push('  (none listed)');
  meds.forEach(m=>{
    const times = (m.schedule||[]).map(s=>fmtTime(s.time)+' ('+s.label+')').join(', ');
    lines.push('  - ' + m.name + (m.dosage? ' — '+m.dosage : '') + (m.insulin?' [INSULIN]':'') + '\\n    Times: ' + times + (m.notes? '\\n    Notes: '+m.notes : ''));
  });
  lines.push('');

  lines.push('CARE REMINDERS — dressing changes, checkups & more');
  const careList = Object.values(careEvents).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));
  if(careList.length===0) lines.push('  (none listed)');
  careList.forEach(ev=>{
    const days = careDaysUntil(ev.nextDate);
    const when = days<0 ? `OVERDUE (was due ${ev.nextDate})` : days===0 ? 'due today' : `due ${ev.nextDate}`;
    lines.push('  - ' + ev.label + ' — ' + when + (ev.repeatDays?` (repeats every ${ev.repeatDays}d)`:'') + (ev.notes?'\\n    Notes: '+ev.notes:''));
  });
  lines.push('');

  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-7);
  lines.push('GLUCOSE — last 7 days');
  const gWeek = Object.values(glucoseReadings).filter(r=> new Date(r.takenAt) >= cutoff).sort((a,b)=>a.takenAt.localeCompare(b.takenAt));
  if(gWeek.length===0) lines.push('  (no readings)');
  else{
    const avg = gWeek.reduce((a,r)=>a+r.value,0)/gWeek.length;
    const min = Math.min(...gWeek.map(r=>r.value));
    const max = Math.max(...gWeek.map(r=>r.value));
    lines.push(`  ${gWeek.length} readings — avg ${avg.toFixed(1)}, range ${min.toFixed(1)}–${max.toFixed(1)} ${GLUCOSE_UNIT}`);
    gWeek.forEach(r=> lines.push(`  - ${fmtDateTime(r.takenAt)}: ${r.value.toFixed(1)} ${GLUCOSE_UNIT} (${r.context})`));
  }
  lines.push('');

  lines.push('BLOOD PRESSURE — last 7 days');
  const bWeek = Object.values(bpReadings).filter(r=> new Date(r.takenAt) >= cutoff).sort((a,b)=>a.takenAt.localeCompare(b.takenAt));
  if(bWeek.length===0) lines.push('  (no readings)');
  else{
    const avgSys = bWeek.reduce((a,r)=>a+r.systolic,0)/bWeek.length;
    const avgDia = bWeek.reduce((a,r)=>a+r.diastolic,0)/bWeek.length;
    lines.push(`  ${bWeek.length} readings — avg ${Math.round(avgSys)}/${Math.round(avgDia)} mmHg`);
    bWeek.forEach(r=> lines.push(`  - ${fmtDateTime(r.takenAt)}: ${r.systolic}/${r.diastolic} mmHg${r.pulse?' · '+r.pulse+' bpm':''}`));
  }
  return lines.join('\n').replace(/\\n/g, '\n');
}
function openSummarySheet(){
  const text = buildDoctorSummaryText();
  const sheet = document.getElementById('sheetSummary');
  sheet.innerHTML = `
    <div class="sheet-scroll">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title">Summary for the doctor</h3>
      <p class="sheet-desc">Tap Copy, or select the text below manually if copy doesn't work on this device.</p>
      <div class="field"><textarea id="summaryText" readonly rows="14">${esc(text)}</textarea></div>
    </div>
    <div class="sheet-footer">
      <button class="btn btn-primary" id="copySummaryBtn">Copy to clipboard</button>
      <button class="btn btn-ghost" id="closeSummaryBtn">Close</button>
    </div>
  `;
  document.getElementById('copySummaryBtn').addEventListener('click', async ()=>{
    const ta = document.getElementById('summaryText');
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(text);
      } else {
        ta.removeAttribute('readonly');
        ta.select();
        document.execCommand('copy');
        ta.setAttribute('readonly','');
      }
      toast('Copied — paste it anywhere');
    }catch(e){
      ta.removeAttribute('readonly');
      ta.focus(); ta.select();
      toast('Could not auto-copy — text is selected, use your device copy option');
    }
  });
  document.getElementById('closeSummaryBtn').addEventListener('click', closeAllOverlays);
  openOverlay('overlaySummary');
}

/* ---------------- Overlay helpers ---------------- */
function openOverlay(id){ closeAllOverlays(); document.getElementById(id).classList.add('open'); }
function closeAllOverlays(){ document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('open')); }
document.querySelectorAll('.overlay').forEach(o=>{ o.addEventListener('click', e=>{ if(e.target === o) closeAllOverlays(); }); });

document.getElementById('fabAdd').addEventListener('click', ()=>{
  if(activeTab === 'glucose') openGlucoseForm(null);
  else if(activeTab === 'pressure') openPressureForm(null);
  else if(activeTab === 'care') openCareForm(null);
  else openMedForm(null);
});

setInterval(()=>{ if(activeTab==='today') render(); }, 60000);

updateFabForTab();
boot();
})();
