<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Mom's Care — Meds &amp; Vitals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-alt:#EDF2F0;
  --ink:#182422; --ink-soft:#59706C; --ink-faint:#8B9F9B; --line:#DFE7E4;
  --teal:#0E625B; --teal-deep:#083E3A; --teal-tint:#E2EEEC;
  --amber:#B8791E; --amber-tint:#FBEDD9;
  --red:#B8443B; --red-tint:#F9E1DE;
  --green:#2F7A51; --green-tint:#E1F0E6;
  --insulin:#63499A; --insulin-tint:#EBE5F5;
  --blue:#2A6CA8; --blue-tint:#E4EFF9;
  --radius:18px; --radius-sm:14px;
  --shadow-sm:0 1px 3px rgba(15,36,33,0.05);
  --shadow-md:0 8px 24px rgba(12,40,37,0.09);
  --shadow-lg:0 20px 48px rgba(7,28,26,0.20);
  --ease:cubic-bezier(.22,1,.36,1); --ease-soft:cubic-bezier(.4,0,.2,1);
  --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0; height:100%; overscroll-behavior-y:none;}
body{background:var(--bg); font-family:var(--font-body); color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh; min-height:100dvh; overscroll-behavior-y:none;}
#appShell{max-width:480px; margin:0 auto; height:100vh; height:100dvh; background:var(--bg); position:relative; display:flex; flex-direction:column; box-shadow:var(--shadow-lg); overflow:hidden; overscroll-behavior-y:contain;}
@media(min-width:520px){ body{padding:26px 0;} #appShell{height:calc(100dvh - 52px); border-radius:26px;} }
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

header.appbar{
  position:sticky; top:0; z-index:20;
  background:
    radial-gradient(120% 180% at 100% -30%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 55%),
    linear-gradient(155deg, #128C81 0%, var(--teal) 38%, var(--teal-deep) 100%);
  color:#fff; padding:calc(14px + env(safe-area-inset-top)) 18px 12px; display:flex; flex-direction:column; gap:9px;
  box-shadow:0 1px 0 rgba(255,255,255,0.06) inset, 0 12px 28px -14px rgba(4,20,18,0.55);
}
.brand-mark{font-family:var(--font-display); font-weight:600; font-size:19.5px; letter-spacing:0.25px;}
.appbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.brand{display:flex; align-items:baseline; gap:8px;}
.status-pill{display:flex; align-items:center; gap:6px; font-size:10px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.05em; color:#CFE9E4; background:rgba(255,255,255,0.09); -webkit-backdrop-filter:blur(16px) saturate(180%); backdrop-filter:blur(16px) saturate(180%); padding:4px 9px; border-radius:20px; border:1px solid rgba(255,255,255,0.16); cursor:default; transition:background .25s var(--ease-soft); box-shadow:0 1px 0 rgba(255,255,255,0.1) inset, 0 4px 10px -4px rgba(4,20,18,0.35);}
.status-dot{width:6px;height:6px;border-radius:50%; background:#F0C46B; box-shadow:0 0 0 3px rgba(240,196,107,0.22); transition:background .25s var(--ease-soft), box-shadow .25s var(--ease-soft); flex-shrink:0;}
.status-dot.live{background:#5FD6A8; box-shadow:0 0 0 3px rgba(95,214,168,0.22);}
.status-dot.off{background:#E88A7D; box-shadow:0 0 0 3px rgba(232,138,125,0.22);}
.caregiver-pill{display:flex; align-items:center; gap:7px; background:rgba(255,255,255,0.11); -webkit-backdrop-filter:blur(16px) saturate(180%); backdrop-filter:blur(16px) saturate(180%); border:1px solid rgba(255,255,255,0.18); padding:5px 11px 5px 5px; border-radius:20px; font-size:12.5px; font-weight:600; cursor:pointer; transition:background .2s var(--ease-soft), transform .15s var(--ease), box-shadow .2s var(--ease-soft); box-shadow:0 1px 0 rgba(255,255,255,0.08) inset, 0 6px 14px -6px rgba(4,20,18,0.4);}
.caregiver-pill:active{background:rgba(255,255,255,0.2); transform:scale(0.97); box-shadow:0 1px 0 rgba(255,255,255,0.08) inset, 0 2px 6px -2px rgba(4,20,18,0.4);}
.caregiver-pill .avatar{width:20px;height:20px;border-radius:50%;background:#5FD6A8;color:#0A4A45; font-size:9.5px; font-weight:700; display:flex;align-items:center;justify-content:center; font-family:var(--font-mono);}
.icon-btn{background:rgba(255,255,255,0.11); -webkit-backdrop-filter:blur(16px) saturate(180%); backdrop-filter:blur(16px) saturate(180%); border:1px solid rgba(255,255,255,0.18); width:32px;height:32px;border-radius:11px; color:#fff; display:flex;align-items:center;justify-content:center; cursor:pointer; transition:background .2s var(--ease-soft), transform .15s var(--ease), box-shadow .2s var(--ease-soft); box-shadow:0 1px 0 rgba(255,255,255,0.08) inset, 0 6px 14px -6px rgba(4,20,18,0.4);}
.icon-btn:active{background:rgba(255,255,255,0.22); transform:scale(0.92); box-shadow:0 1px 0 rgba(255,255,255,0.08) inset;}
.icon-btn svg{width:15px;height:15px;}
.icon-btn.spinning svg{animation:spin 0.8s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}
.date-line{font-size:12.5px; color:#BFE0DA; font-weight:500;}

nav.tabs{display:flex; gap:1px; padding:8px 6px 0; background:rgba(243,246,245,0.75); -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%); border-bottom:1px solid var(--line); position:relative; z-index:19;}
nav.tabs button{position:relative; flex:1; border:none; background:transparent; padding:9px 1px 10px; font-family:var(--font-body); font-weight:700; font-size:10.5px; color:var(--ink-faint); cursor:pointer; border-bottom:2px solid transparent; transition:color .25s var(--ease-soft), transform .2s var(--ease); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
nav.tabs button.active{color:var(--teal-deep);}
nav.tabs button:active{transform:scale(0.95);}
.tab-indicator{position:absolute; bottom:-1px; height:2px; background:var(--teal); border-radius:2px 2px 0 0; transition:transform .32s var(--ease), width .32s var(--ease); will-change:transform, width;}
.tab-dot{position:absolute; top:5px; right:calc(50% - 20px); width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 0 2px var(--bg);}

.conn-banner{display:flex; align-items:center; gap:10px; background:var(--red-tint); color:var(--red); padding:10px 16px; font-size:12px; line-height:1.4; border-bottom:1px solid #E7B4AD;}
.conn-banner svg{width:15px;height:15px; flex-shrink:0;}
.conn-banner span{flex:1;}
.conn-banner button{background:var(--red); color:#fff; border:none; padding:6px 10px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; flex-shrink:0;}

main{flex:1; min-height:0; padding:14px 16px calc(100px + env(safe-area-inset-bottom)); overflow-y:auto; -webkit-overflow-scrolling:touch;}
#mainContent{position:relative;}
.tab-switching-out{animation:tabOut .16s var(--ease-soft) both;}
.tab-switching-in{animation:tabIn .38s var(--ease) both;}
@keyframes tabOut{from{opacity:1; transform:scale(1) translateY(0);} to{opacity:0; transform:scale(0.97) translateY(6px);}}
@keyframes tabIn{from{opacity:0; transform:scale(0.97) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);}}
.view-fade{animation:fadeIn .32s var(--ease);}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.view-fade > *{animation:itemRise .38s var(--ease) both;}
.view-fade > *:nth-child(1){animation-delay:.01s;}
.view-fade > *:nth-child(2){animation-delay:.035s;}
.view-fade > *:nth-child(3){animation-delay:.06s;}
.view-fade > *:nth-child(4){animation-delay:.085s;}
.view-fade > *:nth-child(5){animation-delay:.11s;}
.view-fade > *:nth-child(6){animation-delay:.135s;}
.view-fade > *:nth-child(7){animation-delay:.16s;}
.view-fade > *:nth-child(8){animation-delay:.185s;}
.view-fade > *:nth-child(n+9){animation-delay:.2s;}
@keyframes itemRise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.section-title{font-family:var(--font-body); font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.09em; font-size:11px; margin:20px 3px 9px; display:flex; align-items:center; gap:6px;}
.section-title::before{content:''; width:3px; height:11px; border-radius:2px; background:var(--teal); opacity:0.55;}
.section-title:first-child{margin-top:2px;}
.period-title{font-family:var(--font-display); font-weight:700; font-size:18px; text-transform:none; letter-spacing:0.1px; color:var(--ink); margin:26px 2px 12px; gap:10px;}
.period-title::before{display:none;}
.period-title:first-child{margin-top:4px;}
.period-badge{width:30px; height:30px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 4px 10px -3px rgba(8,30,28,0.35), 0 1px 0 rgba(255,255,255,0.45) inset;}
.period-badge svg{width:16px; height:16px;}
.period-morning .period-badge{background:linear-gradient(145deg,#FFE1A0,#F0A93E); color:#7A4B0B;}
.period-afternoon .period-badge{background:linear-gradient(145deg,#9FE8DE,#12897C); color:#053B36;}
.period-evening .period-badge{background:linear-gradient(145deg,#FFBBA0,#E8663F); color:#5C1F0D;}
.period-night .period-badge{background:linear-gradient(145deg,#C3B2EE,#63499A); color:#F3EFFB;}
.period-custom .period-badge{background:linear-gradient(145deg,#DCE5E1,#9BB0AB); color:#233230;}
.section-hint{font-size:11px; color:var(--ink-faint); margin:-5px 3px 10px;}

.progress-hero{background:var(--surface); border:1px solid rgba(15,36,33,0.06); border-radius:var(--radius); padding:15px 16px; box-shadow:var(--shadow-sm), 0 1px 0 rgba(255,255,255,0.6) inset;}
.progress-top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:9px;}
.progress-label{font-family:var(--font-display); font-weight:600; font-size:15px; color:var(--ink);}
.progress-count{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);}
.progress-track{height:7px; background:var(--surface-alt); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--teal), #189384); border-radius:6px; transition:width .5s var(--ease);}
.progress-note{font-size:11.5px; color:var(--ink-faint); margin-top:8px;}
.progress-note.attn{color:var(--red); font-weight:600;}

.vital-hero{background:var(--surface); border:1px solid rgba(15,36,33,0.06); border-radius:var(--radius); padding:16px 17px; box-shadow:var(--shadow-md), 0 1px 0 rgba(255,255,255,0.7) inset;}
.vital-hero-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
.vital-big{font-family:var(--font-display); font-weight:600; font-size:34px; color:var(--ink); line-height:1;}
.vital-big small{font-family:var(--font-body); font-weight:600; font-size:13px; color:var(--ink-soft); margin-left:4px;}
.vital-sub{font-size:12px; color:var(--ink-soft); margin-top:4px; font-family:var(--font-mono);}
.vital-chip{font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap; display:inline-flex; align-items:center;}
.vital-chip svg{width:11px; height:11px; stroke:currentColor;}
.done-card{opacity:0.72;}
.done-card .stock-name{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--ink-faint); text-decoration-thickness:1.5px;}
.chip-normal{background:var(--green-tint); color:var(--green);}
.chip-elevated{background:var(--amber-tint); color:var(--amber);}
.chip-high{background:var(--red-tint); color:var(--red);}
.chip-low{background:var(--blue-tint); color:var(--blue);}
.vital-trend{margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
.vital-trend svg{width:13px;height:13px;}
.vital-trend.up svg{color:var(--amber);} .vital-trend.down svg{color:var(--blue);} .vital-trend.flat svg{color:var(--ink-faint);}
.vital-stat{font-size:11.5px; color:var(--ink-faint); margin-top:5px;}
.chart-card{background:var(--surface); border:1px solid rgba(15,36,33,0.06); border-radius:var(--radius); padding:16px 14px 12px; box-shadow:var(--shadow-md), 0 1px 0 rgba(255,255,255,0.7) inset; margin-top:12px;}
.chart-legend{display:flex; gap:14px; padding:0 4px 10px; font-size:11.5px; font-weight:600; color:var(--ink-soft);}
.chart-legend span{display:flex; align-items:center; gap:6px;}
.chart-legend i{width:10px;height:10px;border-radius:50%; display:inline-block; box-shadow:0 0 0 3px rgba(0,0,0,0.04);}
.chart-line-draw{stroke-dasharray:600; stroke-dashoffset:600; animation:drawLine 1s var(--ease) forwards;}
@keyframes drawLine{to{stroke-dashoffset:0;}}
.vitals-note{font-size:10.5px; color:var(--ink-faint); line-height:1.5; margin-top:10px; padding:0 2px;}

.reading-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 13px; margin-bottom:8px; cursor:pointer; transition:transform .18s var(--ease), box-shadow .18s var(--ease-soft); box-shadow:var(--shadow-sm);}

/* stock tab */
.stock-alert{background:var(--red-tint); border:1px solid #E7B4AD; border-radius:var(--radius); padding:14px 15px; margin-bottom:16px; display:flex; gap:10px; align-items:flex-start;}
.stock-alert svg{width:18px;height:18px; color:var(--red); flex-shrink:0; margin-top:1px;}
.stock-alert-title{font-weight:700; font-size:13.5px; color:var(--red);}
.stock-alert-list{font-size:12px; color:#9A3B32; margin-top:3px; line-height:1.5;}
.stock-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:13px; margin-bottom:10px; cursor:pointer; transition:transform .18s var(--ease), box-shadow .18s var(--ease-soft); box-shadow:var(--shadow-sm);}
.stock-card:active{transform:scale(0.98); box-shadow:var(--shadow-sm);}
.stock-card.low{border-color:#E7B4AD; background:var(--red-tint);}
.stock-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:9px;}
.stock-name{font-weight:700; font-size:14.5px;}
.care-pending-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--teal); margin-right:6px; vertical-align:2px; box-shadow:0 0 0 3px var(--teal-tint);}
.stock-qty{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.stock-track{height:8px; background:var(--surface-alt); border-radius:6px; overflow:hidden; margin-bottom:7px;}
.stock-fill{height:100%; border-radius:6px; transition:width .5s var(--ease); background:var(--green);}
.stock-fill.warn{background:var(--amber);}
.stock-fill.danger{background:var(--red);}
.stock-days{font-size:11.5px; color:var(--ink-faint);}
.stock-days.low{color:var(--red); font-weight:700;}
.reading-row:active{transform:scale(0.98);}
.reading-row-main{flex:1; min-width:0;}
.reading-row-value{font-weight:700; font-size:15px; font-family:var(--font-mono);}
.reading-row-sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

/* accordion (date-grouped history, tap-to-expand) */
.accordion-row{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:9px; overflow:hidden; box-shadow:var(--shadow-sm);}
.accordion-header{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 13px; cursor:pointer;}
.accordion-header:active{background:var(--surface-alt);}
.accordion-date{font-weight:700; font-size:13.5px; flex-shrink:0;}
.accordion-summary{font-size:11.5px; color:var(--ink-soft); font-family:var(--font-mono); text-align:right; flex:1;}
.accordion-chevron{color:var(--ink-faint); flex-shrink:0; transition:transform .22s var(--ease);}
.accordion-chevron svg{width:14px;height:14px; display:block;}
.accordion-chevron.open{transform:rotate(90deg);}
.accordion-body{padding:2px 13px 12px; border-top:1px solid var(--line);}
.accordion-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); cursor:pointer;}
.accordion-item:last-child{border-bottom:none;}
.accordion-item-main{flex:1; min-width:0;}
.accordion-item-title{font-weight:600; font-size:13px;}
.accordion-item-sub{font-size:11px; color:var(--ink-soft); margin-top:1px; font-family:var(--font-mono);}
.history-icon{width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.history-icon svg{width:14px; height:14px;}
.history-icon.dose{background:var(--teal-tint); color:var(--teal-deep);}
.history-icon.glucose{background:var(--insulin-tint); color:var(--insulin);}
.history-icon.pressure{background:var(--blue-tint); color:var(--blue);}
.history-icon.care{background:var(--green-tint); color:var(--green);}
.vital-chip.tiny{font-size:9px; padding:1px 6px; margin-left:4px; vertical-align:1px;}

.timeline{position:relative; padding-left:26px;}
.timeline::before{content:''; position:absolute; left:9px; top:4px; bottom:4px; width:2px; background:var(--line);}
.dose-node{position:relative; margin-bottom:12px;}
.dose-dot{position:absolute; left:-26px; top:14px; width:20px;height:20px; border-radius:50%; background:var(--surface); border:2px solid var(--ink-faint); z-index:2; display:flex; align-items:center; justify-content:center; transition:background .2s var(--ease-soft), border-color .2s var(--ease-soft);}
.dose-dot svg{width:11px;height:11px; opacity:0;}
.dose-node.given .dose-dot{background:var(--green); border-color:var(--green);}
.dose-node.given .dose-dot svg{opacity:1; stroke:#fff;}
.dose-node.overdue .dose-dot{border-color:var(--red); background:var(--red-tint);}
.dose-node.due .dose-dot{border-color:var(--amber); background:var(--amber-tint); animation:pulse 1.7s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,127,31,0.35);}50%{box-shadow:0 0 0 5px rgba(200,127,31,0);}}
.dose-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 13px; cursor:pointer; transition:border-color .2s var(--ease-soft), transform .18s var(--ease), box-shadow .18s var(--ease-soft); box-shadow:var(--shadow-sm);}
.dose-card:active{transform:scale(0.985); box-shadow:none;}
.dose-node.overdue .dose-card{border-color:#E7B4AD; background:var(--red-tint);}
.dose-node.due .dose-card{border-color:#EBC98C; background:var(--amber-tint);}
.dose-node.given .dose-card{background:var(--green-tint); border-color:#BFE0CB;}
.dose-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.dose-name-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.dose-name{font-weight:700; font-size:14.5px; color:var(--ink);}
.insulin-chip{font-size:9.5px; font-family:var(--font-mono); font-weight:600; letter-spacing:0.03em; background:var(--insulin-tint); color:var(--insulin); padding:2px 6px; border-radius:6px; display:flex; align-items:center; gap:3px; text-transform:uppercase;}
.insulin-chip svg{width:9px;height:9px;}
.dose-time{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); white-space:nowrap; font-weight:600;}
.dose-dosage{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.dose-meta{margin-top:7px; font-size:11.5px; font-family:var(--font-mono); display:flex; align-items:center; gap:5px;}
.dose-meta.given{color:var(--green);} .dose-meta.overdue{color:var(--red); font-weight:600;} .dose-meta.due{color:var(--amber); font-weight:600;} .dose-meta.upcoming{color:var(--ink-faint);}

.empty-state{text-align:center; padding:52px 24px; color:var(--ink-faint);}
.empty-state svg{width:38px;height:38px; opacity:0.5; margin-bottom:10px;}
.empty-state p{font-size:13px; margin:4px 0;}
.empty-state .cta{color:var(--teal); font-weight:700; cursor:pointer;}
.empty-mini{text-align:center; padding:16px; color:var(--ink-faint); font-size:12px;}

.med-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 13px; margin-bottom:10px; cursor:pointer; transition:transform .18s var(--ease), box-shadow .18s var(--ease-soft); box-shadow:var(--shadow-sm);}
.med-row:active{transform:scale(0.98);}
.med-row-swatch{width:38px;height:38px;border-radius:11px; background:var(--teal-tint); color:var(--teal-deep); display:flex;align-items:center;justify-content:center; font-family:var(--font-display); font-weight:600; font-size:16px; flex-shrink:0;}
.med-row.insulin .med-row-swatch{background:var(--insulin-tint); color:var(--insulin);}
.med-row-body{flex:1; min-width:0;}
.med-row-name{font-weight:700; font-size:14px;}
.med-row-sub{font-size:12px; color:var(--ink-soft); margin-top:1px;}
.med-row-chevron{color:var(--ink-faint); flex-shrink:0;}
.med-row-chevron svg{width:16px;height:16px;}

.fab{position:absolute; right:18px; bottom:calc(22px + env(safe-area-inset-bottom)); width:56px;height:56px; border-radius:50%; background:linear-gradient(150deg, #128C81, var(--teal-deep)); color:#fff; border:none; box-shadow:0 14px 30px -6px rgba(8,62,58,0.55), 0 1px 0 rgba(255,255,255,0.25) inset; display:flex;align-items:center;justify-content:center; cursor:pointer; z-index:15; transition:transform .18s var(--ease), box-shadow .18s var(--ease-soft);}
.fab:active{transform:scale(0.92);}
.fab svg{width:22px;height:22px;}

.overlay{position:absolute; inset:0; background:rgba(10,20,19,0.46); z-index:30; display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(2px); overscroll-behavior-y:contain;}
.overlay.open{display:flex; animation:overlayFade .24s var(--ease-soft);}
@keyframes overlayFade{from{background:rgba(10,20,19,0);} to{background:rgba(10,20,19,0.46);}}
.sheet{background:rgba(255,255,255,0.82); -webkit-backdrop-filter:blur(28px) saturate(180%); backdrop-filter:blur(28px) saturate(180%); width:100%; max-width:480px; border-radius:24px 24px 0 0; max-height:92vh; max-height:92dvh; overflow:hidden; display:flex; flex-direction:column; animation:slideUp .32s var(--ease); box-shadow:0 1px 0 rgba(255,255,255,0.9) inset, 0 -1px 0 rgba(255,255,255,0.5) inset, var(--shadow-lg); transition:transform .3s var(--ease); will-change:transform; overscroll-behavior-y:contain;}
.sheet.dragging{transition:none; touch-action:none;}
@keyframes slideUp{from{transform:translateY(36px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-scroll{flex:1; min-height:0; overflow-y:auto; padding:8px 20px 10px; -webkit-overflow-scrolling:touch;}
.sheet-footer{flex-shrink:0; padding:10px 20px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid rgba(223,231,228,0.7); background:rgba(255,255,255,0.5); -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);}
.sheet-footer .btn{margin-top:8px;}
.sheet-footer .btn:first-child{margin-top:0;}
.sheet-handle{width:38px;height:5px;background:var(--line); border-radius:4px; margin:8px auto 12px; cursor:grab; transition:background .15s var(--ease-soft), width .15s var(--ease-soft); touch-action:none;}
.sheet.dragging .sheet-handle{background:var(--ink-faint); width:44px;}
.sheet-scroll, .sheet-footer{touch-action:pan-y;}
.sheet-title{font-family:var(--font-display); font-size:18px; font-weight:600; margin:0 0 3px;}
.sheet-desc{font-size:12px; color:var(--ink-soft); margin:0 0 12px; line-height:1.45;}
.field{margin-bottom:11px;}
.field label{display:block; font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:5px;}
.field input[type=text], .field input[type=number], .field input[type=time], .field input[type=datetime-local], .field textarea, .field select{width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; font-family:var(--font-body); font-size:14.5px; background:var(--surface); color:var(--ink); transition:border-color .18s var(--ease-soft), outline-color .18s var(--ease-soft);}
.field textarea{resize:vertical; min-height:44px;}
.field textarea[readonly]{background:var(--surface-alt); font-family:var(--font-mono); font-size:12px;}
.field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:7px 0;}
.toggle-row .tlabel{font-size:14px; font-weight:700;}
.toggle-row .thint{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
.switch{position:relative; width:44px; height:26px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.switch .track{position:absolute; inset:0; background:var(--line); border-radius:20px; cursor:pointer; transition:background .2s var(--ease-soft);}
.switch .track::before{content:''; position:absolute; left:3px; top:3px; width:20px;height:20px; background:#fff; border-radius:50%; transition:transform .22s var(--ease); box-shadow:0 1px 2px rgba(0,0,0,0.2);}
.switch input:checked + .track{background:var(--insulin);}
.switch input:checked + .track::before{transform:translateX(18px);}

.schedule-list{display:flex; flex-direction:column; gap:6px; margin-bottom:8px;}
.schedule-row{display:flex; gap:8px; align-items:center; background:var(--surface-alt); padding:8px; border-radius:10px;}
.schedule-row select{flex:1.1; padding:9px 8px; border-radius:8px; border:1.5px solid var(--line); font-size:13px;}
.schedule-row input[type=time]{flex:1; padding:9px 8px; border-radius:8px; border:1.5px solid var(--line); font-size:13px; font-family:var(--font-mono);}
.schedule-row .rm{background:none; border:none; color:var(--red); cursor:pointer; padding:4px;}
.schedule-row .rm svg{width:16px;height:16px;}
.add-time-btn{display:flex; align-items:center; gap:6px; background:none; border:1.5px dashed var(--line); color:var(--teal); font-weight:700; font-size:13px; padding:9px; border-radius:10px; width:100%; cursor:pointer; justify-content:center;}
.add-time-btn svg{width:14px;height:14px;}

.btn{width:100%; padding:13px; border-radius:12px; border:none; font-weight:700; font-size:14.5px; cursor:pointer; font-family:var(--font-body); transition:transform .16s var(--ease), background .18s var(--ease-soft), opacity .2s var(--ease-soft); display:flex; align-items:center; justify-content:center; gap:7px;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:linear-gradient(150deg, #128C81, var(--teal-deep)); color:#fff; margin-top:6px; box-shadow:0 6px 16px -6px rgba(8,62,58,0.5);}
.btn-primary:active{background:var(--teal-deep);}
.btn-danger{background:var(--red-tint); color:var(--red); margin-top:8px;}
.btn-ghost{background:var(--surface-alt); color:var(--ink); margin-top:8px;}
.btn svg{width:17px; height:17px; flex-shrink:0;}
.btn-success{background:var(--green) !important; color:#fff; animation:btnPop .38s var(--ease);}
.btn-success svg{animation:checkDraw .38s var(--ease-soft) .05s both;}
@keyframes btnPop{0%{transform:scale(1);}40%{transform:scale(1.03);}100%{transform:scale(1);}}
@keyframes checkDraw{from{opacity:0; transform:scale(0.6) rotate(-8deg);} to{opacity:1; transform:scale(1) rotate(0deg);}}

/* ---------------- Medicine alarm ---------------- */
.overlay.alarm-lock{ z-index:60; align-items:center; }
.overlay.alarm-lock .sheet{ border-radius:22px; margin:0 16px; max-height:85vh; max-height:85dvh; animation:alarmPop .18s ease-out; }
@keyframes alarmPop{ from{transform:scale(0.94); opacity:0;} to{transform:scale(1); opacity:1;} }
.alarm-title{ color:var(--red); }
.alarm-item{ background:var(--red-tint); border:1px solid #E7B4AD; border-radius:var(--radius-sm); padding:13px; margin-bottom:10px; }
.alarm-item-name{ font-weight:700; font-size:15px; color:var(--ink); }
.alarm-item-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; margin-bottom:10px; font-family:var(--font-mono); }
.alarm-item-actions{ display:flex; gap:8px; }
.alarm-item-actions .btn{ margin-top:0; flex:1; padding:10px; font-size:13px; }
.field-error{ color:var(--red); font-size:12px; margin:-6px 0 11px; }
.btn:disabled{opacity:0.5; cursor:not-allowed;}

.history-list{margin-top:4px; border-top:1px solid var(--line); padding-top:10px;}
.history-item{display:flex; justify-content:space-between; font-size:12px; padding:6px 0; color:var(--ink-soft); font-family:var(--font-mono);}

.confirm-summary{background:var(--surface-alt); border-radius:12px; padding:14px; margin-bottom:14px;}
.confirm-summary .cname{font-family:var(--font-display); font-weight:600; font-size:17px;}
.confirm-summary .cmeta{font-size:12.5px; color:var(--ink-soft); margin-top:3px; font-family:var(--font-mono);}
.note-callout{background:var(--amber-tint); color:#8A5A16; border-radius:12px; padding:12px 13px; margin-bottom:14px; font-size:12.5px; line-height:1.5; display:flex; gap:9px; align-items:flex-start;}
.note-callout svg{width:15px;height:15px; flex-shrink:0; margin-top:1px;}
.given-by-box{background:var(--green-tint); border-radius:12px; padding:14px; margin-bottom:14px; text-align:center;}
.given-by-box .who{font-weight:700; font-size:15px; color:var(--green);}
.given-by-box .when{font-size:12px; font-family:var(--font-mono); color:var(--ink-soft); margin-top:2px;}

.settings-note{background:var(--surface-alt); border-radius:12px; padding:12px 13px; font-size:12px; color:var(--ink-soft); line-height:1.5; margin-bottom:14px;}

.toast{position:absolute; left:50%; bottom:calc(26px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(10px); background:var(--ink); color:#fff; padding:10px 16px; border-radius:12px; font-size:13px; opacity:0; transition:opacity .28s var(--ease-soft), transform .28s var(--ease); z-index:60; pointer-events:none; max-width:86%; white-space:normal; line-height:1.4; text-align:center; box-shadow:var(--shadow-md);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.hidden{display:none !important;}
</style>
</head>
<body>
<div id="appShell">

  <div id="mainApp" style="display:flex; flex-direction:column; flex:1; min-height:0;">
    <header class="appbar">
      <div class="appbar-row">
        <div class="brand"><span class="brand-mark">Mom's Care</span></div>
        <div class="status-pill" title="Synced via JSONBin — polls every 20s, or tap the refresh button">
          <span class="status-dot" id="statusDot"></span><span id="statusText">Connecting</span>
        </div>
      </div>
      <div class="appbar-row">
        <div class="date-line" id="dateLine"></div>
        <div style="display:flex; gap:8px;">
          <div class="caregiver-pill" id="caregiverPill"><span class="avatar" id="caregiverAvatar">?</span><span id="caregiverNameLabel">Set name</span></div>
          <button class="icon-btn" id="syncBtn" title="Sync now">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          </button>
          <button class="icon-btn" id="settingsBtn" title="Settings">

          </button>
        </div>
      </div>
    </header>

    <nav class="tabs">
      <span class="tab-indicator" id="tabIndicator"></span>
      <button class="active" data-tab="today">Today</button>
      <button data-tab="manage">Meds</button>
      <button data-tab="glucose">Glucose</button>
      <button data-tab="pressure">BP</button>
      <button data-tab="stock">Stock<span class="tab-dot hidden" id="stockTabDot"></span></button>
      <button data-tab="care">Care<span class="tab-dot hidden" id="careTabDot"></span></button>
      <button data-tab="history">History</button>
    </nav>

    <div class="conn-banner hidden" id="connBanner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
      <span id="connBannerText"></span>
      <button id="connRetryBtn">Retry</button>
    </div>

    <main id="mainContent"></main>

    <button class="fab" id="fabAdd" title="Add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div class="overlay" id="overlayMedForm"><div class="sheet" id="sheetMedForm"></div></div>
  <div class="overlay" id="overlayDoseConfirm"><div class="sheet" id="sheetDoseConfirm"></div></div>
  <div class="overlay" id="overlayGlucoseForm"><div class="sheet" id="sheetGlucoseForm"></div></div>
  <div class="overlay" id="overlayPressureForm"><div class="sheet" id="sheetPressureForm"></div></div>
  <div class="overlay" id="overlayName"><div class="sheet" id="sheetName"></div></div>
  <div class="overlay" id="overlaySettings"><div class="sheet" id="sheetSettings"></div></div>
  <div class="overlay" id="overlaySummary"><div class="sheet" id="sheetSummary"></div></div>
  <div class="overlay" id="overlayStockForm"><div class="sheet" id="sheetStockForm"></div></div>
  <div class="overlay" id="overlayCareForm"><div class="sheet" id="sheetCareForm"></div></div>
  <div class="overlay" id="overlayClearPass"><div class="sheet" id="sheetClearPass"></div></div>

async function safeText(res){ try{ return await res.text(); }catch(e){ return ''; } }

/* Every request gets a real, enforced timeout via AbortController. This is
   the actual fix for "editing/deleting doesn't work": in some restricted
   browser contexts a fetch can hang indefinitely with no error and no

async function fetchWithTimeout(url, opts, timeoutMs){
  timeoutMs = timeoutMs || 10000;
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  try{
    return await fetch(url, Object.assign({}, opts, {signal: controller.signal}));
  }catch(e){
    if(e.name === 'AbortError'){
      throw new Error('Request timed out after ' + (timeoutMs/1000) + 's — the connection never completed. This can happen in restricted browser contexts.');
    }
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

    bpReadings: record.bpReadings || {},

    pushSubscriptions: record.pushSubscriptions || [],
    alarmNotifyLog: record.alarmNotifyLog || {}

}

async function mutateBin(mutatorFn){
  const latest = await fetchBin();
  mutatorFn(latest);
  await pushBin(latest);
  applyState(latest);
  safeRender();
  return latest;
}

const Store = {
  async init(){
    try{ const obj = await fetchBin(); applyState(obj); handleConnOk(); safeRender(); }
    catch(e){ console.error('init fetch failed:', e); handleConnError(e); }
    startPolling();
  },
  saveMed(id, data){ return mutateBin(s=>{ s.medications[id] = Object.assign({id}, data); }); },
  deleteMed(id){ return mutateBin(s=>{ delete s.medications[id]; }); },
  setLog(key, data){ return mutateBin(s=>{ s.doseLogs[key] = data; }); },
  deleteLog(key){ return mutateBin(s=>{ delete s.doseLogs[key]; }); },
  setLogAndDeductStock(key, data, medId, amount){
    return mutateBin(s=>{
      s.doseLogs[key] = data;
      const med = s.medications[medId];
      if(med && med.stock && med.stock.enabled){
        med.stock.qty = Math.max(0, (med.stock.qty||0) - (amount||0));
      }
    });
  },
  deleteLogAndRestoreStock(key, medId, amount){
    return mutateBin(s=>{
      delete s.doseLogs[key];
      const med = s.medications[medId];
      if(med && med.stock && med.stock.enabled){
        const cap = med.stock.initialQty || Infinity;
        med.stock.qty = Math.min(cap, (med.stock.qty||0) + (amount||0));
      }
    });
  },
  saveStock(medId, stockObj){
    return mutateBin(s=>{
      const med = s.medications[medId];

    await pushBin(fresh);

  }

function fmtTime(t){ const [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; let hh=h%12; if(hh===0)hh=12; return hh+':'+String(m).padStart(2,'0')+' '+ap; }
function fmtDateTime(iso){ const d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }

/* ---------------- Real push notifications (works with the tab closed) ---------------- */
const VAPID_PUBLIC_KEY = 'BEVRW10TUo3WZxJZOPbbe8IGFJ8OePjBIsrNRVR28ZHUz7sOppyOPDMAmlkFByAvLb0Vr9T_POpoik3co4PP2T4';
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const rawData = atob(base64);
  const out = new Uint8Array(rawData.length);
  for(let i=0;i<rawData.length;i++) out[i] = rawData.charCodeAt(i);
  return out;
}
function isPushSupported(){ return ('serviceWorker' in navigator) && ('PushManager' in window); }
async function getExistingPushSubscription(){
  if(!isPushSupported()) return null;
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    if(!reg) return null;
    return await reg.pushManager.getSubscription();
  }catch(e){ return null; }
}
async function enablePushNotifications(){
  if(!isPushSupported()){
    toast('This browser does not support push notifications');
    return false;
  }
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      toast('Notification permission was not granted');
      return false;
    }
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const subJson = sub.toJSON();
    await mutateBin(s=>{
      if(!s.pushSubscriptions) s.pushSubscriptions = [];
      if(!s.pushSubscriptions.some(x=>x.endpoint === subJson.endpoint)){
        s.pushSubscriptions.push(subJson);
      }
    });
    toast('Notifications enabled on this device');
    return true;
  }catch(e){
    console.error('enablePushNotifications failed:', e);
    toast('Could not enable notifications: ' + (e.message||e));
    return false;
  }
}
async function disablePushNotifications(){
  try{
    const sub = await getExistingPushSubscription();
    if(sub){
      const endpoint = sub.endpoint;
      await sub.unsubscribe();
      await mutateBin(s=>{
        s.pushSubscriptions = (s.pushSubscriptions||[]).filter(x=>x.endpoint !== endpoint);
      });
    }
    toast('Notifications turned off on this device');
  }catch(e){
    console.error('disablePushNotifications failed:', e);
    toast('Could not turn off notifications: ' + (e.message||e));
  }
}
async function refreshPushNotifSettingsUI(){
  const note = document.getElementById('pushNotifNote');
  const btn = document.getElementById('pushNotifToggleBtn');
  if(!note || !btn) return;
  if(!isPushSupported()){
    note.textContent = "This browser doesn't support real push notifications — the in-app alarm above still works while the page is open.";
    btn.style.display = 'none';
    return;
  }
  const sub = await getExistingPushSubscription();
  if(sub && Notification.permission === 'granted'){
    note.textContent = 'Phone notifications are ON for this device — a due medicine will alert you even if this tab is closed.';
    btn.textContent = 'Turn off phone notifications';
    btn.style.display = 'block';

  } else {

    btn.textContent = 'Enable phone notifications';
    btn.style.display = 'block';
    btn.onclick = async ()=>{ btn.disabled = true; await enablePushNotifications(); refreshPushNotifSettingsUI(); btn.disabled = false; };
  }
}

/* ---------------- Medicine alarms ---------------- */
/* NOTE: this works while the app is open in a browser tab (foreground or backgrounded but
   not fully closed). Phones don't let a plain web page wake itself up from fully closed —
   there's no server pushing notifications here — so for this to reliably ring, the phone
   just needs this page open (e.g. left open in the background), not force-quit. */
const LS_SNOOZE_KEY = 'momscare_alarm_snoozes_v1';
const ALARM_STALE_MS = 12*60*60*1000; // don't resurrect doses more than 12h overdue on load
function loadSnoozes(){ try{ return JSON.parse(localStorage.getItem(LS_SNOOZE_KEY)||'{}'); }catch(e){ return {}; } }
function saveSnoozes(obj){ try{ localStorage.setItem(LS_SNOOZE_KEY, JSON.stringify(obj)); }catch(e){} }
let snoozeUntil = loadSnoozes();
let ringingAlarms = {};

function requestNotifPermission(){
  try{
    if('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission().catch(()=>{});
    }
  }catch(e){}
}

/* Mobile browsers block any sound until the page has had a real tap/click.
   We "unlock" the alarm audio element the first time the person touches the
   page at all, so it's allowed to play unprompted later when an alarm fires. */
let audioUnlocked = false;
function unlockAlarmAudioOnce(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  const el = document.getElementById('alarmAudioEl');
  if(el){
    el.muted = true;
    el.play().then(()=>{
      el.pause(); el.currentTime = 0; el.muted = false;
    }).catch(()=>{ el.muted = false; });
  }
  requestNotifPermission();
  try{
    if('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({ title: "Medicine alarm", artist: "Mom's Care" });
    }
  }catch(e){}
  ['pointerdown','touchend','keydown'].forEach(evt=>document.removeEventListener(evt, unlockAlarmAudioOnce));
}
['pointerdown','touchend','keydown'].forEach(evt=>document.addEventListener(evt, unlockAlarmAudioOnce, {passive:true}));

let vibrateTimer = null;
function startAlarmSound(){
  const el = document.getElementById('alarmAudioEl');
  if(el && el.paused){
    el.currentTime = 0;
    el.play().catch(()=>{ /* will start as soon as the page gets a tap */ });
  }
  if(navigator.vibrate){ try{ navigator.vibrate([300,150,300,150,300]); }catch(e){} }
  if(!vibrateTimer){
    vibrateTimer = setInterval(()=>{ if(navigator.vibrate){ try{ navigator.vibrate([300,150,300,150,300]); }catch(e){} } }, 4000);
  }
}
function stopAlarmSound(){
  const el = document.getElementById('alarmAudioEl');
  if(el && !el.paused){ el.pause(); el.currentTime = 0; }
  if(vibrateTimer){ clearInterval(vibrateTimer); vibrateTimer = null; }
  if(navigator.vibrate){ try{ navigator.vibrate(0); }catch(e){} }
}

function checkAlarms(){
  const now = Date.now();
  const dateStr = todayStr();
  const activeKeys = new Set();
  Object.values(medications).forEach(med=>{
    (med.schedule||[]).forEach(sched=>{
      const key = dateStr+'_'+med.id+'_'+sched.id;
      if(doseLogs[key]) return; // already given today
      const [h,m] = (sched.time||'00:00').split(':').map(Number);
      const scheduled = new Date(); scheduled.setHours(h,m,0,0);
      const scheduledMs = scheduled.getTime();
      if(now < scheduledMs) return; // not due yet
      if(now - scheduledMs > ALARM_STALE_MS) return; // too old, don't resurrect
      const snoozeTs = snoozeUntil[key];
      if(snoozeTs && now < snoozeTs) return; // currently snoozed
      activeKeys.add(key);
      if(!ringingAlarms[key]) ringingAlarms[key] = {med, sched, dateStr};
    });
  });
  Object.keys(ringingAlarms).forEach(key=>{ if(!activeKeys.has(key)) delete ringingAlarms[key]; });
  renderAlarmOverlay();
}

function renderAlarmOverlay(){
  const keys = Object.keys(ringingAlarms);
  const overlay = document.getElementById('overlayAlarm');
  if(keys.length === 0){
    overlay.classList.remove('open');
    stopAlarmSound();
    return;
  }
  startAlarmSound();
  try{
    if('Notification' in window && Notification.permission === 'granted' && document.hidden){
      const names = keys.map(k=>ringingAlarms[k].med.name).join(', ');
      new Notification("It's medicine time", { body: names, tag: 'momscare-alarm' });
    }
  }catch(e){}
  const sheet = document.getElementById('sheetAlarm');
  const itemsHtml = keys.map(key=>{
    const {med, sched} = ringingAlarms[key];
    return `
      <div class="alarm-item">
        <div class="alarm-item-name">${esc(med.name)}${med.insulin?' · 💧 Insulin':''}</div>
        <div class="alarm-item-meta">${fmtTime(sched.time)}${med.dosage?' · '+esc(med.dosage):''}${sched.label?' · '+esc(sched.label):''}</div>
        <div class="alarm-item-actions">
          <button class="btn btn-primary" data-alarm-give="${key}">Give now</button>
          <button class="btn btn-ghost" data-alarm-snooze="${key}">Snooze 5 min</button>
        </div>
      </div>`;
  }).join('');
  sheet.innerHTML = `
    <div class="sheet-scroll">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title alarm-title">⏰ Medicine time</h3>
      <p class="sheet-desc">${keys.length>1 ? 'These doses are due — this will keep ringing every 5 minutes until each one is given or snoozed.' : 'This dose is due — this will keep ringing every 5 minutes until it\u2019s given or snoozed.'}</p>
      ${itemsHtml}
    </div>
  `;
  sheet.querySelectorAll('[data-alarm-give]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.getAttribute('data-alarm-give');
      const entry = ringingAlarms[key];
      delete ringingAlarms[key];
      delete snoozeUntil[key]; saveSnoozes(snoozeUntil);
      // Hide the alarm screen itself (rather than re-rendering it) so it can't sit
      // on top of the give-dose sheet we're about to open; closeAllOverlays()
      // brings it back afterward for any other medicine that's still due.
      stopAlarmSound();
      overlay.classList.remove('open');
      if(entry) openDoseConfirm(entry.med.id, entry.sched.id, entry.dateStr);
    });
  });
  sheet.querySelectorAll('[data-alarm-snooze]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.getAttribute('data-alarm-snooze');
      snoozeUntil[key] = Date.now() + 5*60*1000;
      saveSnoozes(snoozeUntil);
      delete ringingAlarms[key];
      renderAlarmOverlay();
      toast('Snoozed — will ring again in 5 minutes');
    });
  });
  overlay.classList.add('open');
}
