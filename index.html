<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Mom's Care — Meds &amp; Vitals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#F2F6F5;
  --surface:#FFFFFF;
  --surface-alt:#EAF1EF;
  --ink:#1E2B29;
  --ink-soft:#5C716E;
  --ink-faint:#8FA29F;
  --line:#DCE6E3;
  --teal:#0F6B63;
  --teal-deep:#0A4A45;
  --teal-tint:#E1EEEC;
  --amber:#C87F1F;
  --amber-tint:#FBEDD9;
  --red:#C1453B;
  --red-tint:#F9E1DE;
  --green:#3C8A5B;
  --green-tint:#E1F0E6;
  --insulin:#6B4FA0;
  --insulin-tint:#EBE5F5;
  --blue:#2E74B5;
  --blue-tint:#E4EFF9;
  --radius:16px;
  --radius-sm:12px;
  --shadow-sm:0 1px 2px rgba(20,40,38,0.05);
  --shadow-md:0 6px 20px rgba(15,45,42,0.08);
  --shadow-lg:0 10px 32px rgba(10,35,32,0.16);
  --font-display:'Fraunces', serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0; height:100%;}
body{
  background:var(--bg);
  font-family:var(--font-body);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  min-height:100dvh;
}
#appShell{
  max-width:480px;
  margin:0 auto;
  height:100vh;
  height:100dvh;
  background:var(--bg);
  position:relative;
  display:flex;
  flex-direction:column;
  box-shadow: var(--shadow-lg);
  overflow:hidden;
}
@media(min-width:520px){
  body{padding:26px 0;}
  #appShell{height:calc(100dvh - 52px); border-radius:26px;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ---------- Header ---------- */
header.appbar{
  position:sticky; top:0; z-index:20;
  background:radial-gradient(120% 140% at 15% 0%, #12746B 0%, var(--teal-deep) 55%, #073834 100%);
  color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
  display:flex; flex-direction:column; gap:9px;
}
.appbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.brand{display:flex; align-items:baseline; gap:8px;}
.brand-mark{font-family:var(--font-display); font-weight:600; font-size:19px; letter-spacing:0.2px;}
.status-pill{
  display:flex; align-items:center; gap:6px;
  font-size:10px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.04em;
  color:#CFE9E4; background:rgba(255,255,255,0.08);
  padding:4px 9px; border-radius:20px; border:1px solid rgba(255,255,255,0.14);
  cursor:default; transition:background .2s;
}
.status-dot{width:6px;height:6px;border-radius:50%; background:#F0C46B; box-shadow:0 0 0 3px rgba(240,196,107,0.22); transition:background .2s; flex-shrink:0;}
.status-dot.live{background:#5FD6A8; box-shadow:0 0 0 3px rgba(95,214,168,0.22);}
.status-dot.off{background:#E88A7D; box-shadow:0 0 0 3px rgba(232,138,125,0.22);}
.caregiver-pill{
  display:flex; align-items:center; gap:7px;
  background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.16);
  padding:5px 11px 5px 5px; border-radius:20px; font-size:12.5px; font-weight:600; cursor:pointer;
  transition:background .15s;
}
.caregiver-pill:active{background:rgba(255,255,255,0.2);}
.caregiver-pill .avatar{
  width:20px;height:20px;border-radius:50%;background:#5FD6A8;color:#0A4A45;
  font-size:9.5px; font-weight:700; display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);
}
.icon-btn{
  background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.16);
  width:32px;height:32px;border-radius:10px; color:#fff; display:flex;align-items:center;justify-content:center;
  cursor:pointer; transition:background .15s, transform .1s;
}
.icon-btn:active{background:rgba(255,255,255,0.22); transform:scale(0.94);}
.icon-btn svg{width:15px;height:15px;}
.date-line{font-size:12.5px; color:#BFE0DA; font-weight:500;}

/* ---------- Nav tabs ---------- */
nav.tabs{
  display:flex; gap:2px; padding:8px 8px 0; background:var(--bg);
  border-bottom:1px solid var(--line);
}
nav.tabs button{
  flex:1; border:none; background:transparent; padding:9px 2px 10px;
  font-family:var(--font-body); font-weight:700; font-size:11px; color:var(--ink-faint);
  cursor:pointer; border-bottom:2px solid transparent; transition:color .15s, border-color .15s;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
nav.tabs button.active{color:var(--teal-deep); border-bottom-color:var(--teal);}

/* connection banner */
.conn-banner{
  display:flex; align-items:center; gap:10px; background:var(--red-tint); color:var(--red);
  padding:10px 16px; font-size:12px; line-height:1.4; border-bottom:1px solid #E7B4AD;
}
.conn-banner svg{width:15px;height:15px; flex-shrink:0;}
.conn-banner span{flex:1;}
.conn-banner button{
  background:var(--red); color:#fff; border:none; padding:6px 10px; border-radius:8px;
  font-size:11px; font-weight:700; cursor:pointer; flex-shrink:0;
}

/* ---------- Main ---------- */
main{flex:1; min-height:0; padding:14px 16px calc(100px + env(safe-area-inset-bottom)); overflow-y:auto; -webkit-overflow-scrolling:touch;}
.view-fade{animation:fadeIn .22s ease-out;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

.section-title{
  font-family:var(--font-body); font-weight:700;
  color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.07em; font-size:11px;
  margin:20px 3px 9px;
}
.section-title:first-child{margin-top:2px;}

/* progress hero (Today tab) */
.progress-hero{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:15px 16px; box-shadow:var(--shadow-sm);
}
.progress-top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:9px;}
.progress-label{font-family:var(--font-display); font-weight:600; font-size:15px; color:var(--ink);}
.progress-count{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);}
.progress-track{height:7px; background:var(--surface-alt); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--teal), #189384); border-radius:6px; transition:width .4s ease;}
.progress-note{font-size:11.5px; color:var(--ink-faint); margin-top:8px;}
.progress-note.attn{color:var(--red); font-weight:600;}

/* vitals hero (Glucose / Pressure tabs) */
.vital-hero{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 17px; box-shadow:var(--shadow-sm);
}
.vital-hero-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
.vital-big{font-family:var(--font-display); font-weight:600; font-size:34px; color:var(--ink); line-height:1;}
.vital-big small{font-family:var(--font-body); font-weight:600; font-size:13px; color:var(--ink-soft); margin-left:4px;}
.vital-sub{font-size:12px; color:var(--ink-soft); margin-top:4px; font-family:var(--font-mono);}
.vital-chip{font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap;}
.chip-normal{background:var(--green-tint); color:var(--green);}
.chip-elevated{background:var(--amber-tint); color:var(--amber);}
.chip-high{background:var(--red-tint); color:var(--red);}
.chip-low{background:var(--blue-tint); color:var(--blue);}
.vital-trend{margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
.vital-trend svg{width:13px;height:13px;}
.vital-trend.up svg{color:var(--amber);}
.vital-trend.down svg{color:var(--blue);}
.vital-trend.flat svg{color:var(--ink-faint);}
.chart-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 12px 10px; box-shadow:var(--shadow-sm); margin-top:12px;
}
.chart-legend{display:flex; gap:14px; padding:0 4px 8px; font-size:11px; color:var(--ink-soft);}
.chart-legend span{display:flex; align-items:center; gap:5px;}
.chart-legend i{width:9px;height:9px;border-radius:50%; display:inline-block;}
.vitals-note{font-size:10.5px; color:var(--ink-faint); line-height:1.5; margin-top:10px; padding:0 2px;}

.reading-row{
  display:flex; align-items:center; gap:12px; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 13px; margin-bottom:9px;
  cursor:pointer; transition:transform .1s; box-shadow:var(--shadow-sm);
}
.reading-row:active{transform:scale(0.985);}
.reading-row-main{flex:1; min-width:0;}
.reading-row-value{font-weight:700; font-size:15px; font-family:var(--font-mono);}
.reading-row-sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

/* timeline (Today tab) */
.timeline{position:relative; padding-left:26px;}
.timeline::before{
  content:''; position:absolute; left:9px; top:4px; bottom:4px; width:2px;
  background:var(--line);
}
.dose-node{position:relative; margin-bottom:12px;}
.dose-dot{
  position:absolute; left:-26px; top:14px; width:20px;height:20px; border-radius:50%;
  background:var(--surface); border:2px solid var(--ink-faint); z-index:2;
  display:flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s;
}
.dose-dot svg{width:11px;height:11px; opacity:0;}
.dose-node.given .dose-dot{background:var(--green); border-color:var(--green);}
.dose-node.given .dose-dot svg{opacity:1; stroke:#fff;}
.dose-node.overdue .dose-dot{border-color:var(--red); background:var(--red-tint);}
.dose-node.due .dose-dot{border-color:var(--amber); background:var(--amber-tint); animation:pulse 1.7s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,127,31,0.35);}50%{box-shadow:0 0 0 5px rgba(200,127,31,0);}}

.dose-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:12px 13px; cursor:pointer; transition:border-color .15s, transform .1s, box-shadow .15s;
  box-shadow:var(--shadow-sm);
}
.dose-card:active{transform:scale(0.985); box-shadow:none;}
.dose-node.overdue .dose-card{border-color:#E7B4AD; background:var(--red-tint);}
.dose-node.due .dose-card{border-color:#EBC98C; background:var(--amber-tint);}
.dose-node.given .dose-card{background:var(--green-tint); border-color:#BFE0CB;}
.dose-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.dose-name-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.dose-name{font-weight:700; font-size:14.5px; color:var(--ink);}
.insulin-chip{
  font-size:9.5px; font-family:var(--font-mono); font-weight:600; letter-spacing:0.03em;
  background:var(--insulin-tint); color:var(--insulin); padding:2px 6px; border-radius:6px;
  display:flex; align-items:center; gap:3px; text-transform:uppercase;
}
.insulin-chip svg{width:9px;height:9px;}
.dose-time{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); white-space:nowrap; font-weight:600;}
.dose-dosage{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.dose-meta{
  margin-top:7px; font-size:11.5px; font-family:var(--font-mono); display:flex; align-items:center; gap:5px;
}
.dose-meta.given{color:var(--green);}
.dose-meta.overdue{color:var(--red); font-weight:600;}
.dose-meta.due{color:var(--amber); font-weight:600;}
.dose-meta.upcoming{color:var(--ink-faint);}

.empty-state{text-align:center; padding:52px 24px; color:var(--ink-faint);}
.empty-state svg{width:38px;height:38px; opacity:0.5; margin-bottom:10px;}
.empty-state p{font-size:13px; margin:4px 0;}
.empty-state .cta{color:var(--teal); font-weight:700; cursor:pointer;}

/* Manage list */
.med-row{
  display:flex; align-items:center; gap:12px; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 13px; margin-bottom:10px;
  cursor:pointer; transition:transform .1s, box-shadow .15s; box-shadow:var(--shadow-sm);
}
.med-row:active{transform:scale(0.985);}
.med-row-swatch{
  width:38px;height:38px;border-radius:11px; background:var(--teal-tint); color:var(--teal-deep);
  display:flex;align-items:center;justify-content:center; font-family:var(--font-display); font-weight:600; font-size:16px;
  flex-shrink:0;
}
.med-row.insulin .med-row-swatch{background:var(--insulin-tint); color:var(--insulin);}
.med-row-body{flex:1; min-width:0;}
.med-row-name{font-weight:700; font-size:14px;}
.med-row-sub{font-size:12px; color:var(--ink-soft); margin-top:1px;}
.med-row-chevron{color:var(--ink-faint); flex-shrink:0;}
.med-row-chevron svg{width:16px;height:16px;}

/* FAB */
.fab{
  position:absolute; right:18px; bottom:calc(22px + env(safe-area-inset-bottom)); width:56px;height:56px; border-radius:50%;
  background:var(--teal); color:#fff; border:none; box-shadow:0 8px 22px rgba(15,107,99,0.38);
  display:flex;align-items:center;justify-content:center; cursor:pointer; z-index:15; transition:transform .1s, background .15s;
}
.fab:active{transform:scale(0.92);}
.fab svg{width:22px;height:22px;}

/* ---------- Sheets / Modals ---------- */
.overlay{
  position:absolute; inset:0; background:rgba(10,20,19,0.46); z-index:30;
  display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(1px);
}
.overlay.open{display:flex;}
.sheet{
  background:var(--surface); width:100%; max-width:480px; border-radius:22px 22px 0 0;
  max-height:92vh; max-height:92dvh; overflow:hidden;
  display:flex; flex-direction:column;
  animation:slideUp .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes slideUp{from{transform:translateY(28px); opacity:0.3;} to{transform:translateY(0); opacity:1;}}
.sheet-scroll{flex:1; min-height:0; overflow-y:auto; padding:8px 20px 10px; -webkit-overflow-scrolling:touch;}
.sheet-footer{
  flex-shrink:0; padding:10px 20px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line); background:var(--surface);
}
.sheet-footer .btn{margin-top:8px;}
.sheet-footer .btn:first-child{margin-top:0;}
.sheet-handle{width:36px;height:4px;background:var(--line); border-radius:4px; margin:8px auto 12px;}
.sheet-title{font-family:var(--font-display); font-size:18px; font-weight:600; margin:0 0 3px;}
.sheet-desc{font-size:12px; color:var(--ink-soft); margin:0 0 12px; line-height:1.45;}
.field{margin-bottom:11px;}
.field label{display:block; font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:5px;}
.field input[type=text], .field input[type=number], .field input[type=time], .field input[type=datetime-local], .field textarea, .field select{
  width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px;
  font-family:var(--font-body); font-size:14.5px; background:var(--surface); color:var(--ink);
}
.field textarea{resize:vertical; min-height:44px;}
.field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:7px 0;}
.toggle-row .tlabel{font-size:14px; font-weight:700;}
.toggle-row .thint{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
.switch{position:relative; width:44px; height:26px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.switch .track{position:absolute; inset:0; background:var(--line); border-radius:20px; cursor:pointer; transition:.15s;}
.switch .track::before{content:''; position:absolute; left:3px; top:3px; width:20px;height:20px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,0.2);}
.switch input:checked + .track{background:var(--insulin);}
.switch input:checked + .track::before{transform:translateX(18px);}

.schedule-list{display:flex; flex-direction:column; gap:6px; margin-bottom:8px;}
.schedule-row{display:flex; gap:8px; align-items:center; background:var(--surface-alt); padding:8px; border-radius:10px;}
.schedule-row select{flex:1.1; padding:9px 8px; border-radius:8px; border:1.5px solid var(--line); font-size:13px;}
.schedule-row input[type=time]{flex:1; padding:9px 8px; border-radius:8px; border:1.5px solid var(--line); font-size:13px; font-family:var(--font-mono);}
.schedule-row .rm{background:none; border:none; color:var(--red); cursor:pointer; padding:4px;}
.schedule-row .rm svg{width:16px;height:16px;}
.add-time-btn{
  display:flex; align-items:center; gap:6px; background:none; border:1.5px dashed var(--line);
  color:var(--teal); font-weight:700; font-size:13px; padding:9px; border-radius:10px; width:100%; cursor:pointer; justify-content:center;
}
.add-time-btn svg{width:14px;height:14px;}

.btn{width:100%; padding:13px; border-radius:12px; border:none; font-weight:700; font-size:14.5px; cursor:pointer; font-family:var(--font-body); transition:transform .1s, background .15s;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--teal); color:#fff; margin-top:6px;}
.btn-primary:active{background:var(--teal-deep);}
.btn-danger{background:var(--red-tint); color:var(--red); margin-top:8px;}
.btn-ghost{background:var(--surface-alt); color:var(--ink); margin-top:8px;}
.btn:disabled{opacity:0.5; cursor:not-allowed;}

.history-list{margin-top:4px; border-top:1px solid var(--line); padding-top:10px;}
.history-item{display:flex; justify-content:space-between; font-size:12px; padding:6px 0; color:var(--ink-soft); font-family:var(--font-mono);}

.confirm-summary{background:var(--surface-alt); border-radius:12px; padding:14px; margin-bottom:14px;}
.confirm-summary .cname{font-family:var(--font-display); font-weight:600; font-size:17px;}
.confirm-summary .cmeta{font-size:12.5px; color:var(--ink-soft); margin-top:3px; font-family:var(--font-mono);}
.given-by-box{background:var(--green-tint); border-radius:12px; padding:14px; margin-bottom:14px; text-align:center;}
.given-by-box .who{font-weight:700; font-size:15px; color:var(--green);}
.given-by-box .when{font-size:12px; font-family:var(--font-mono); color:var(--ink-soft); margin-top:2px;}

.settings-note{background:var(--surface-alt); border-radius:12px; padding:12px 13px; font-size:12px; color:var(--ink-soft); line-height:1.5; margin-bottom:14px;}

.toast{
  position:absolute; left:50%; bottom:calc(26px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(10px);
  background:var(--ink); color:#fff; padding:10px 16px; border-radius:10px; font-size:13px;
  opacity:0; transition:.2s; z-index:60; pointer-events:none; max-width:86%;
  white-space:normal; line-height:1.4; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.hidden{display:none !important;}
</style>
</head>
<body>
<div id="appShell">

  <div id="mainApp" style="display:flex; flex-direction:column; flex:1; min-height:0;">
    <header class="appbar">
      <div class="appbar-row">
        <div class="brand"><span class="brand-mark">Mom's Care</span></div>
        <div class="status-pill" title="Synced live with every caregiver's device">
          <span class="status-dot" id="statusDot"></span><span id="statusText">Connecting</span>
        </div>
      </div>
      <div class="appbar-row">
        <div class="date-line" id="dateLine"></div>
        <div style="display:flex; gap:8px;">
          <div class="caregiver-pill" id="caregiverPill"><span class="avatar" id="caregiverAvatar">?</span><span id="caregiverNameLabel">Set name</span></div>
          <button class="icon-btn" id="settingsBtn" title="Settings">

(function(){

/* =========================================================================
   DATA LAYER
   Medications, dose logs, glucose readings, and blood-pressure readings are
   all synced live through Firestore (project: mom-s-med) — every caregiver's

function lsGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function lsSet(key, value){ try{ localStorage.setItem(key, value); }catch(e){ /* ignore */ } }
const LS_NAME_KEY = 'momscare_caregiver';

const COLL = { meds:'medications', logs:'doseLogs', glucose:'glucoseReadings', bp:'bpReadings' };

let medsUnsub=null, logsUnsub=null, glucoseUnsub=null, bpUnsub=null;

const Store = {
  init(){
    if(medsUnsub) medsUnsub();
    medsUnsub = onSnapshot(collection(db, COLL.meds), snap=>{
      medications = {};
      snap.forEach(d=>{ medications[d.id] = Object.assign({id:d.id}, d.data()); });
      handleConnOk(); render();
    }, err=>{ console.error('medications listener failed:', err); handleConnError(err); });

    if(logsUnsub) logsUnsub();
    const logsCutoff = daysAgoStr(30);
    logsUnsub = onSnapshot(query(collection(db, COLL.logs), where('date','>=', logsCutoff)), snap=>{
      doseLogs = {};
      snap.forEach(d=>{ doseLogs[d.id] = d.data(); });
      handleConnOk(); render();
    }, err=>{ console.error('doseLogs listener failed:', err); handleConnError(err); });

    if(glucoseUnsub) glucoseUnsub();
    const vitalsCutoff = daysAgoStr(120);
    glucoseUnsub = onSnapshot(query(collection(db, COLL.glucose), where('date','>=', vitalsCutoff)), snap=>{
      glucoseReadings = {};
      snap.forEach(d=>{ glucoseReadings[d.id] = Object.assign({id:d.id}, d.data()); });
      handleConnOk(); render();
    }, err=>{ console.error('glucoseReadings listener failed:', err); handleConnError(err); });

    if(bpUnsub) bpUnsub();
    bpUnsub = onSnapshot(query(collection(db, COLL.bp), where('date','>=', vitalsCutoff)), snap=>{
      bpReadings = {};
      snap.forEach(d=>{ bpReadings[d.id] = Object.assign({id:d.id}, d.data()); });
      handleConnOk(); render();
    }, err=>{ console.error('bpReadings listener failed:', err); handleConnError(err); });
  },
  saveMed(id, data){ return setDoc(doc(db, COLL.meds, id), data, {merge:true}); },
  deleteMed(id){ return deleteDoc(doc(db, COLL.meds, id)); },
  setLog(key, data){ return setDoc(doc(db, COLL.logs, key), data); },
  deleteLog(key){ return deleteDoc(doc(db, COLL.logs, key)); },
  addGlucose(id, data){ return setDoc(doc(db, COLL.glucose, id), data); },
  deleteGlucose(id){ return deleteDoc(doc(db, COLL.glucose, id)); },
  addBP(id, data){ return setDoc(doc(db, COLL.bp, id), data); },
  deleteBP(id){ return deleteDoc(doc(db, COLL.bp, id)); },
  async clearAll(){
    async function wipe(collName){
      const snap = await getDocs(collection(db, collName));
      const jobs = [];
      snap.forEach(d=> jobs.push(deleteDoc(doc(db, collName, d.id))));
      await Promise.all(jobs);
    }
    await Promise.all([wipe(COLL.meds), wipe(COLL.logs), wipe(COLL.glucose), wipe(COLL.bp)]);
  }
};

function setStatus(ok){

function handleConnOk(){ setStatus(true); hideConnBanner(); }
function handleConnError(err){ setStatus(false); showConnBanner(friendlyFirestoreError(err)); }
function showConnBanner(msg){
  const el = document.getElementById('connBanner');

}
function hideConnBanner(){ document.getElementById('connBanner').classList.add('hidden'); }
document.getElementById('connRetryBtn').addEventListener('click', ()=>{ hideConnBanner(); setStatus(false); Store.init(); });

function friendlyFirestoreError(e){
  const code = (e && e.code) || '';
  if(code.includes('permission-denied')) return 'Blocked by Firestore security rules — open the Firebase console → Firestore → Rules and allow read/write.';
  if(code.includes('unavailable') || code.includes('network')) return 'No connection to Firestore right now — check your internet and try again.';
  return 'Could not save: ' + ((e && e.message) || 'unknown error');
}

/* Gives a write a short grace window to fail fast (most rejections, like
   permission-denied, come back almost instantly) before the caller decides
   whether to keep a form open on a real failure — while still guaranteeing
   the banner fires on a genuine failure whenever it actually arrives. */
async function runWrite(promise, label, graceMs){
  graceMs = graceMs || 2500;
  let failedWith = null;
  const tracked = promise.then(()=>{}, (e)=>{
    failedWith = e;
    console.error(label+' failed:', e);
    toast(friendlyFirestoreError(e));
    showConnBanner(friendlyFirestoreError(e));
  });
  await Promise.race([tracked, new Promise(r=>setTimeout(r, graceMs))]);
  return failedWith;
}

function todayStr(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysAgoStr(n){ const d = new Date(); d.setDate(d.getDate()-n); return todayStr(d); }
function fmtTime(t){

}
function fmtDateTime(iso){

  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});

function nowLocalInputValue(){

/* ================= TODAY (medication timeline) ================= */
function computeDoseInstances(){
  const list = [];
  Object.values(medications).forEach(med=>{
    (med.schedule||[]).forEach(s=>{ list.push({med, sched:s}); });
  });
  list.sort((a,b)=> a.sched.time.localeCompare(b.sched.time));
  return list;
}
function doseStatus(med, sched){
  const key = todayStr()+'_'+med.id+'_'+sched.id;
  const log = doseLogs[key];
  if(log) return {status:'given', key, log};
  const now = new Date();
  const [h,m] = sched.time.split(':').map(Number);
  const scheduled = new Date(); scheduled.setHours(h,m,0,0);
  const diffMin = (now - scheduled) / 60000;
  if(diffMin > 30) return {status:'overdue', key};
  if(diffMin >= -30) return {status:'due', key};
  return {status:'upcoming', key};
}

function render(){
  const main = document.getElementById('mainContent');
  if(activeTab === 'today') renderToday(main);
  else if(activeTab === 'manage') renderManage(main);
  else if(activeTab === 'glucose') renderVitalTab(main, 'glucose');
  else if(activeTab === 'pressure') renderVitalTab(main, 'pressure');
}

function renderToday(main){
  const instances = computeDoseInstances();
  if(instances.length === 0){
    main.innerHTML = `<div class="view-fade empty-state">${ICON_EMPTY}<p><strong>No medications yet.</strong></p><p>Tap the <span class="cta" onclick="document.getElementById('fabAdd').click()">+ button</span> to add mom's first medication and set its times.</p></div>`;
    return;
  }
  const given = instances.filter(i=>doseStatus(i.med,i.sched).status==='given').length;
  const overdue = instances.filter(i=>doseStatus(i.med,i.sched).status==='overdue').length;
  const pct = Math.round((given/instances.length)*100);

  const buckets = {};
  instances.forEach(inst=>{
    const label = inst.sched.label || 'Custom';
    if(!buckets[label]) buckets[label] = [];
    buckets[label].push(inst);
  });
  const orderedLabels = Object.keys(buckets).sort((a,b)=>{
    const ia = LABEL_ORDER.indexOf(a); const ib = LABEL_ORDER.indexOf(b);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });

  let html = `
    <div class="view-fade">
    <div class="progress-hero">
      <div class="progress-top"><span class="progress-label">Today's doses</span><span class="progress-count">${given} / ${instances.length} given</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${overdue>0 ? `<div class="progress-note attn">${overdue} dose${overdue===1?'':'s'} overdue — tap below to log</div>` : `<div class="progress-note">On track for the day</div>`}
    </div>`;

  orderedLabels.forEach(label=>{
    html += `<div class="section-title">${esc(label)}</div><div class="timeline">`;
    buckets[label].forEach(inst=>{
      const {med, sched} = inst;
      const st = doseStatus(med, sched);
      let metaHtml = '';
      if(st.status === 'given') metaHtml = `<div class="dose-meta given">✓ Given by ${esc(st.log.takenBy)} · ${fmtDateTime(st.log.takenAt)}</div>`;
      else if(st.status === 'overdue') metaHtml = `<div class="dose-meta overdue">Overdue — not yet given</div>`;
      else if(st.status === 'due') metaHtml = `<div class="dose-meta due">Due now</div>`;
      else metaHtml = `<div class="dose-meta upcoming">Upcoming</div>`;
      html += `
        <div class="dose-node ${st.status}">
          <div class="dose-dot">${ICON_CHECK}</div>
          <div class="dose-card" data-action="dose" data-med="${med.id}" data-sched="${sched.id}">
            <div class="dose-top">
              <div class="dose-name-row">
                <span class="dose-name">${esc(med.name)}</span>
                ${med.insulin ? `<span class="insulin-chip">${ICON_DROP} Insulin</span>` : ''}
              </div>
              <span class="dose-time">${fmtTime(sched.time)}</span>
            </div>
            ${med.dosage ? `<div class="dose-dosage">${esc(med.dosage)}</div>` : ''}
            ${metaHtml}
          </div>
        </div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  main.innerHTML = html;
}

function renderManage(main){
  const meds = Object.values(medications).sort((a,b)=>a.name.localeCompare(b.name));
  if(meds.length === 0){

/* ================= GLUCOSE & PRESSURE (vitals) ================= */
function glucoseCategory(v){
  if(v < 70) return {label:'Low', cls:'chip-low'};
  if(v < 140) return {label:'Normal', cls:'chip-normal'};
  if(v < 200) return {label:'Elevated', cls:'chip-elevated'};
  return {label:'High', cls:'chip-high'};
}
function bpCategory(sys, dia){
  if(sys>=180 || dia>=120) return {label:'Crisis', cls:'chip-high'};
  if(sys>=140 || dia>=90) return {label:'High · Stage 2', cls:'chip-high'};
  if(sys>=130 || dia>=80) return {label:'High · Stage 1', cls:'chip-elevated'};
  if(sys>=120) return {label:'Elevated', cls:'chip-elevated'};
  return {label:'Normal', cls:'chip-normal'};
}
function computeTrend(values){
  if(values.length < 2) return null;
  const recentCount = Math.max(1, Math.min(3, Math.floor(values.length/2)));
  const recent = values.slice(-recentCount);
  const prior = values.slice(0, values.length - recentCount);
  if(prior.length === 0) return null;
  const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
  const recentAvg = avg(recent), priorAvg = avg(prior);
  const delta = recentAvg - priorAvg;
  let dir = 'flat';
  if(Math.abs(delta) >= Math.max(1, priorAvg*0.03)) dir = delta>0 ? 'up' : 'down';
  return {delta, dir};
}
function buildLineChartSVG(seriesList, opts){
  opts = Object.assign({width:320,height:140,padL:32,padR:8,padT:10,padB:20}, opts||{});
  const allVals = seriesList.flatMap(s=>s.values.map(p=>p.v)).filter(v=>typeof v==='number' && !isNaN(v));
  if(allVals.length === 0) return '';
  let yMin = Math.min(...allVals), yMax = Math.max(...allVals);
  if(yMin === yMax){ yMin -= 5; yMax += 5; }
  const pad = (yMax-yMin)*0.15; yMin -= pad; yMax += pad;
  const n = Math.max(...seriesList.map(s=>s.values.length));
  const plotW = opts.width - opts.padL - opts.padR;
  const plotH = opts.height - opts.padT - opts.padB;
  const xFor = i => opts.padL + (n<=1 ? plotW/2 : (i/(n-1))*plotW);
  const yFor = v => opts.padT + plotH - ((v-yMin)/(yMax-yMin))*plotH;

  let svg = `<svg viewBox="0 0 ${opts.width} ${opts.height}" style="width:100%; height:auto; display:block;">`;
  for(let g=0; g<=2; g++){
    const gv = yMin + (yMax-yMin)*(g/2);
    const gy = yFor(gv);
    svg += `<line x1="${opts.padL}" y1="${gy.toFixed(1)}" x2="${opts.width-opts.padR}" y2="${gy.toFixed(1)}" stroke="${CHART_COLORS.line}" stroke-width="1"/>`;
    svg += `<text x="${opts.padL-5}" y="${(gy+3).toFixed(1)}" font-size="8" fill="${CHART_COLORS.inkFaint}" text-anchor="end" font-family="IBM Plex Mono, monospace">${Math.round(gv)}</text>`;
  }
  seriesList.forEach(s=>{
    if(s.values.length===0) return;
    const pts = s.values.map((p,i)=>`${xFor(i).toFixed(1)},${yFor(p.v).toFixed(1)}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((p,i)=>{
      svg += `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(p.v).toFixed(1)}" r="3" fill="${s.color}" stroke="#fff" stroke-width="1.4"/>`;
    });
  });
  if(opts.xLabels && opts.xLabels.length && n>0){
    const idxs = n<=1 ? [0] : [0, Math.floor((n-1)/2), n-1];
    idxs.forEach(i=>{
      if(opts.xLabels[i]===undefined) return;
      svg += `<text x="${xFor(i).toFixed(1)}" y="${opts.height-5}" font-size="8" fill="${CHART_COLORS.inkFaint}" text-anchor="middle" font-family="IBM Plex Mono, monospace">${esc(opts.xLabels[i])}</text>`;
    });
  }
  svg += `</svg>`;
  return svg;
}
function trendBlock(trend, unitLabel){
  if(!trend) return `<div class="vital-trend flat">${ICON_FLAT}<span>Not enough readings yet for a trend</span></div>`;
  const icon = trend.dir==='up' ? ICON_UP : trend.dir==='down' ? ICON_DOWN : ICON_FLAT;
  const word = trend.dir==='up' ? 'Trending up' : trend.dir==='down' ? 'Trending down' : 'Holding steady';
  const deltaTxt = trend.dir==='flat' ? '' : ` — ${Math.abs(Math.round(trend.delta))} ${unitLabel} vs recent average`;
  return `<div class="vital-trend ${trend.dir}">${icon}<span>${word}${deltaTxt}</span></div>`;
}

function renderVitalTab(main, kind){
  const isGlucose = kind === 'glucose';
  const dataObj = isGlucose ? glucoseReadings : bpReadings;
  const readings = Object.values(dataObj).sort((a,b)=> a.takenAt.localeCompare(b.takenAt));

  if(readings.length === 0){
    const label = isGlucose ? 'glucose reading' : 'blood pressure reading';
    main.innerHTML = `<div class="view-fade empty-state">${ICON_EMPTY}<p><strong>No ${label}s logged yet.</strong></p><p>Tap the <span class="cta" onclick="document.getElementById('fabAdd').click()">+ button</span> to log the first one.</p></div>`;
    return;
  }

  const latest = readings[readings.length-1];
  const recent = readings.slice(-14);
  let heroHtml, chartHtml, legendHtml = '';

  if(isGlucose){
    const cat = glucoseCategory(latest.value);
    const trend = computeTrend(readings.map(r=>r.value));
    heroHtml = `
      <div class="vital-hero">
        <div class="vital-hero-top">
          <div>
            <div class="vital-big">${latest.value}<small>mg/dL</small></div>
            <div class="vital-sub">${esc(latest.context||'')} · ${fmtDateTime(latest.takenAt)}</div>
          </div>
          <span class="vital-chip ${cat.cls}">${cat.label}</span>
        </div>
        ${trendBlock(trend, 'mg/dL')}
      </div>`;
    chartHtml = buildLineChartSVG(
      [{name:'Glucose', color:CHART_COLORS.teal, values: recent.map(r=>({v:r.value}))}],
      {xLabels: recent.map(r=>fmtShortDate(r.takenAt))}
    );
  } else {
    const cat = bpCategory(latest.systolic, latest.diastolic);
    const trendSys = computeTrend(readings.map(r=>r.systolic));
    heroHtml = `
      <div class="vital-hero">
        <div class="vital-hero-top">
          <div>
            <div class="vital-big">${latest.systolic}/${latest.diastolic}<small>mmHg</small></div>
            <div class="vital-sub">${latest.pulse ? esc(latest.pulse)+' bpm · ' : ''}${fmtDateTime(latest.takenAt)}</div>
          </div>
          <span class="vital-chip ${cat.cls}">${cat.label}</span>
        </div>
        ${trendBlock(trendSys, 'mmHg systolic')}
      </div>`;
    chartHtml = buildLineChartSVG(
      [
        {name:'Systolic', color:CHART_COLORS.teal, values: recent.map(r=>({v:r.systolic}))},
        {name:'Diastolic', color:CHART_COLORS.insulin, values: recent.map(r=>({v:r.diastolic}))}
      ],
      {xLabels: recent.map(r=>fmtShortDate(r.takenAt))}
    );
    legendHtml = `<div class="chart-legend"><span><i style="background:${CHART_COLORS.teal}"></i>Systolic</span><span><i style="background:${CHART_COLORS.insulin}"></i>Diastolic</span></div>`;
  }

  let html = `<div class="view-fade">${heroHtml}
    <div class="chart-card">${legendHtml}${chartHtml}</div>
    <div class="vitals-note">General reference ranges shown for context only — not medical advice. Always follow your doctor's specific targets for mom.</div>
    <div class="section-title">Recent readings</div>`;

  readings.slice().reverse().slice(0,25).forEach(r=>{
    if(isGlucose){
      const cat = glucoseCategory(r.value);
      html += `
        <div class="reading-row" data-action="reading" data-kind="glucose" data-id="${r.id}">
          <div class="reading-row-main">
            <div class="reading-row-value">${r.value} mg/dL</div>
            <div class="reading-row-sub">${esc(r.context||'')} · ${fmtDateTime(r.takenAt)} · ${esc(r.takenBy||'')}</div>
          </div>
          <span class="vital-chip ${cat.cls}">${cat.label}</span>
        </div>`;
    } else {
      const cat = bpCategory(r.systolic, r.diastolic);
      html += `
        <div class="reading-row" data-action="reading" data-kind="pressure" data-id="${r.id}">
          <div class="reading-row-main">
            <div class="reading-row-value">${r.systolic}/${r.diastolic} mmHg</div>
            <div class="reading-row-sub">${r.pulse?esc(r.pulse)+' bpm · ':''}${fmtDateTime(r.takenAt)} · ${esc(r.takenBy||'')}</div>
          </div>
          <span class="vital-chip ${cat.cls}">${cat.label}</span>
        </div>`;
    }
  });
  html += `</div>`;
  main.innerHTML = html;
}

async function confirmDose(){
  const byInput = document.getElementById('confirmByInput');
  const by = byInput.value.trim();
  if(!by){ byInput.focus(); return; }
  if(by !== currentCaregiver){ currentCaregiver = by; lsSet(LS_NAME_KEY, by); updateCaregiverPill(); }
  const {medId, schedId, key} = confirmCtx;
  const btn = document.getElementById('confirmGiveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const err = await runWrite(
    Store.setLog(key, {medId, scheduleId:schedId, date:todayStr(), takenAt:new Date().toISOString(), takenBy:by}),
    'confirmDose'
  );
  if(err){ btn.disabled=false; btn.textContent='Confirm — given now'; return; }
  closeAllOverlays();
  toast('Marked as given');
}

async function undoDose(){
  const {key} = confirmCtx;
  const btn = document.getElementById('undoBtn');
  if(btn){ btn.disabled=true; btn.textContent='Undoing…'; }
  const err = await runWrite(Store.deleteLog(key), 'undoDose');
  if(err){ if(btn){ btn.disabled=false; btn.textContent='Undo — not actually given'; } return; }
  closeAllOverlays();
  toast('Dose reverted to not given');
}

function renderScheduleRows(){
  const list = document.getElementById('scheduleList');
  list.innerHTML = pendingSchedule.map((s,i)=>`
    <div class="schedule-row" data-idx="${i}">
      <select class="sched-label">${LABEL_ORDER.map(l=>`<option value="${l}" ${s.label===l?'selected':''}>${l}</option>`).join('')}</select>
      <input type="time" class="sched-time" value="${s.time}">
      <button class="rm" data-idx="${i}">${ICON_TRASH}</button>
    </div>
  `).join('');
  list.querySelectorAll('.schedule-row').forEach(row=>{
    const idx = Number(row.dataset.idx);
    row.querySelector('.sched-label').addEventListener('change', e=>{ pendingSchedule[idx].label = e.target.value; });
    row.querySelector('.sched-time').addEventListener('change', e=>{ pendingSchedule[idx].time = e.target.value; });
  });
  list.querySelectorAll('.rm').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = Number(btn.dataset.idx);
      pendingSchedule.splice(idx,1);
      renderScheduleRows();
    });
  });
}

async function saveMed(){

  const insulin = document.getElementById('medInsulinInput').checked;
  if(!name){ toast('Give the medication a name'); return; }
  if(pendingSchedule.length === 0){ toast('Add at least one time'); return; }
  const btn = document.getElementById('saveMedBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const id = editingMedId || ('med_'+uid());
  const wasEditing = !!editingMedId;
  const err = await runWrite(Store.saveMed(id, {name, dosage, notes, insulin, schedule:pendingSchedule}), 'saveMed');
  if(err){ btn.disabled=false; btn.textContent = wasEditing?'Save changes':'Add medication'; return; }

  toast(wasEditing ? 'Medication updated' : 'Medication added');

  `;
  document.getElementById('changeNameBtn').addEventListener('click', ()=>{ closeAllOverlays(); setTimeout(()=>openNameSheet(),150); });
  document.getElementById('clearAllBtn').addEventListener('click', async ()=>{
    if(!confirm('Permanently delete every medication, dose record, and vitals reading for everyone connected to this database? This cannot be undone.')) return;
    const btn = document.getElementById('clearAllBtn');
    btn.disabled = true; btn.textContent = 'Clearing…';
    try{
      await Store.clearAll();
      closeAllOverlays();
      toast('All info cleared');
    }catch(e){
      console.error('clearAll failed:', e);
      toast(friendlyFirestoreError(e));
      showConnBanner(friendlyFirestoreError(e));
      btn.disabled = false; btn.textContent = 'Clear all info';
    }
  });
  document.getElementById('closeSettingsBtn').addEventListener('click', closeAllOverlays);
  openOverlay('overlaySettings');
}
document.getElementById('settingsBtn').addEventListener('click', openSettings);

/* ---------------- Overlay helpers ---------------- */
function openOverlay(id){ closeAllOverlays(); document.getElementById(id).classList.add('open'); }
function closeAllOverlays(){ document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('open')); }
document.querySelectorAll('.overlay').forEach(o=>{ o.addEventListener('click', e=>{ if(e.target === o) closeAllOverlays(); }); });

document.getElementById('fabAdd').addEventListener('click', ()=>{
  if(activeTab === 'glucose') openGlucoseForm();
  else if(activeTab === 'pressure') openPressureForm();
  else openMedForm(null);
});

setInterval(()=>{ if(activeTab==='today') render(); }, 60000);

updateFabForTab();
boot();
})();
</script>
</body>
